        // MARK: - Wheel & Card Binding Helpers
        private var currentWheelLabels: [String] {
        switch selectedDial {
        case .aperture: return apertureSteps.map { abs($0 - round($0)) < 0.05 ? "f/\(Int(round($0)))" : String(format: "f/%.1f", $0) }
        case .distance: return distanceSteps.map { String(format: "%.1f m", $0) }
        case .shutter: return shutterSteps.map { FlashCalculator_App.formatShutter($0) }
        case .flashPower: return powerFractionSteps
        case .evBias: return evCompSteps.map { String(format: "%+.1f EV", $0) }
        }}

        private var currentWheelSelectedIndex: Int {
        switch selectedDial {
        case .aperture: return closestIndex(in: apertureSteps, to: aperture)
        case .distance: return closestIndex(in: distanceSteps, to: distance)
        case .shutter: return shutterSteps.firstIndex(of: shutter) ?? 10
        case .flashPower: return max(0, min(powerFractionSteps.count - 1, lockedPowerIdx))
        case .evBias: return closestIndex(in: evCompSteps, to: evComp)
        }}

        private func applyWheelSelection(_ idx: Int) {
        switch selectedDial {
        case .aperture:
        let s = max(0, min(apertureSteps.count - 1, idx)); aperture = apertureSteps[s]
        case .distance:
        let s = max(0, min(distanceSteps.count - 1, idx)); distance = distanceSteps[s]
        case .shutter:
        let s = max(0, min(shutterSteps.count - 1, idx)); shutter = shutterSteps[s]
        case .flashPower:
        let s = max(0, min(powerFractionSteps.count - 1, idx)); lockedPowerIdx = s; isPowerLocked = true
        case .evBias:
        let s = max(0, min(evCompSteps.count - 1, idx)); evComp = evCompSteps[s]
        }}

        private func cardValueText(for param: DialParameter) -> String {
        switch param {
        EOF

    - name: Generate LumiFilmApp.swift (Part 9/11)
      run: |
        cat << 'EOF' >> LumiFilmBuild/LumiFilm/LumiFilmApp.swift
        case .aperture: return abs(aperture - round(aperture)) < 0.05 ? "f/\(Int(round(aperture)))" : String(format: "f/%.1f", aperture)
        case .distance: return String(format: "%.1fm", distance)
        case .shutter: return FlashCalculator_App.formatShutter(shutter)
        case .flashPower: return isPowerLocked ? "🔒\(powerFractionSteps[max(0, min(powerFractionSteps.count - 1, lockedPowerIdx))])" : powerCalculation.mainFraction
        case .evBias: return String(format: "%+.1f", evComp)
        }}

        private func closestIndex(in arr: [Double], to val: Double) -> Int {
        arr.enumerated().min(by: { abs($0.element - val) < abs($1.element - val) })?.offset ?? 0 }

        private var frameRecords: [FilmFrameRecord] {
        guard let d = recordsJSON.data(using: .utf8), let arr = try? JSONDecoder().decode([FilmFrameRecord].self, from: d) else { return [] }
        return arr }

        private func saveFrameRecords(_ list: [FilmFrameRecord]) {
        if let d = try? JSONEncoder().encode(list), let s = String(data: d, encoding: .utf8) { recordsJSON = s }}

        private func recordCurrentFrame(placeText: String) {
        let df = DateFormatter(); df.dateFormat = "MM-dd HH:mm"
        let rec = FilmFrameRecord(
        frameNumber: currentFrameNumber,
        filmStockName: currentFilmStock.name,
        aperture: aperture,
        shutterDenom: shutter,
        distance: distance,
        powerLabel: powerCalculation.mainFraction,
        iso: effectiveISO,
        evComp: evComp,
        filterName: ndFilterStops > 0 ? "ND\(Int(pow(2.0, ndFilterStops)))" : "None",
        locationText: placeText,
        sceneNote: sceneNoteDraft,
        timestamp: df.string(from: Date()))
        var list = frameRecords
        list.insert(rec, at: 0)
        saveFrameRecords(list)
        currentFrameNumber = min(filmFormat.maxFrames, currentFrameNumber + 1)
        sceneNoteDraft = ""
        feedback.zeroEVSnapFeedback(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled) }

        private func deleteFrameRecord(_ id: UUID) {
        var list = frameRecords
        if let first = list.first, first.id == id && currentFrameNumber > 1 {
        currentFrameNumber = max(1, first.frameNumber)
        }
        list.removeAll { $0.id == id }
        saveFrameRecords(list) }

        private func exportRecordsToCSV() {
        var csv = "Frame,Film,ISO,FlashPower,Aperture,Shutter,Distance_m,EV_Bias,Filter,Location,Note,Timestamp\n"
        for r in frameRecords {
        let cleanLoc = r.locationText.replacingOccurrences(of: ",", with: " ")
        let cleanNote = r.sceneNote.replacingOccurrences(of: ",", with: " ")
        csv += "\(r.frameNumber),\(r.filmStockName),\(Int(r.iso)),\(r.powerLabel),f/\(r.aperture),\(FlashCalculator_App.formatShutter(r.shutterDenom)),\(r.distance),\(r.evComp),\(r.filterName),\(cleanLoc),\(cleanNote),\(r.timestamp)\n"
        }
        let url = FileManager.default.temporaryDirectory.appendingPathComponent("LumiFilm_RollLog.csv")
        try? csv.write(to: url, atomically: true, encoding: .utf8)
        exportedCSVURL = url }

