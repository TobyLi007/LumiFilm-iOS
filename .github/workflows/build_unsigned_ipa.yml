        "\(aperture)|\(distance)|\(shutter)|\(effectiveISO)|\(effectiveGNAt100)|\(maxSyncSpeed)|\(evComp)|\(totalFlashLossEV)|\(themeRaw)|\(formatRaw)|\(syncModeRaw)|\(isPowerLocked)|\(lockedPowerIdx)|\(flashZoomMM)|\(pushPullStops)|\(subtractAmbientInFill)" }

