         private var exportedRollMarkdown: String {
          let header = String(format: "# LumiFilm Roll #%02d · %@ · %@\nFrame | Aperture | Shutter | Flash Power | Dist | ISO | EV Comp | Filter | Time\n",
           currentRollNumber, isoMenuLabel(for: filmISO), topBarFlashSummary)
          let rows = rollFrames.map {
           String(format: "#%02d | %@ | 1/%ds | %@ | %.1fm | ISO %.0f | %+.1fEV | %@ | %@",
            $0.frameNumber, formatFStop($0.aperture), $0.shutterDenom, $0.powerLabel, $0.distance, $0.iso, $0.evComp, $0.filterName, $0.timestamp)
          }.joined(separator: "\n")
          return header + rows
         }
