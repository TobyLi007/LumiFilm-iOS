      // MARK: - v10.7.0 Full-Quadrant Vanishing 3D Barrel Wheel View
      struct iOSClockDrumWheelView: View {
          let theme: AppTheme
          let title: String
          let unit: String
          let items: [String]
          @Binding var selectedIndex: Int
          var onStepTick: () -> Void
          var onEndScroll: () -> Void
          var onResetZero: (() -> Void)? = nil

          @State private var dragOffset: CGFloat = 0

          var body: some View {
              GeometryReader { geo in
                  let totalW = geo.size.width
                  let totalH = geo.size.height
                  let headerH: CGFloat = 26
                  let drumH = max(120, totalH - headerH)
                  let rowStep: CGFloat = 27.0
                  let cylinderRadius: CGFloat = drumH * 0.49
                  let fractionalShift = -dragOffset / rowStep

                  ZStack(alignment: .top) {
                      // 1. Deep 3D Recessed Barrel Housing Background filling 100% of quadrant
                      RoundedRectangle(cornerRadius: 16, style: .continuous)
                          .fill(
                              LinearGradient(
                                  colors: [
                                      Color.black.opacity(0.92),
                                      theme.panelCard,
                                      theme.panelCard.opacity(0.95),
                                      Color.black.opacity(0.92)
                                  ],
                                  startPoint: .top,
                                  endPoint: .bottom
                              )
                          )

                      // 2. Full-Height 3D Cylindrical Drum Area
                      ZStack {
                          // Subtle Horizontal Knurled Barrel Grooves (Simulates Physical Metal/Rubber Roller)
                          VStack(spacing: 6) {
                              ForEach(0..<24, id: \.self) { _ in
                                  Rectangle()
                                      .fill(Color.white.opacity(0.025))
                                      .frame(height: 1)
                              }
                          }
                          .padding(.horizontal, 14)

                          // Left & Right Mechanical Knurled Gear Ticks along the barrel rim
                          HStack {
                              VStack(spacing: 5) {
                                  ForEach(0..<22, id: \.self) { idx in
                                      RoundedRectangle(cornerRadius: 1)
                                          .fill(idx == 10 || idx == 11 ? theme.accent.opacity(0.85) : Color.white.opacity(0.16))
                                          .frame(width: idx == 10 || idx == 11 ? 8 : 5, height: 1.6)
                                  }
                              }
                              Spacer()
                              VStack(spacing: 5) {
                                  ForEach(0..<22, id: \.self) { idx in
                                      RoundedRectangle(cornerRadius: 1)
                                          .fill(idx == 10 || idx == 11 ? theme.accent.opacity(0.85) : Color.white.opacity(0.16))
                                          .frame(width: idx == 10 || idx == 11 ? 8 : 5, height: 1.6)
                                  }
                              }
                          }
                          .padding(.horizontal, 6)
                          .mask(
                              LinearGradient(
                                  stops: [
                                      .init(color: .clear, location: 0.00),
                                      .init(color: .black.opacity(0.5), location: 0.18),
                                      .init(color: .black, location: 0.45),
                                      .init(color: .black, location: 0.55),
                                      .init(color: .black.opacity(0.5), location: 0.82),
                                      .init(color: .clear, location: 1.00)
                                  ],
                                  startPoint: .top,
                                  endPoint: .bottom
                              )
                          )

                          // Center Magnifier Selection Lens Bar
                          RoundedRectangle(cornerRadius: 10, style: .continuous)
                              .fill(
                                  LinearGradient(
                                      colors: [
                                          theme.accent.opacity(0.24),
                                          theme.accent.opacity(0.12),
                                          theme.accent.opacity(0.24)
                                      ],
                                      startPoint: .leading,
                                      endPoint: .trailing
                                  )
                              )
                              .frame(width: totalW - 14, height: 34)
                              .overlay(
                                  RoundedRectangle(cornerRadius: 10, style: .continuous)
                                      .stroke(theme.accent.opacity(0.80), lineWidth: 1.3)
                              )
                              .shadow(color: theme.accent.opacity(0.28), radius: 6, x: 0, y: 0)

                          // Left & Right Precision Pointer Triangles at Center Equator
                          HStack {
                              Image(systemName: "play.fill")
                                  .font(.system(size: 8, weight: .black))
                                  .foregroundColor(theme.accent)
                              Spacer()
                              Image(systemName: "play.fill")
                                  .font(.system(size: 8, weight: .black))
                                  .scaleEffect(x: -1, y: 1)
                                  .foregroundColor(theme.accent)
                          }
                          .padding(.horizontal, 11)

                          // 3D Cylindrical Drum Slots (-3...+3) with True Circular Arc & Vanishing Gradient
                          ZStack {
                              ForEach(-3...3, id: \.self) { rel in
                                  let idx = selectedIndex + rel
                                  if idx >= 0 && idx < items.count {
                                      let continuousRel = CGFloat(rel) - fractionalShift
                                      let normalized = max(-1.0, min(1.0, continuousRel / 3.3))
                                      let angleDeg = Double(normalized) * 76.0
                                      let rad = angleDeg * .pi / 180.0
                                      let yArcOffset = CGFloat(sin(rad)) * cylinderRadius
                                      let cosScale = max(0.45, CGFloat(cos(rad)))
                                      let isCenter = abs(continuousRel) < 0.45

                                      HStack(spacing: 4) {
                                          Text(items[idx])
                                              .font(.system(size: isCenter ? 22 : 15, weight: isCenter ? .black : .semibold, design: .monospaced))
                                              .foregroundColor(isCenter ? theme.accent : theme.textPrimary)
                                              .lineLimit(1)
                                              .minimumScaleFactor(0.7)

                                          if isCenter && !unit.isEmpty {
                                              Text(unit)
                                                  .font(.system(size: 10, weight: .heavy, design: .monospaced))
                                                  .foregroundColor(theme.secondaryAccent)
                                          }
                                      }
                                      .frame(width: totalW - 28, height: 32)
                                      // Compress vertically at top/bottom poles like a physical curved drum
                                      .scaleEffect(x: 0.88 + 0.12 * cosScale, y: cosScale)
                                      .rotation3DEffect(
                                          .degrees(-angleDeg * 0.65),
                                          axis: (x: 1, y: 0, z: 0),
                                          perspective: 0.45
                                      )
                                      // Smooth vanishing opacity toward the upper & lower curved edges
                                      .opacity(Double(pow(cosScale, 1.65)))
                                      .offset(y: yArcOffset)
                                  }
                              }
                          }
                          .frame(width: totalW, height: drumH)
                          .clipped()
                          // Full-Aperture Vanishing Gradient Mask (0.0 -> 1.0 -> 0.0)
                          .mask(
                              LinearGradient(
                                  stops: [
                                      .init(color: .clear, location: 0.00),
                                      .init(color: .black.opacity(0.28), location: 0.14),
                                      .init(color: .black.opacity(0.85), location: 0.32),
                                      .init(color: .black, location: 0.50),
                                      .init(color: .black.opacity(0.85), location: 0.68),
                                      .init(color: .black.opacity(0.28), location: 0.86),
                                      .init(color: .clear, location: 1.00)
                                  ],
                                  startPoint: .top,
                                  endPoint: .bottom
                              )
                          )

                          // Top & Bottom Deep Curved Barrel Shadow Vignette Overlay
                          VStack(spacing: 0) {
                              LinearGradient(
                                  colors: [
                                      Color.black.opacity(0.78),
                                      Color.black.opacity(0.25),
                                      Color.clear
                                  ],
                                  startPoint: .top,
                                  endPoint: .bottom
                              )
                              .frame(height: drumH * 0.28)

                              Spacer(minLength: 0)

                              LinearGradient(
                                  colors: [
                                      Color.clear,
                                      Color.black.opacity(0.25),
                                      Color.black.opacity(0.78)
                                  ],
                                  startPoint: .top,
                                  endPoint: .bottom
                              )
                              .frame(height: drumH * 0.28)
                          }
                          .allowsHitTesting(false)
                      }
                      .frame(width: totalW, height: drumH)
                      .offset(y: headerH)
                      .contentShape(Rectangle())
                      .gesture(
                          DragGesture(minimumDistance: 2)
                              .onChanged { val in
                                  dragOffset = val.translation.height
                                  let steps = Int((-dragOffset / rowStep).rounded())
                                  if steps != 0 {
                                      let next = max(0, min(items.count - 1, selectedIndex + steps))
                                      if next != selectedIndex {
                                          selectedIndex = next
                                          onStepTick()
                                      }
                                      dragOffset = 0
                                  }
                              }
                              .onEnded { _ in
                                  dragOffset = 0
                                  onEndScroll()
                              }
                      )

                      // 3. Compact Top Header Ribbon Floating cleanly at top of the wheel box
                      HStack(spacing: 4) {
                          Image(systemName: "dial.medium.fill")
                              .font(.system(size: 10, weight: .bold))
                              .foregroundColor(theme.accent)
                          Text("\(title) 滚轮")
                              .font(.system(size: 11, weight: .heavy, design: .rounded))
                              .foregroundColor(theme.textPrimary)
                          Spacer(minLength: 2)

                          if let resetAction = onResetZero {
                              Button {
                                  resetAction()
                              } label: {
                                  Text("0.0归零")
                                      .font(.system(size: 9, weight: .bold, design: .monospaced))
                                      .padding(.horizontal, 5)
                                      .padding(.vertical, 2)
                                      .background(theme.secondaryAccent.opacity(0.24))
                                      .foregroundColor(theme.secondaryAccent)
                                      .clipShape(Capsule())
                              }
                          } else {
                              // Quick +/- 1/3-stop step buttons
                              HStack(spacing: 4) {
                                  Button {
                                      if selectedIndex > 0 {
                                          selectedIndex -= 1
                                          onStepTick()
                                          onEndScroll()
                                      }
                                  } label: {
                                      Image(systemName: "minus")
                                          .font(.system(size: 9, weight: .black))
                                          .foregroundColor(theme.textSecondary)
                                          .frame(width: 18, height: 18)
                                          .background(Color.white.opacity(0.08))
                                          .clipShape(Circle())
                                  }
                                  Button {
                                      if selectedIndex < items.count - 1 {
                                          selectedIndex += 1
                                          onStepTick()
                                          onEndScroll()
                                      }
                                  } label: {
                                      Image(systemName: "plus")
                                          .font(.system(size: 9, weight: .black))
                                          .foregroundColor(theme.accent)
                                          .frame(width: 18, height: 18)
                                          .background(theme.accent.opacity(0.18))
                                          .clipShape(Circle())
                                  }
                              }
                          }
                      }
                      .padding(.horizontal, 9)
                      .frame(height: headerH)
                      .background(Color.black.opacity(0.55))
                  }
                  .clipShape(RoundedRectangle(cornerRadius: 16, style: .continuous))
                  .overlay(
                      RoundedRectangle(cornerRadius: 16, style: .continuous)
                          .stroke(
                              LinearGradient(
                                  colors: [
                                      theme.accent.opacity(0.45),
                                      Color.white.opacity(0.10),
                                      theme.accent.opacity(0.35)
                                  ],
                                  startPoint: .topLeading,
                                  endPoint: .bottomTrailing
                              ),
                              lineWidth: 1.2
                          )
                  )
              }
          }
      }

      // MARK: - Live Camera Viewfinder + Tap-to-Spot-Meter & Focus + HOLD Lock Sheet (v10.7.0 1x LiDAR Locked)
      struct CameraAmbientMeterSheet: View {
          let theme: AppTheme
          @ObservedObject var cameraReader: CameraAmbientEVReader
          let targetFilmISO: Double
          let currentAperture: Double
          let currentShutterSpeed: Double
          var onApplyAmbientEV: (Double, Double) -> Void
          var onApplySuggestedShutter: (Int) -> Void
          var onApplyMeasuredDistance: (Double) -> Void
          @Environment(\.dismiss) private var dismiss

          var suggestedShutterIndex: Int {
              let targetTime = (currentAperture * currentAperture) / pow(2.0, cameraReader.measuredEV100 + log2(targetFilmISO / 100.0))
              var bestIdx = 0
              var minDiff = Double.greatestFiniteMagnitude
              for (i, spd) in ContentView.shutterSpeeds.enumerated() {
                  let diff = abs(log2(spd / max(0.0005, targetTime)))
                  if diff < minDiff {
                      minDiff = diff
                      bestIdx = i
                  }
              }
              return bestIdx
          }

          var ambientDiffAgainstCurrent: Double {
              let currentSettingEV100 = log2((currentAperture * currentAperture) / currentShutterSpeed) - log2(targetFilmISO / 100.0)
              return cameraReader.measuredEV100 - currentSettingEV100
          }

          var body: some View {
              NavigationStack {
                  ZStack {
                      theme.backgroundBottom.ignoresSafeArea()
                      VStack(spacing: 12) {
                          // Live Camera Preview with Tap-to-Spot-Meter & Focus Reticle
                          ZStack {
                              if cameraReader.isRunning {
                                  CameraPreviewLayerView(session: cameraReader.session) { normalizedPt in
                                      cameraReader.setSpotFocusAndExposure(normalizedPoint: normalizedPt)
                                      FeedbackEngine.shared.playClick(theme: theme)
                                  }
                                  .clipShape(RoundedRectangle(cornerRadius: 18, style: .continuous))
                              } else {
                                  RoundedRectangle(cornerRadius: 18, style: .continuous)
                                      .fill(theme.panelCard)
                                      .overlay(
                                          VStack(spacing: 8) {
                                              Image(systemName: "camera.Macro")
                                                  .font(.system(size: 34))
                                                  .foregroundColor(theme.accent)
                                              Text(cameraReader.statusText)
                                                  .font(.system(size: 13, weight: .semibold))
                                                  .foregroundColor(theme.textSecondary)
                                          }
                                      )
                              }

                              // Interactive Spot Metering & Focus Reticle at tapped point
                              GeometryReader { geo in
                                  let px = cameraReader.focusPointNormalized.x * geo.size.width
                                  let py = cameraReader.focusPointNormalized.y * geo.size.height
                                  ZStack {
                                      Circle()
