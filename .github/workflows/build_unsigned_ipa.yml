        var closestPowerStop: (label: String, diffEV: Double, isOverLimit: Bool, isUnderMin: Bool) {
            if flashPowerLockEnabled {
                return (lockedPowerFraction.label, 0.0, false, false)
            }
            let ratio = max(0.0001, powerRatio)
            if ratio > 1.18 {
                let overEV = log2(ratio)
                return ("MAX 过载", overEV, true, false)
            }
            let minAllowed = currentFlash.minPowerFraction
            if ratio < minAllowed * 0.70 {
                let underEV = log2(ratio / minAllowed)
                return ("< \(formatFraction(minAllowed)) 过曝风险", underEV, false, true)
            }
            let validFractions = Self.powerFractions.filter { $0.value >= minAllowed - 0.0001 }
            var best = validFractions.first ?? ("1/1", 1.0)
            var minLogDiff = Double.greatestFiniteMagnitude
            for item in validFractions {
                let logDiff = abs(log2(ratio / item.value))
                if logDiff < minLogDiff {
                    minLogDiff = logDiff
                    best = item
                }
            }
            let residualEV = log2(ratio / best.value)
            return (best.label, residualEV, false, false)
        }

