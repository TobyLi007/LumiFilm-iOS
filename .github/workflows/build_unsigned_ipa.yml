            // Locks exclusively to 1x Wide / LiDAR sensor (never 0.5x Ultra-Wide) so LiDAR depth map is 100% co-axial
            private func selectCoAxial1xLiDARDevice() -> (AVCaptureDevice?, Bool, String) {
                if let lidar = AVCaptureDevice.default(.builtInLiDARDepthCamera, for: .video, position: .back) {
                    return (lidar, true, "LiDAR 激光雷达")
                }
                if let dualWide = AVCaptureDevice.default(.builtInDualWideCamera, for: .video, position: .back) {
                    return (dualWide, true, "Dual 双摄景深")
                }
                if let dual = AVCaptureDevice.default(.builtInDualCamera, for: .video, position: .back) {
                    return (dual, true, "Dual 双摄景深")
                }
                let wide = AVCaptureDevice.default(.builtInWideAngleCamera, for: .video, position: .back)
                return (wide, false, "1x 相位对焦测距")
            }

            private func configureAndStart() {
                if !isConfigured {
                    let (camOpt, hasDepth, badge) = selectCoAxial1xLiDARDevice()
                    guard let cam = camOpt else {
                        statusText = "未检测到后置 1x 广角摄像头"
                        return
                    }
                    self.device = cam
                    self.sensorModeBadge = badge

                    session.beginConfiguration()
                    session.sessionPreset = session.canSetSessionPreset(.photo) ? .photo : .high
                    for inp in session.inputs { session.removeInput(inp) }
                    if let input = try? AVCaptureDeviceInput(device: cam), session.canAddInput(input) {
                        session.addInput(input)
                    }
                    videoOutput.alwaysDiscardsLateVideoFrames = true
                    videoOutput.setSampleBufferDelegate(self, queue: queue)
                    if session.canAddOutput(videoOutput) {
                        session.addOutput(videoOutput)
                    }
                    depthOutput.isFilteringEnabled = true
                    depthOutput.setDelegate(self, callbackQueue: queue)
                    if session.canAddOutput(depthOutput) {
                        session.addOutput(depthOutput)
                    }
                    if let depthConn = depthOutput.connection(with: .depthData) {
                        depthConn.isEnabled = hasDepth
                        if depthConn.isVideoOrientationSupported {
                            depthConn.videoOrientation = .portrait
                        }
                    }
                    session.commitConfiguration()
                    isConfigured = true
                }
                if !session.isRunning {
                    queue.async {
                        self.session.startRunning()
                        DispatchQueue.main.async {
                            self.isRunning = true
                            self.setSpotFocusAndExposure(normalizedPoint: CGPoint(x: 0.5, y: 0.5))
                        }
                    }
                } else {
                    isRunning = true
                }
            }

            // Instant static tap resampling: even if the phone does not move at all, tapping any point immediately resamples the cached depth map at that coordinate!
            func setSpotFocusAndExposure(normalizedPoint: CGPoint) {
                let clampedX = max(0.06, min(0.94, normalizedPoint.x))
                let clampedY = max(0.06, min(0.94, normalizedPoint.y))
                let targetPt = CGPoint(x: clampedX, y: clampedY)
                DispatchQueue.main.async {
                    if self.isHoldLocked { self.isHoldLocked = false }
                    self.focusPointNormalized = targetPt
                }

                queue.async { [weak self] in
                    guard let self = self else { return }
                    self.forceInstantSample = true
                    self.lastTapTimestamp = Date().timeIntervalSinceReferenceDate

                    // Immediately resample cached LiDAR depth buffer at the newly tapped point without waiting for camera motion!
                    if let cachedDepth = self.latestDepthData {
                        if let sampled = self.sampleDepthMeters(from: cachedDepth, at: targetPt) {
                            self.smoothedDist = sampled
                            let rounded = max(0.30, min(20.0, (sampled * 100.0).rounded() / 100.0))
                            DispatchQueue.main.async {
                                self.measuredDistanceMeters = rounded
                            }
                        }
                    }

                    guard let cam = self.device else { return }
                    // Portrait layer (x, y) maps to landscape sensor (y, 1 - x)
                    let devicePt = CGPoint(x: targetPt.y, y: 1.0 - targetPt.x)
                    do {
                        try cam.lockForConfiguration()
                        if cam.isExposurePointOfInterestSupported {
                            cam.exposurePointOfInterest = devicePt
                        }
                        if cam.isExposureModeSupported(.autoExpose) {
                            cam.exposureMode = .autoExpose
                        } else if cam.isExposureModeSupported(.continuousAutoExposure) {
                            cam.exposureMode = .continuousAutoExposure
                        }
                        if cam.isFocusPointOfInterestSupported {
                            cam.focusPointOfInterest = devicePt
                        }
                        if cam.isFocusModeSupported(.autoFocus) {
                            cam.focusMode = .autoFocus
                        } else if cam.isFocusModeSupported(.continuousAutoFocus) {
                            cam.focusMode = .continuousAutoFocus
                        }
                        cam.unlockForConfiguration()
                    } catch {}
                }
            }

            private func sampleDepthMeters(from depthData: AVDepthData, at normPt: CGPoint) -> Double? {
                let converted = depthData.converting(toDepthDataType: kCVPixelFormatType_DepthFloat32)
                let buf = converted.depthDataMap
                CVPixelBufferLockBaseAddress(buf, .readOnly)
                defer { CVPixelBufferUnlockBaseAddress(buf, .readOnly) }

                let w = CVPixelBufferGetWidth(buf)
                let h = CVPixelBufferGetHeight(buf)
                let rowBytes = CVPixelBufferGetBytesPerRow(buf)
                guard let base = CVPixelBufferGetBaseAddress(buf), w > 4, h > 4 else { return nil }

                let nx: Double = (w > h) ? Double(normPt.y) : Double(normPt.x)
                let ny: Double = (w > h) ? Double(1.0 - normPt.x) : Double(normPt.y)
                let cx = max(0, min(w - 1, Int(Double(w) * nx)))
                let cy = max(0, min(h - 1, Int(Double(h) * ny)))
                let rx = max(2, w / 28)
                let ry = max(2, h / 28)

                var valid: [Float] = []
                for y in max(0, cy - ry)...min(h - 1, cy + ry) {
                    let rowPtr = base.advanced(by: y * rowBytes).assumingMemoryBound(to: Float32.self)
                    for x in max(0, cx - rx)...min(w - 1, cx + rx) {
                        let d = rowPtr[x]
                        if d.isFinite && d >= 0.25 && d <= 20.0 {
                            valid.append(d)
                        }
                    }
                }
                guard !valid.isEmpty else { return nil }
                valid.sort()
                // Use 35th-percentile front-surface median to lock onto foreground subject rather than background wall
                return Double(valid[max(0, valid.count * 35 / 100)])
            }

            func depthDataOutput(_ output: AVCaptureDepthDataOutput, didOutput depthData: AVDepthData, timestamp: CMTime, connection: AVCaptureConnection) {
                self.latestDepthData = depthData
                guard !isHoldLocked else { return }
                let pt = focusPointNormalized
                guard let sampled = sampleDepthMeters(from: depthData, at: pt) else { return }
                let now = Date().timeIntervalSinceReferenceDate
                if forceInstantSample || (now - lastTapTimestamp < 0.55) {
                    smoothedDist = sampled
                    forceInstantSample = false
                } else {
                    smoothedDist = smoothedDist * 0.45 + sampled * 0.55
                }
                lastDepthTimestamp = now
                let rounded = max(0.30, min(20.0, (smoothedDist * 100.0).rounded() / 100.0))
                DispatchQueue.main.async {
                    self.measuredDistanceMeters = rounded
                }
            }

            func captureOutput(_ output: AVCaptureOutput, didOutput sampleBuffer: CMSampleBuffer, from connection: AVCaptureConnection) {
                guard !isHoldLocked, let cam = device else { return }
                let now = Date().timeIntervalSinceReferenceDate
                guard now - lastUIUpdateTimestamp >= 0.07 else { return }
                lastUIUpdateTimestamp = now

                let ap = Double(max(cam.lensAperture, 1.2))
                let dur = max(CMTimeGetSeconds(cam.exposureDuration), 0.00005)
                let iso = Double(max(cam.iso, 20.0))
                let offset = Double(cam.exposureTargetOffset)
                let rawEV100 = log2((ap * ap) / dur) - log2(iso / 100.0) - offset
                let clampedEV = max(-3.0, min(19.0, rawEV100))

                if now - lastTapTimestamp < 0.50 {
                    smoothedEV = clampedEV
                } else {
                    smoothedEV = smoothedEV * 0.60 + clampedEV * 0.40
                }
                let roundedEV = (smoothedEV * 10.0).rounded() / 10.0

                // Fallback lens-position distance only if LiDAR depth hasn't arrived recently
                var fallbackDistance: Double? = nil
                if now - lastDepthTimestamp > 0.60 && !cam.isAdjustingFocus {
                    let lp = Double(max(0.03, min(0.97, cam.lensPosition)))
                    let est = 0.35 / pow(1.0 - lp, 0.82)
                    let clampedD = max(0.35, min(15.0, est))
                    if forceInstantSample || (now - lastTapTimestamp < 0.55) {
                        smoothedDist = clampedD
                        forceInstantSample = false
                    } else {
                        smoothedDist = smoothedDist * 0.55 + clampedD * 0.45
                    }
                    fallbackDistance = (smoothedDist * 100.0).rounded() / 100.0
                }

                DispatchQueue.main.async {
                    self.measuredEV100 = roundedEV
                    if let fd = fallbackDistance {
                        self.measuredDistanceMeters = fd
                    }
                }
            }
        }

        struct CameraPreviewLayerView: UIViewRepresentable {
            let session: AVCaptureSession
            var onTapPoint: (CGPoint) -> Void

            final class PreviewContainerView: UIView {
                override class var layerClass: AnyClass { AVCaptureVideoPreviewLayer.self }
                var previewLayer: AVCaptureVideoPreviewLayer { layer as! AVCaptureVideoPreviewLayer }
                var tapCallback: ((CGPoint) -> Void)?

                @objc func handleTap(_ gr: UITapGestureRecognizer) {
                    let loc = gr.location(in: self)
                    guard bounds.width > 1, bounds.height > 1 else { return }
                    let norm = CGPoint(x: max(0.05, min(0.95, loc.x / bounds.width)),
                                       y: max(0.05, min(0.95, loc.y / bounds.height)))
                    tapCallback?(norm)
                }
            }

            func makeUIView(context: Context) -> PreviewContainerView {
                let v = PreviewContainerView()
                v.backgroundColor = .black
                v.previewLayer.session = session
                v.previewLayer.videoGravity = .resizeAspectFill
                v.tapCallback = onTapPoint
                let tap = UITapGestureRecognizer(target: v, action: #selector(PreviewContainerView.handleTap(_:)))
                v.addGestureRecognizer(tap)
                return v
            }

            func updateUIView(_ uiView: PreviewContainerView, context: Context) {
                if uiView.previewLayer.session !== session {
                    uiView.previewLayer.session = session
                }
                uiView.tapCallback = onTapPoint
            }
        }

