        var reciprocityCorrectionInfo: (hasFailure: Bool, correctedSeconds: Double, additionalEV: Double, guideText: String) {
            guard currentShutterSpeed >= 1.0 else {
                return (false, currentShutterSpeed, 0.0, "")
            }
            let t = currentShutterSpeed
            let p: Double
            switch currentStock.brand {
            case .fujifilm:
                p = currentStock.isSlideFilm ? 1.24 : 1.18 // Provia/Velvia vs Acros/Superia
            case .ilford:
                p = 1.26 // HP5+ / FP4+ / Delta classic silver-halide slope
            case .kodak:
                p = currentStock.isSlideFilm ? 1.22 : 1.15 // Portra / Vision3 T-Grain forgiving slope
            case .cinestill:
                p = 1.16 // Vision3 500T / 800T tungsten core
            case .lomoOther:
                p = 1.28 // Classic emulsion higher reciprocity curve
            }
            let corrected = pow(t, p)
            let extraSeconds = max(0.0, corrected - t)
            let extraEV = log2(corrected / t)
            let formattedCorrected = corrected >= 10.0 ? String(format: "%.0fs", corrected) : String(format: "%.1fs", corrected)
            let formattedExtra = extraSeconds >= 10.0 ? String(format: "+%.0fs", extraSeconds) : String(format: "+%.1fs", extraSeconds)
            let text = "倒易律补偿：测光 \(currentShutterLabel) → 实曝需 \(formattedCorrected)（\(formattedExtra) / +\(String(format: "%.1f", extraEV)) EV）"
            return (true, corrected, extraEV, text)
        }

        var dofRange: (near: Double, far: Double, totalCM: Double) {
            let coc = filmFormat.circleOfConfusionMM
            let f = filmFormat.standardFocalLengthMM
            let N = apertureF
            let sMM = distanceMeters * 1000.0
            let H = (f * f) / (N * coc) + f
            let nearMM = (sMM * (H - f)) / (H + sMM - 2.0 * f)
            let farMM: Double
            if sMM >= H {
                farMM = 999000.0
            } else {
                farMM = (sMM * (H - f)) / (H - sMM)
            }
            let nearM = max(0.1, nearMM / 1000.0)
            let farM = min(999.0, max(nearM, farMM / 1000.0))
            let totalCM = min(999.0, (farM - nearM) * 100.0)
            return (nearM, farM, totalCM)
        }

