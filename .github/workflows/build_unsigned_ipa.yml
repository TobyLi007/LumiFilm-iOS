name: Build LumiFilm Unsigned IPA (iOS + Widget)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: "${{ secrets.GITHUB_TOKEN }}"

    - name: Generate Project Config, Entitlements & 3D AppIcon
      run: |
        mkdir -p LumiFilmBuild/LumiFilm/Assets.xcassets/AppIcon.appiconset LumiFilmBuild/LumiFilmWidget

        # 1. Create Assets.xcassets Contents.json
        cat << 'EOF' > LumiFilmBuild/LumiFilm/Assets.xcassets/Contents.json
        {
        "info" : { "author" : "xcode", "version" : 1 }
        }
        EOF

        cat << 'EOF' > LumiFilmBuild/LumiFilm/Assets.xcassets/AppIcon.appiconset/Contents.json
        {
        "images" : [
        {
        "filename" : "AppIcon.png",
        "idiom" : "universal",
        "platform" : "ios",
        "size" : "1024x1024"
        }
        ],
        "info" : { "author" : "xcode", "version" : 1 }
        }
        EOF

        # 2. Generate 1024x1024 3D Dynamic Glossy Liquid-Glass App Icon
        cat << 'EOF' > make_icon.swift
        import AppKit; import CoreGraphics; import Darwin; let size = 1024; let colorSpace = CGColorSpaceCreateDeviceRGB()
        guard let ctx = CGContext(data: nil, width: size, height: size, bitsPerComponent: 8, bytesPerRow: 0, space: colorSpace, bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue) else { exit(1) }
        let center = CGPoint(x: 512.0, y: 512.0); let bgColors = [
        CGColor(red: 0.03, green: 0.04, blue: 0.08, alpha: 1.0), CGColor(red: 0.10, green: 0.07, blue: 0.14, alpha: 1.0), CGColor(red: 0.22, green: 0.11, blue: 0.06, alpha: 1.0)
        ] as CFArray
        let bgGrad = CGGradient(colorsSpace: colorSpace, colors: bgColors, locations: [0.0, 0.55, 1.0])!; ctx.drawLinearGradient(bgGrad, start: CGPoint(x: 100, y: 980), end: CGPoint(x: 924, y: 40), options: []); let auraColors = [
        CGColor(red: 1.0, green: 0.62, blue: 0.18, alpha: 0.65), CGColor(red: 0.25, green: 0.78, blue: 1.0, alpha: 0.30), CGColor(red: 0.0, green: 0.0, blue: 0.0, alpha: 0.0)
        ] as CFArray
        let auraGrad = CGGradient(colorsSpace: colorSpace, colors: auraColors, locations: [0.0, 0.50, 1.0])!; ctx.drawRadialGradient(auraGrad, startCenter: CGPoint(x: 512, y: 540), startRadius: 20, endCenter: center, endRadius: 490, options: []); ctx.saveGState()
        for arcIdx in 0..<6 { let radius = CGFloat(355 + arcIdx * 20); let startA = Double(arcIdx) * 0.45 + 0.2; let endA = startA + 1.15
        ctx.addArc(center: center, radius: radius, startAngle: CGFloat(startA), endAngle: CGFloat(endA), clockwise: false); ctx.setStrokeColor(arcIdx % 2 == 0 ? CGColor(red: 1.0, green: 0.68, blue: 0.24, alpha: 0.55) : CGColor(red: 0.38, green: 0.88, blue: 1.0, alpha: 0.50))
        ctx.setLineWidth(CGFloat(10 - arcIdx)); ctx.setLineCap(.round); ctx.strokePath() }
        ctx.restoreGState(); let glassRect = CGRect(x: 96, y: 96, width: 832, height: 832); let glassPath = CGPath(roundedRect: glassRect, cornerWidth: 210, cornerHeight: 210, transform: nil); ctx.saveGState(); ctx.addPath(glassPath); ctx.clip(); let glassColors = [
        CGColor(red: 1.0, green: 1.0, blue: 1.0, alpha: 0.32), CGColor(red: 0.85, green: 0.92, blue: 1.0, alpha: 0.12), CGColor(red: 0.12, green: 0.10, blue: 0.16, alpha: 0.48), CGColor(red: 0.98, green: 0.65, blue: 0.28, alpha: 0.28)
        ] as CFArray
        let glassGrad = CGGradient(colorsSpace: colorSpace, colors: glassColors, locations: [0.0, 0.35, 0.75, 1.0])!; ctx.drawLinearGradient(glassGrad, start: CGPoint(x: 160, y: 920), end: CGPoint(x: 860, y: 110), options: [])
        let specRect = CGRect(x: 130, y: 540, width: 764, height: 360); let specPath = CGPath(roundedRect: specRect, cornerWidth: 180, cornerHeight: 180, transform: nil); ctx.addPath(specPath); ctx.setFillColor(CGColor(red: 1.0, green: 1.0, blue: 1.0, alpha: 0.12)); ctx.fillPath(); ctx.restoreGState()
        ctx.saveGState(); ctx.addPath(glassPath); ctx.setStrokeColor(CGColor(red: 1.0, green: 0.84, blue: 0.55, alpha: 0.65)); ctx.setLineWidth(8.0); ctx.strokePath(); ctx.restoreGState()
        let dialRadius: CGFloat = 290.0; ctx.saveGState(); ctx.addArc(center: center, radius: dialRadius, startAngle: 0, endAngle: .pi * 2, clockwise: false); ctx.setFillColor(CGColor(red: 0.06, green: 0.06, blue: 0.09, alpha: 0.88)); ctx.fillPath()
        ctx.addArc(center: center, radius: dialRadius, startAngle: 0, endAngle: .pi * 2, clockwise: false); ctx.setStrokeColor(CGColor(red: 0.95, green: 0.72, blue: 0.34, alpha: 0.92)); ctx.setLineWidth(14.0); ctx.strokePath()
        for tick in 0..<36 { let angle = Double(tick) * (.pi * 2.0 / 36.0); let isMajor = (tick % 3 == 0); let rIn: CGFloat = isMajor ? 242.0 : 258.0; let rOut: CGFloat = 274.0
        let p1 = CGPoint(x: center.x + CGFloat(cos(angle)) * rIn, y: center.y + CGFloat(sin(angle)) * rIn); let p2 = CGPoint(x: center.x + CGFloat(cos(angle)) * rOut, y: center.y + CGFloat(sin(angle)) * rOut)
        ctx.move(to: p1); ctx.addLine(to: p2); ctx.setStrokeColor(isMajor ? CGColor(red: 1.0, green: 0.82, blue: 0.44, alpha: 0.95) : CGColor(red: 1.0, green: 1.0, blue: 1.0, alpha: 0.42)); ctx.setLineWidth(isMajor ? 6.0 : 3.0); ctx.setLineCap(.round); ctx.strokePath() }
        let bolt = CGMutablePath(); bolt.move(to: CGPoint(x: 548, y: 700)); bolt.addLine(to: CGPoint(x: 418, y: 520)); bolt.addLine(to: CGPoint(x: 520, y: 520)); bolt.addLine(to: CGPoint(x: 472, y: 324)); bolt.addLine(to: CGPoint(x: 612, y: 506)); bolt.addLine(to: CGPoint(x: 508, y: 506)); bolt.closeSubpath()
        ctx.addPath(bolt); ctx.setFillColor(CGColor(red: 1.0, green: 0.78, blue: 0.32, alpha: 1.0)); ctx.fillPath(); ctx.restoreGState()
        if let cgImg = ctx.makeImage() { let rep = NSBitmapImageRep(cgImage: cgImg); if let pngData = rep.representation(using: .png, properties: [:]) { try? pngData.write(to: URL(fileURLWithPath: "LumiFilmBuild/LumiFilm/Assets.xcassets/AppIcon.appiconset/AppIcon.png")) }}
        EOF
        swift make_icon.swift

        cat << 'EOF' > LumiFilmBuild/LumiFilm.entitlements
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>com.apple.security.application-groups</key>
            <array>
                <string>group.com.lumifilm.flashmeter</string>
            </array>
        </dict>
        </plist>
        EOF

        cat << 'EOF' > LumiFilmBuild/project.yml
        name: LumiFilm
        options:
          bundleIdPrefix: com.lumifilm
          deploymentTarget:
            iOS: "17.0"
        settings:
          base:
            SWIFT_VERSION: "5.0"
            TARGETED_DEVICE_FAMILY: "1,2"
            MARKETING_VERSION: "10.7.2"
            CURRENT_PROJECT_VERSION: "1072"
            CODE_SIGN_IDENTITY: ""
            CODE_SIGNING_REQUIRED: NO
            CODE_SIGNING_ALLOWED: NO
        targets:
          LumiFilm:
            type: application
            platform: iOS
            sources:
              - path: LumiFilm
            settings:
              base:
                PRODUCT_BUNDLE_IDENTIFIER: com.lumifilm.app
                ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
            dependencies:
              - target: LumiFilmWidget
                embed: true
            info:
              path: LumiFilm/Info.plist
              properties:
                CFBundleDisplayName: LumiFilm
                CFBundleShortVersionString: "10.7.2"
                CFBundleVersion: "1072"
                UILaunchScreen: {}
                NSCameraUsageDescription: "LumiFilm needs camera access to measure real-time ambient EV100 and LiDAR subject distance."
                NSMicrophoneUsageDescription: "LumiFilm uses the microphone for hands-free voice exposure commands."
                NSSpeechRecognitionUsageDescription: "LumiFilm recognizes voice commands for aperture, shutter, distance, and flash mode."
                NSLocationWhenInUseUsageDescription: "LumiFilm logs GPS street addresses for your analog film roll frames."
                UISupportedInterfaceOrientations:
                  - UIInterfaceOrientationPortrait
          LumiFilmWidget:
            type: app-extension
            platform: iOS
            sources:
              - path: LumiFilmWidget
            settings:
              base:
                PRODUCT_BUNDLE_IDENTIFIER: com.lumifilm.app.widget
            info:
              path: LumiFilmWidget/Info.plist
              properties:
                CFBundleDisplayName: LumiFilm Widget
                CFBundleShortVersionString: "10.7.2"
                CFBundleVersion: "1072"
                NSExtension:
                  NSExtensionPointIdentifier: com.apple.widgetkit-extension
        EOF

    - name: Generate LumiFilmWidget.swift (Part 1/2)
      run: |
        cat << 'EOF' > LumiFilmBuild/LumiFilmWidget/LumiFilmWidget.swift
        import WidgetKit; import SwiftUI; import AppIntents; import UIKit; import Foundation; import Darwin
        enum WidgetTheme: Int { case sakuraMist = 0; case threadsObsidian = 1; case filmBrass = 2
        var backgroundGradient: [Color] { switch self {
        case .sakuraMist: return [Color(red: 0.17, green: 0.16, blue: 0.20), Color(red: 0.24, green: 0.20, blue: 0.23), Color(red: 0.14, green: 0.14, blue: 0.17)]
        case .threadsObsidian: return [Color(red: 0.03, green: 0.03, blue: 0.04), Color(red: 0.09, green: 0.09, blue: 0.11), Color(red: 0.04, green: 0.04, blue: 0.05)]
        case .filmBrass: return [Color(red: 0.09, green: 0.08, blue: 0.07), Color(red: 0.19, green: 0.14, blue: 0.09), Color(red: 0.08, green: 0.07, blue: 0.06)] }}
        var accent: Color { switch self {
        case .sakuraMist: return Color(red: 0.94, green: 0.79, blue: 0.82)
        case .threadsObsidian: return Color(red: 0.96, green: 0.96, blue: 0.98)
        case .filmBrass: return Color(red: 0.90, green: 0.68, blue: 0.32) }}
        var secondaryAccent: Color { switch self {
        case .sakuraMist: return Color(red: 0.86, green: 0.82, blue: 0.78)
        case .threadsObsidian: return Color(red: 0.58, green: 0.62, blue: 0.70)
        case .filmBrass: return Color(red: 0.78, green: 0.48, blue: 0.22) }}}
        struct FlashCalculator {
        static let apertureSteps: [Double] = [1.0, 1.2, 1.4, 1.8, 2.0, 2.8, 3.5, 4.0, 5.6, 8.0, 11.0, 16.0, 22.0]
        static let shutterSteps: [Int] = [-15, -8, -4, -2, 1, 2, 4, 8, 15, 30, 50, 60, 90, 100, 125, 200, 250, 500, 1000, 2000, 4000]
        static let distanceSteps: [Double] = [0.5, 0.7, 1.0, 1.2, 1.5, 2.0, 2.5, 3.0, 4.0, 5.0, 7.0, 10.0, 15.0]
        static let isoSteps: [Double] = [50, 64, 100, 125, 160, 200, 250, 320, 400, 500, 800, 1600, 3200]
        static let evCompSteps: [Double] = [-2.0, -1.7, -1.3, -1.0, -0.7, -0.3, 0.0, 0.3, 0.7, 1.0, 1.3, 1.7, 2.0]
        static func formatShutter(_ s: Int) -> String { s < 0 ? "\(-s)\"" : (s == 1 ? "1\"" : "1/\(s)s") }
        static func closeUpBellowsLoss(distance: Double, formatRaw: Int) -> Double { switch formatRaw {
        case 1: return distance < 1.2 ? (0.50 * (1.2 - distance)) : 0.0
        case 2: return distance < 1.2 ? (0.60 * (1.2 - distance)) : 0.0
        case 3, 4: return distance < 1.3 ? (0.75 * (1.3 - distance)) : 0.0
        default: return distance < 1.0 ? (0.35 * (1.0 - distance)) : 0.0 }}
        static func powerComponents(gnAt100: Double, iso: Double, distance: Double, aperture: Double, shutter: Int, maxSync: Int, lossEV: Double, formatRaw: Int = 0, syncModeRaw: Int = 0) -> (mainFraction: String, trimBadge: String?, statusNote: String, isWarning: Bool) {
        let isoFactor = sqrt(max(iso, 25.0) / 100.0); let closeUpLoss = closeUpBellowsLoss(distance: distance, formatRaw: formatRaw); let effMaxSync = syncModeRaw == 1 ? max(maxSync, 500) : maxSync; let isOverSync = shutter > effMaxSync
        if syncModeRaw == 0 && isOverSync { return ("黑边!", "超同步", "超 1/\(effMaxSync)s 幕帘黑边", true) }
        let hssStops = (syncModeRaw == 2 && isOverSync) ? log2(Double(shutter) / Double(effMaxSync)) : 0.0; let hssLoss = hssStops > 0 ? (1.5 + 1.0 * hssStops) : 0.0
        let effGN = gnAt100 * isoFactor * pow(2.0, -(lossEV + hssLoss + closeUpLoss) / 2.0); let maxAp = effGN / max(distance, 0.3); let reqRatio = aperture / max(maxAp, 0.05); let reqPower = reqRatio * reqRatio
        if reqPower > 1.05 { let def = log2(reqPower); return ("OVER", String(format: "-%.1fEV", def), "全功率仍欠曝", true) }
        if reqPower < (1.0 / 256.0) { return ("LOW", "<1/128", "距离过近·收小光圈", true) }
        let rawStops = log2(1.0 / reqPower); let rounded = round(rawStops * 3.0) / 3.0; let whole = max(0, min(7, Int(round(rounded)))); let denom = 1 << whole; let trim = Double(whole) - rounded; let base = denom == 1 ? "1/1" : "1/\(denom)"
        if abs(trim) < 0.14 { return (base, nil, "精准整档输出", false) }
        return (base, String(format: "%+.1fEV", trim), "1/3档微调输出", false) }}
        struct WidgetSharedStore {
        static let suiteName = "group.com.lumifilm.flashmeter"; static let pbName = "com.lumifilm.shared.pb.v93"; static let udpPort: UInt16 = 49188
        static func requestFromMainAppUDP(cmd: String = "GET") -> [String: Double]? {
        let fd = socket(AF_INET, SOCK_DGRAM, 0); guard fd >= 0 else { return nil }; defer { close(fd) }
        var tv = timeval(tv_sec: 0, tv_usec: 95_000); setsockopt(fd, SOL_SOCKET, SO_RCVTIMEO, &tv, socklen_t(MemoryLayout<timeval>.size))
        var addr = sockaddr_in(); addr.sin_len = UInt8(MemoryLayout<sockaddr_in>.size); addr.sin_family = sa_family_t(AF_INET); addr.sin_port = in_port_t(udpPort).bigEndian; addr.sin_addr.s_addr = inet_addr("127.0.0.1")
        let data = Array(cmd.utf8)
        let sent = data.withUnsafeBytes { ptr in withUnsafePointer(to: &addr) { aPtr in aPtr.withMemoryRebound(to: sockaddr.self, capacity: 1) { sa in sendto(fd, ptr.baseAddress, ptr.count, 0, sa, socklen_t(MemoryLayout<sockaddr_in>.size)) }}}
        guard sent >= 0 else { return nil }
        var buf = [UInt8](repeating: 0, count: 2048); var fromAddr = sockaddr_in(); var fromLen = socklen_t(MemoryLayout<sockaddr_in>.size)
        let n = withUnsafeMutablePointer(to: &fromAddr) { aPtr in aPtr.withMemoryRebound(to: sockaddr.self, capacity: 1) { sa in recvfrom(fd, &buf, buf.count, 0, sa, &fromLen) }}
        guard n > 0 else { return nil }
        let replyData = Data(buf[0..<n]); return try? JSONDecoder().decode([String: Double].self, from: replyData) }
        static func loadDict() -> [String: Double] {
        if let udpDict = requestFromMainAppUDP(cmd: "GET"), !udpDict.isEmpty { saveLocalCache(udpDict); return udpDict }
        if let ud = UserDefaults(suiteName: suiteName), let d = ud.data(forKey: "lumifilm_v93_dict"), let dec = try? JSONDecoder().decode([String: Double].self, from: d) { return dec }
        if let pb = UIPasteboard(name: UIPasteboard.Name(pbName), create: false), let d = pb.data(forPasteboardType: "public.json"), let dec = try? JSONDecoder().decode([String: Double].self, from: d) { return dec }
        if let d = UserDefaults.standard.data(forKey: "lumifilm_v93_local"), let dec = try? JSONDecoder().decode([String: Double].self, from: d) { return dec }
        return [:] }
        static func saveLocalCache(_ dict: [String: Double]) {
        if let enc = try? JSONEncoder().encode(dict) { UserDefaults.standard.set(enc, forKey: "lumifilm_v93_local"); UserDefaults(suiteName: suiteName)?.set(enc, forKey: "lumifilm_v93_dict") }}
        static func mutateAndSync(command: String) {
        if let updated = requestFromMainAppUDP(cmd: "SET:\(command)"), !updated.isEmpty { saveLocalCache(updated); return }
        var d = loadDict()
        let maxAp = d["lf_max_aperture"] ?? 1.4; let apSteps = FlashCalculator.apertureSteps.filter { $0 >= maxAp - 0.01 }
        let curAp = d["lf_aperture"] ?? 5.6; let curSh = Int(round(d["lf_shutter"] ?? 125)); let curDist = d["lf_distance"] ?? 2.0; let curEV = d["lf_exp_comp_ev"] ?? 0.0; let curISO = d["lf_iso"] ?? 400.0
        switch command {
        case "ap_up": if let idx = apSteps.enumerated().min(by: { abs($0.element - curAp) < abs($1.element - curAp) })?.offset { d["lf_aperture"] = apSteps[min(apSteps.count - 1, idx + 1)] }
        case "ap_down": if let idx = apSteps.enumerated().min(by: { abs($0.element - curAp) < abs($1.element - curAp) })?.offset { d["lf_aperture"] = apSteps[max(0, idx - 1)] }
        case "dist_up": if let idx = FlashCalculator.distanceSteps.enumerated().min(by: { abs($0.element - curDist) < abs($1.element - curDist) })?.offset { d["lf_distance"] = FlashCalculator.distanceSteps[min(FlashCalculator.distanceSteps.count - 1, idx + 1)] }
        case "dist_down": if let idx = FlashCalculator.distanceSteps.enumerated().min(by: { abs($0.element - curDist) < abs($1.element - curDist) })?.offset { d["lf_distance"] = FlashCalculator.distanceSteps[max(0, idx - 1)] }
        case "sh_up": if let idx = FlashCalculator.shutterSteps.firstIndex(of: curSh) { d["lf_shutter"] = Double(FlashCalculator.shutterSteps[min(FlashCalculator.shutterSteps.count - 1, idx + 1)]) }
        case "sh_down": if let idx = FlashCalculator.shutterSteps.firstIndex(of: curSh) { d["lf_shutter"] = Double(FlashCalculator.shutterSteps[max(0, idx - 1)]) }
        case "ev_up": if let idx = FlashCalculator.evCompSteps.enumerated().min(by: { abs($0.element - curEV) < abs($1.element - curEV) })?.offset { d["lf_exp_comp_ev"] = FlashCalculator.evCompSteps[min(FlashCalculator.evCompSteps.count - 1, idx + 1)] }
        case "ev_down": if let idx = FlashCalculator.evCompSteps.enumerated().min(by: { abs($0.element - curEV) < abs($1.element - curEV) })?.offset { d["lf_exp_comp_ev"] = FlashCalculator.evCompSteps[max(0, idx - 1)] }
        case "iso_up": if let idx = FlashCalculator.isoSteps.enumerated().min(by: { abs($0.element - curISO) < abs($1.element - curISO) })?.offset { d["lf_iso"] = FlashCalculator.isoSteps[min(FlashCalculator.isoSteps.count - 1, idx + 1)] }
        case "iso_down": if let idx = FlashCalculator.isoSteps.enumerated().min(by: { abs($0.element - curISO) < abs($1.element - curISO) })?.offset { d["lf_iso"] = FlashCalculator.isoSteps[max(0, idx - 1)] }
        default: break }
        d["lf_sync_ts"] = Date().timeIntervalSince1970; saveLocalCache(d) }}
        struct LumiFilmWidgetAdjustIntent: AppIntent {
        static var title: LocalizedStringResource = "Adjust LumiFilm Parameter"
        @Parameter(title: "Command") var command: String
        init() { self.command = "ap_up" }
        init(command: String) { self.command = command }
        func perform() async throws -> some IntentResult { WidgetSharedStore.mutateAndSync(command: command); WidgetCenter.shared.reloadAllTimelines(); return .result() }}
        struct LumiFilmEntry: TimelineEntry {
        let date: Date; let iso: Double; let gn: Double; let distance: Double; let aperture: Double; let shutter: Int; let maxSync: Int; let evComp: Double; let auxLoss: Double; let theme: WidgetTheme; let formatRaw: Int; let syncModeRaw: Int
        var totalLoss: Double { auxLoss + evComp }
        EOF

    - name: Generate LumiFilmWidget.swift (Part 2/2)
      run: |
        cat << 'EOF' >> LumiFilmBuild/LumiFilmWidget/LumiFilmWidget.swift
        var calc: (mainFraction: String, trimBadge: String?, statusNote: String, isWarning: Bool) {
        FlashCalculator.powerComponents(gnAt100: gn, iso: iso, distance: distance, aperture: aperture, shutter: shutter, maxSync: maxSync, lossEV: totalLoss, formatRaw: formatRaw, syncModeRaw: syncModeRaw) }
        var mainPower: String { calc.mainFraction }; var trimBadge: String? { calc.trimBadge }; var statusNote: String { calc.statusNote }; var isWarning: Bool { calc.isWarning }
        var meterDeepLinkURL: URL { URL(string: "lumifilm://meter?ap=\(aperture)&dist=\(distance)&shutter=\(shutter)&iso=\(iso)&gn=\(gn)&ev=\(evComp)&theme=\(theme.rawValue)")! }
        var voiceDeepLinkURL: URL { URL(string: "lumifilm://voice")! }}
        struct LumiFilmProvider: TimelineProvider {
        private func buildEntry() -> LumiFilmEntry {
        let d = WidgetSharedStore.loadDict()
        let themeIdx = max(0, min(2, Int(round(d["lf_theme"] ?? 2))))
        return LumiFilmEntry(date: Date(), iso: d["lf_iso"] ?? 400.0, gn: d["lf_gn"] ?? 36.0, distance: d["lf_distance"] ?? 2.0, aperture: d["lf_aperture"] ?? 5.6, shutter: Int(round(d["lf_shutter"] ?? 125)), maxSync: Int(round(d["lf_sync_speed"] ?? 125)), evComp: d["lf_exp_comp_ev"] ?? 0.0, auxLoss: d["lf_aux_loss"] ?? 0.0, theme: WidgetTheme(rawValue: themeIdx) ?? .filmBrass, formatRaw: Int(round(d["lf_film_format"] ?? 0)), syncModeRaw: Int(round(d["lf_sync_mode"] ?? 0))) }
        func placeholder(in context: Context) -> LumiFilmEntry { buildEntry() }
        func getSnapshot(in context: Context, completion: @escaping (LumiFilmEntry) -> Void) { completion(buildEntry()) }
        func getTimeline(in context: Context, completion: @escaping (Timeline<LumiFilmEntry>) -> Void) {
        let entry = buildEntry(); completion(Timeline(entries: [entry], policy: .after(Date().addingTimeInterval(300)))) }}
        struct LumiFilmWidgetEntryView: View { var entry: LumiFilmProvider.Entry
        @Environment(\.widgetFamily) private var family
        private var t: WidgetTheme { entry.theme }
        private func fmtF(_ v: Double) -> String { abs(v - round(v)) < 0.05 ? "f/\(Int(round(v)))" : String(format: "f/%.1f", v) }
        var body: some View { Group { switch family { case .systemMedium: mediumWidgetView; case .systemLarge: largeWidgetView; case .accessoryRectangular: lockScreenRectangularView
        default: smallWidgetView }} .widgetURL(entry.meterDeepLinkURL).containerBackground(for: .widget) { LinearGradient(colors: t.backgroundGradient, startPoint: .topLeading, endPoint: .bottomTrailing) }}
        private func powerBadgeRow(mainSize: CGFloat, badgeSize: CGFloat) -> some View { HStack(alignment: .center, spacing: 5) { Text(entry.mainPower).font(.system(size: mainSize, weight: .black, design: .rounded)).foregroundStyle(entry.isWarning ? Color.orange : Color.white).minimumScaleFactor(0.65).lineLimit(1)
        if let trim = entry.trimBadge { Text(trim).font(.system(size: badgeSize, weight: .heavy, design: .monospaced)).foregroundStyle(Color.black).padding(.horizontal, 6).padding(.vertical, 2).background(t.accent, in: Capsule()) } else { Text("整档").font(.system(size: badgeSize - 0.5, weight: .bold, design: .rounded)).foregroundStyle(t.accent).padding(.horizontal, 5).padding(.vertical, 1.5).background(Color.white.opacity(0.12), in: Capsule()) }}}
        private var smallWidgetView: some View { VStack(alignment: .leading, spacing: 5) { HStack { Text("⚡ LUMIFILM").font(.system(size: 9.5, weight: .black, design: .monospaced)).foregroundStyle(t.accent)
        Spacer()
