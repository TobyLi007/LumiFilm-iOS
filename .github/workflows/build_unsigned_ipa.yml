               .foregroundStyle(theme.accent)
             }
            }
            HStack(spacing: 10) {
             Button {
              flashGN = max(5.0, flashGN - 1.0)
              selectedFlashID = "custom"
             } label: {
              Image(systemName: "minus.circle.fill")
               .font(.system(size: 22))
               .foregroundStyle(theme.accent)
             }
             Slider(
              value: Binding(
               get: { flashGN },
               set: { newVal in
                flashGN = round(newVal)
                selectedFlashID = "custom"
               }
              ),
              in: 8...64,
              step: 1
             )
              .tint(theme.accent)
             Button {
              flashGN = min(80.0, flashGN + 1.0)
              selectedFlashID = "custom"
             } label: {
              Image(systemName: "plus.circle.fill")
               .font(.system(size: 22))
               .foregroundStyle(theme.accent)
             }
             Text("GN \(Int(flashGN))")
              .font(.system(size: 13, weight: .black, design: .monospaced))
              .foregroundStyle(Color.white)
              .frame(width: 54, alignment: .trailing)
            }
           }
           VStack(alignment: .leading, spacing: 6) {
            Text(lang == .en ? "Camera Max X-Sync Speed" : "机身最高闪光同步快门 (X-Sync)")
             .font(.system(size: 11.5, weight: .semibold))
             .foregroundStyle(Color.white.opacity(0.85))
            ScrollView(.horizontal, showsIndicators: false) {
             HStack(spacing: 6) {
              ForEach(syncPresets, id: \.self) { spd in
               let isSel = (maxSyncSpeed == spd)
               Button {
                withAnimation(.spring(response: 0.28, dampingFraction: 0.76)) {
                 maxSyncSpeed = spd
                }
               } label: {
                Text("1/\(spd)s")
                 .font(.system(size: 11, weight: .bold, design: .monospaced))
                 .foregroundStyle(isSel ? Color.black : Color.white)
                 .padding(.horizontal, 10)
                 .padding(.vertical, 6)
                 .background(isSel ? theme.accent : Color.white.opacity(0.12), in: Capsule())
               }
              }
             }
            }
           }
          }
           .padding(13)
           .background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 18))
         }
         private var themeSetupCard: some View {
          VStack(alignment: .leading, spacing: 8) {
           Text(lang == .en ? "4. Choose UI Theme" : "4. 选择喜欢的 UI 主题风格")
            .font(.system(size: 13, weight: .bold))
            .foregroundStyle(Color.white)
           HStack(spacing: 8) {
            ForEach(AppTheme.allCases) { item in
             let isSel = (themeRaw == item.rawValue)
             Button {
              withAnimation(.spring(response: 0.3, dampingFraction: 0.75)) {
               themeRaw = item.rawValue
              }
             } label: {
              Text(item.name(for: lang))
               .font(.system(size: 11, weight: .bold))
               .foregroundStyle(isSel ? Color.black : Color.white)
               .frame(maxWidth: .infinity)
               .padding(.vertical, 8)
               .background(isSel ? theme.accent : Color.white.opacity(0.12), in: RoundedRectangle(cornerRadius: 10))
             }
            }
           }
          }
           .padding(13)
           .background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 18))
         }
        }
        EOF

    - name: Generate Xcode Project & Compile Unsigned Release App
      run: |
        set -o pipefail
        cd LumiFilmBuild
        brew install xcodegen
        xcodegen generate
        xcodebuild clean build \
          -project LumiFilm.xcodeproj \
          -scheme LumiFilm \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build_output \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || {
            echo "=== XCODE COMPILER ERRORS ==="
            grep -E "error:|fatal error:" build.log || true
            exit 1
          }

    - name: Stamp Info.plist Bundle Versions & Package Unsigned IPA for Sideloadly
      run: |
        cd LumiFilmBuild
        APP_PATH=$(find build_output -name "LumiFilm.app" -type d | head -n 1)
        echo "Found built app at: $APP_PATH"

        # Register lumifilm:// URL Scheme for iPhone Action Button, iOS Shortcuts & Home Screen Widget Deep Links
        /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$APP_PATH/Info.plist" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$APP_PATH/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$APP_PATH/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.lumifilm.flashmeter" "$APP_PATH/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$APP_PATH/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string lumifilm" "$APP_PATH/Info.plist"

        # Ensure Main App Info.plist has valid non-empty Bundle Version strings (fixes Sideloadly IXErrorDomain Code=17)
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 8.7.0" "$APP_PATH/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 8.7.0" "$APP_PATH/Info.plist"
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 87" "$APP_PATH/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 87" "$APP_PATH/Info.plist"

        # Ensure Embedded Widget Extension Info.plist also has valid non-empty Bundle Version strings
        if [ -d "$APP_PATH/PlugIns/LumiFilmWidget.appex" ]; then
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 8.7.0" "$APP_PATH/PlugIns/LumiFilmWidget.appex/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 8.7.0" "$APP_PATH/PlugIns/LumiFilmWidget.appex/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 87" "$APP_PATH/PlugIns/LumiFilmWidget.appex/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 87" "$APP_PATH/PlugIns/LumiFilmWidget.appex/Info.plist"
        fi

        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r9 ../LumiFilm-Unsigned.ipa Payload

    - name: Upload Unsigned IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LumiFilm-Unsigned-IPA
        path: LumiFilm-Unsigned.ipa
