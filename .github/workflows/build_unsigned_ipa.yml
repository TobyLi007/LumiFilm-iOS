          private func addCustomFilm() {
              let trimmed = newFilmName.trimmingCharacters(in: .whitespaces)
              guard !trimmed.isEmpty, let iso = Double(newFilmISO) else { return }
              var list: [FilmStockModel] = []
              if let data = customFilmStocksJSON.data(using: .utf8),
                 let decoded = try? JSONDecoder().decode([FilmStockModel].self, from: data) {
                  list = decoded
              }
              let item = FilmStockModel(
                  id: "custom_\(UUID().uuidString.prefix(6))",
                  brand: .lomoOther,
                  name: trimmed,
                  shortName: trimmed,
                  nominalISO: max(6, min(12800, iso)),
                  latitudeBiasEV: newFilmBias,
                  isSlideFilm: false,
                  compensationHint: "自定义胶卷 \(String(format: "%+.1f", newFilmBias)) EV",
                  supportedFormats: [.mm35, .mm120]
              )
              list.append(item)
              if let data = try? JSONEncoder().encode(list),
                 let str = String(data: data, encoding: .utf8) {
                  customFilmStocksJSON = str
                  newFilmName = ""
                  FeedbackEngine.shared.playSuccess()
              }
          }

          private func addCustomFlash() {
              let trimmed = newFlashName.trimmingCharacters(in: .whitespaces)
              guard !trimmed.isEmpty, let gn = Double(newFlashGN) else { return }
              var list: [FlashUnitModel] = []
              if let data = customFlashUnitsJSON.data(using: .utf8),
                 let decoded = try? JSONDecoder().decode([FlashUnitModel].self, from: data) {
                  list = decoded
              }
              let item = FlashUnitModel(
                  id: "flash_\(UUID().uuidString.prefix(6))",
                  brand: newFlashBrand,
                  name: trimmed,
                  gnAtISO100: max(3, min(120, gn)),
                  defaultZoomMM: 35,
                  zoomStepsMM: [28, 35, 50],
                  minPowerFraction: 1.0 / 64.0,
                  recycleSeconds: 2.0,
                  notes: "自定义闪光灯 GN\(Int(gn))"
              )
              list.append(item)
              if let data = try? JSONEncoder().encode(list),
                 let str = String(data: data, encoding: .utf8) {
                  customFlashUnitsJSON = str
                  newFlashName = ""
                  FeedbackEngine.shared.playSuccess()
              }
          }
      }

      // MARK: - First-Launch 4-Step Interactive Onboarding Wizard + Equipment Redline Summary Bar (Option G)
      struct OnboardingSetupSheet: View {
          let theme: AppTheme
          @Binding var hasCompletedOnboarding: Bool
          @Binding var appThemeRaw: String
          @Binding var filmFormatRaw: String
          @Binding var selectedBrandRaw: String
          @Binding var selectedStockID: String
          @Binding var selectedFlashID: String
          @Binding var selectedSyncPresetID: String
          @Binding var voicePersonaRaw: String
          @Binding var voiceBroadcastEnabled: Bool
          var onFinish: () -> Void

          @State private var step: Int = 0

          private var currentStockObj: FilmStockModel {
              FilmStockModel.builtInCatalog.first(where: { $0.id == selectedStockID }) ?? FilmStockModel.builtInCatalog[2]
          }
          private var currentFlashObj: FlashUnitModel {
              FlashUnitModel.builtInFlashes.first(where: { $0.id == selectedFlashID }) ?? FlashUnitModel.builtInFlashes[0]
          }
          private var currentSyncObj: CameraShutterPreset {
              CameraShutterPreset.presets.first(where: { $0.id == selectedSyncPresetID }) ?? CameraShutterPreset.presets[0]
          }

          var body: some View {
              NavigationStack {
                  ZStack {
                      theme.backgroundBottom.ignoresSafeArea()
                      VStack(spacing: 14) {
                          HStack(spacing: 6) {
                              ForEach(0..<4, id: \.self) { idx in
                                  Capsule()
                                      .fill(idx <= step ? theme.accent : Color.white.opacity(0.14))
                                      .frame(height: 5)
                              }
                          }
                          .padding(.horizontal, 16)
                          .padding(.top, 8)

                          ScrollView {
                              VStack(alignment: .leading, spacing: 14) {
                                  if step == 0 {
                                      onboardingStepHeader(icon: "film.stack.fill", title: "第 1 步：选择胶卷画幅与常用胶卷", subtitle: "自动匹配焦平面弥散圆 (CoC) 与胶卷宽容度补偿")
                                      Picker("画幅", selection: $filmFormatRaw) {
                                          ForEach(FilmFormatType.allCases) { f in
                                              Text(f.rawValue).tag(f.rawValue)
                                          }
                                      }
                                      .pickerStyle(.segmented)

                                      ForEach(FilmStockModel.builtInCatalog.prefix(10)) { stock in
                                          Button {
                                              selectedBrandRaw = stock.brand.rawValue
                                              selectedStockID = stock.id
                                              FeedbackEngine.shared.playClick(theme: theme)
                                          } label: {
                                              HStack {
                                                  FilmBrandLogoBadge(brand: stock.brand, size: 22)
                                                  VStack(alignment: .leading, spacing: 2) {
                                                      Text(stock.name)
                                                          .font(.system(size: 13, weight: .bold))
                                                          .foregroundColor(theme.textPrimary)
                                                      Text(stock.compensationHint)
                                                          .font(.system(size: 10))
                                                          .foregroundColor(theme.textSecondary)
                                                  }
                                                  Spacer()
                                                  if selectedStockID == stock.id {
                                                      Image(systemName: "checkmark.circle.fill")
                                                          .foregroundColor(theme.accent)
                                                  }
                                              }
                                              .padding(10)
                                              .background(selectedStockID == stock.id ? theme.accent.opacity(0.18) : theme.panelCard)
                                              .clipShape(RoundedRectangle(cornerRadius: 10))
                                          }
                                      }
                                  } else if step == 1 {
                                      onboardingStepHeader(icon: "bolt.fill", title: "第 2 步：选择机顶闪光灯", subtitle: "内置各型号真实 GN 闪光指数与最小输出档位限制")
                                      ForEach(FlashUnitModel.builtInFlashes) { flash in
                                          Button {
                                              selectedFlashID = flash.id
                                              FeedbackEngine.shared.playClick(theme: theme)
                                          } label: {
                                              HStack {
                                                  VStack(alignment: .leading, spacing: 2) {
                                                      Text("\(flash.brand) \(flash.name)")
                                                          .font(.system(size: 13, weight: .bold))
                                                          .foregroundColor(theme.textPrimary)
                                                      Text("GN\(Int(flash.gnAtISO100)) (ISO 100) · \(flash.notes)")
                                                          .font(.system(size: 10))
                                                          .foregroundColor(theme.textSecondary)
                                                  }
                                                  Spacer()
                                                  if selectedFlashID == flash.id {
                                                      Image(systemName: "checkmark.circle.fill")
                                                          .foregroundColor(theme.accent)
                                                  }
                                              }
                                              .padding(10)
                                              .background(selectedFlashID == flash.id ? theme.accent.opacity(0.18) : theme.panelCard)
                                              .clipShape(RoundedRectangle(cornerRadius: 10))
                                          }
                                      }
                                  } else if step == 2 {
                                      onboardingStepHeader(icon: "camera.shutter.button.fill", title: "第 3 步：选择胶片相机快门同步预设", subtitle: "当快门超过机身最高 X-Sync 速度时自动亮起红灯防黑边")
                                      ForEach(CameraShutterPreset.presets) { preset in
                                          Button {
                                              selectedSyncPresetID = preset.id
                                              FeedbackEngine.shared.playClick(theme: theme)
                                          } label: {
                                              HStack {
                                                  VStack(alignment: .leading, spacing: 2) {
                                                      Text("\(preset.name) · 最高同步 \(preset.maxSyncLabel)")
                                                          .font(.system(size: 13, weight: .bold))
                                                          .foregroundColor(theme.textPrimary)
                                                      Text(preset.note)
                                                          .font(.system(size: 10))
                                                          .foregroundColor(theme.textSecondary)
                                                  }
                                                  Spacer()
                                                  if selectedSyncPresetID == preset.id {
                                                      Image(systemName: "checkmark.circle.fill")
                                                          .foregroundColor(theme.accent)
                                                  }
                                              }
                                              .padding(10)
                                              .background(selectedSyncPresetID == preset.id ? theme.accent.opacity(0.18) : theme.panelCard)
                                              .clipShape(RoundedRectangle(cornerRadius: 10))
                                          }
                                      }
                                  } else {
                                      onboardingStepHeader(icon: "waveform.and.mic", title: "第 4 步：暗房主题与语音助手确认", subtitle: "核对下方器材参数与快门红线总览后即可开始拍摄")
                                      Picker("主题", selection: $appThemeRaw) {
                                          ForEach(AppTheme.allCases) { t in
                                              Text(t.rawValue).tag(t.rawValue)
                                          }
                                      }
                                      .pickerStyle(.segmented)

                                      Toggle("开启滚轮停止后自动语音播报", isOn: $voiceBroadcastEnabled)
                                          .font(.system(size: 13, weight: .bold))
                                          .foregroundColor(theme.textPrimary)
                                          .tint(theme.accent)

                                      ForEach(VoicePersona.allCases) { p in
                                          Button {
                                              voicePersonaRaw = p.rawValue
                                              FeedbackEngine.shared.playClick(theme: theme)
                                          } label: {
                                              HStack {
                                                  Text(p.rawValue)
                                                      .font(.system(size: 13, weight: .bold))
                                                      .foregroundColor(theme.textPrimary)
                                                  Spacer()
                                                  Text(p.subtitle)
                                                      .font(.system(size: 10))
                                                      .foregroundColor(theme.textSecondary)
                                                  if voicePersonaRaw == p.rawValue {
                                                      Image(systemName: "checkmark.circle.fill")
                                                          .foregroundColor(theme.accent)
                                                  }
                                              }
                                              .padding(10)
                                              .background(voicePersonaRaw == p.rawValue ? theme.accent.opacity(0.18) : theme.panelCard)
                                              .clipShape(RoundedRectangle(cornerRadius: 10))
                                          }
                                      }
                                  }
                              }
                              .padding(.horizontal, 16)
                          }

                          // Option G: Persistent Equipment & X-Sync Redline Summary Bar at bottom of Wizard
                          VStack(alignment: .leading, spacing: 4) {
                              HStack {
                                  Label("当前器材与快门红线总览", systemImage: "checkmark.shield.fill")
                                      .font(.system(size: 11, weight: .heavy))
                                      .foregroundColor(theme.accent)
                                  Spacer()
                                  Text("X-Sync 红线: \(currentSyncObj.maxSyncLabel)")
                                      .font(.system(size: 11, weight: .black, design: .monospaced))
                                      .padding(.horizontal, 7)
                                      .padding(.vertical, 2)
                                      .background(theme.warningRed.opacity(0.22))
                                      .foregroundColor(theme.warningRed)
                                      .clipShape(Capsule())
                              }
                              Text("画幅: \(filmFormatRaw) · 胶卷: \(currentStockObj.shortName) (宽容度偏置 \(String(format: "%+.1f", currentStockObj.latitudeBiasEV)) EV) · 闪光灯: \(currentFlashObj.name) (GN\(Int(currentFlashObj.gnAtISO100)))")
                                  .font(.system(size: 10, weight: .medium))
                                  .foregroundColor(theme.textSecondary)
                                  .lineLimit(2)
                          }
                          .padding(10)
                          .background(theme.panelCard)
                          .clipShape(RoundedRectangle(cornerRadius: 12))
                          .overlay(
                              RoundedRectangle(cornerRadius: 12)
                                  .stroke(theme.accent.opacity(0.35), lineWidth: 1)
                          )
                          .padding(.horizontal, 16)

                          HStack(spacing: 10) {
                              if step > 0 {
                                  Button("上一步") {
                                      withAnimation { step -= 1 }
                                  }
                                  .font(.system(size: 14, weight: .bold))
                                  .frame(maxWidth: .infinity)
                                  .padding(.vertical, 12)
                                  .background(theme.panelCard)
                                  .foregroundColor(theme.textPrimary)
                                  .clipShape(RoundedRectangle(cornerRadius: 12))
                              }
                              Button(step < 3 ? "下一步" : "完成配置并进入测光台") {
                                  if step < 3 {
                                      withAnimation { step += 1 }
                                  } else {
                                      onFinish()
                                  }
                              }
                              .font(.system(size: 14, weight: .black))
                              .frame(maxWidth: .infinity)
                              .padding(.vertical, 12)
                              .background(theme.accent)
                              .foregroundColor(.black)
                              .clipShape(RoundedRectangle(cornerRadius: 12))
                          }
                          .padding(.horizontal, 16)
                          .padding(.bottom, 12)
                      }
                  }
                  .navigationTitle("LumiFilm 器材初始化向导")
                  .navigationBarTitleDisplayMode(.inline)
                  .toolbar {
                      ToolbarItem(placement: .topBarTrailing) {
                          Button("跳过") { onFinish() }
                              .foregroundColor(theme.textSecondary)
                      }
                  }
              }
              .preferredColorScheme(.dark)
          }

          private func onboardingStepHeader(icon: String, title: String, subtitle: String) -> some View {
              HStack(spacing: 10) {
                  Image(systemName: icon)
                      .font(.system(size: 18, weight: .bold))
                      .foregroundColor(.black)
                      .frame(width: 36, height: 36)
                      .background(theme.accent)
                      .clipShape(RoundedRectangle(cornerRadius: 10))
                  VStack(alignment: .leading, spacing: 2) {
                      Text(title)
                          .font(.system(size: 15, weight: .black))
                          .foregroundColor(theme.textPrimary)
                      Text(subtitle)
                          .font(.system(size: 11))
                          .foregroundColor(theme.textSecondary)
                  }
              }
          }
      }

      // MARK: - App Entry Point
      @main
      struct LumiFilmApp: App {
          var body: some Scene {
              WindowGroup {
                  ContentView()
              }
          }
      }
      EOF

      - name: Generate Xcode Project via XcodeGen
        run: |
          cd LumiFilmBuild
          xcodegen generate

      - name: Build Unsigned Release App (Clean Signing for Sideloadly)
        run: |
          cd LumiFilmBuild
          xcodebuild clean build \
            -project LumiFilm.xcodeproj \
            -scheme LumiFilm \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Package Unsigned IPA with Embedded Widget & Clean Extended Attributes
        run: |
          cd LumiFilmBuild
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LumiFilm.app Payload/
          xattr -cr Payload/LumiFilm.app
          ldid -S Payload/LumiFilm.app/LumiFilm
          if [ -d "Payload/LumiFilm.app/PlugIns/LumiFilmWidget.appex" ]; then
            ldid -S Payload/LumiFilm.app/PlugIns/LumiFilmWidget.appex/LumiFilmWidget
          fi
          zip -r9 ../LumiFilm-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumiFilm-Unsigned-IPA
          path: LumiFilm-Unsigned.ipa
          if-no-files-found: error

      - name: Publish Automatic GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.7.${{ github.run_number }}
          name: "LumiFilm v10.7.${{ github.run_number }} (Full-Quadrant 3D Vanishing Barrel Wheel & 1x LiDAR Lock)"
          body: |
            ### LumiFilm v10.7.0 胶片闪光灯精密测光台更新
            - **满幅渐变消失 3D 滚筒轮盘 (`iOSClockDrumWheelView`)**：采用 `GeometryReader` 100% 铺满左下方格，升级 7 槽位正弦圆弧轨迹 (`sin(rad) * radius`)、余弦透视压缩 (`cos(rad)`)、金属防滑横纹、双侧联动齿轮刻度与首尾全透明渐变消失遮罩 (`0.0 -> 1.0 -> 0.0`)，完美还原真实滚轮阻尼手感。
            - **实景测光锁定 `1x` 广角主摄 + 同轴 LiDAR**：彻底移除会导致 LiDAR 深度图失效的 `0.5x` 超广角切换，固定使用 `1x` 光学主摄以保证硬件级 LiDAR 激光雷达在任意点按位置均可同轴精准测距，并在顶栏新增「🎯 回中心」对焦复位按钮。
          files: LumiFilm-Unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
