        let cameraEV100 = log2((aperture * aperture) / shutterSeconds) - log2(effectiveISO / 100.0)
        let diff = ambientEV100 - cameraEV100
        if diff >= -1.8 { return -0.35 }
        return 0.0 }

        var totalFlashLossEV: Double {
        opticalPhysicalLossEV + roleBiasEV + ambientFillReductionEV }

        var powerCalculation: (mainFraction: String, trimBadge: String?, statusNote: String, isWarning: Bool) {
        if isPowerLocked {
        let safeIdx = max(0, min(powerFractionSteps.count - 1, lockedPowerIdx))
        let pFrac = powerFractionSteps[safeIdx]
        let recDist = lockedRecommendedDistance
        let recAp = lockedRecommendedAperture
        let note = lang == .en ? String(format: "Locked -> Dist %.1fm or f/%.1f", recDist, recAp) : String(format: "锁功率反推：建议距离 %.1fm 或 光圈 f/%.1f", recDist, recAp)
        return (pFrac, "🔒 LOCK", note, false)
        }
        return FlashCalculator_App.powerComponents(
        gnAt100: effectiveGNAt100,
        iso: effectiveISO,
        distance: distance,
        aperture: aperture,
        shutter: shutter,
        maxSync: maxSyncSpeed,
        lossEV: totalFlashLossEV + evComp,
        formatRaw: formatRaw,
        syncModeRaw: syncModeRaw,
        minDenom: currentFlashUnit.minPowerDenominator,
        lang: lang) }

        var lockedRecommendedDistance: Double {
        let safeIdx = max(0, min(powerFractionValues.count - 1, lockedPowerIdx))
        let pVal = powerFractionValues[safeIdx]
        let isoFactor = sqrt(max(effectiveISO, 25.0) / 100.0)
        let closeUp = filmFormat.closeUpLoss(at: distance)
        let effGN = effectiveGNAt100 * isoFactor * pow(2.0, -(opticalPhysicalLossEV + evComp + closeUp) / 2.0)
        let lockedGN = effGN * sqrt(pVal)
        return max(0.35, min(25.0, lockedGN / max(0.95, aperture))) }

        var lockedRecommendedAperture: Double {
        let safeIdx = max(0, min(powerFractionValues.count - 1, lockedPowerIdx))
        let pVal = powerFractionValues[safeIdx]
        let isoFactor = sqrt(max(effectiveISO, 25.0) / 100.0)
        let closeUp = filmFormat.closeUpLoss(at: distance)
        let effGN = effectiveGNAt100 * isoFactor * pow(2.0, -(opticalPhysicalLossEV + evComp + closeUp) / 2.0)
        let lockedGN = effGN * sqrt(pVal)
        return max(1.0, min(32.0, lockedGN / max(0.35, distance))) }

        var reciprocityWarningText: String? {
        let seconds: Double = shutter < 0 ? Double(-shutter) : (shutter == 1 ? 1.0 : 0.0)
        guard seconds >= 1.0 else { return nil }
        let p: Double
        switch filmBrand {
        case .fujifilm: p = currentFilmStock.id.contains("acros") ? 1.08 : 1.20
        case .ilford: p = 1.26
        case .kodak: p = 1.16
        case .cinestill: p = 1.18
        case .lomoOther, .customISO: p = 1.25 }
        let corrected = pow(seconds, p)
        let extra = max(0.0, corrected - seconds)
        if lang == .en {
        return String(format: "🌙 Reciprocity: Meter %.0fs -> Expose %.0fs (+%.0fs)", seconds, corrected, extra)
        }
        return String(format: "🌙 倒易律失效补偿：测光 %.0f\" → 实曝需 %.0f\" (延长 +%.0f 秒)", seconds, corrected, extra) }

