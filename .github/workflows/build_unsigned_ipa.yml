        @ViewBuilder
        private func sectionBox<Content: View>(icon: String, title: String, @ViewBuilder content: () -> Content) -> some View {
        VStack(alignment: .leading, spacing: 9) {
        HStack(spacing: 7) {
        Image(systemName: icon).font(.system(size: 13, weight: .bold)).foregroundStyle(Color.black)
        .frame(width: 26, height: 26).background(theme.accent, in: RoundedRectangle(cornerRadius: 7))
        Text(title).fSys(13, .heavy).foregroundStyle(Color.white)
        Spacer()
        }
        Divider().background(Color.white.opacity(0.10))
        content()
        }
        .padding(12).background(Color.white.opacity(0.08), in: RoundedRectangle(cornerRadius: 15))
        }

        private func addCustomFilmStock() {
        let name = newFilmName.trimmingCharacters(in: .whitespaces)
        guard !name.isEmpty, let isoVal = Double(newFilmISO) else { return }
        var arr: [FilmStockModel] = []
        if let d = customFilmsJSON.data(using: .utf8), let dec = try? JSONDecoder().decode([FilmStockModel].self, from: d) { arr = dec }
        arr.append(FilmStockModel(id: "cust_\(UUID().uuidString.prefix(5))", brand: .lomoOther, name: name, iso: max(12, min(6400, isoVal)), subZh: "用户自定义胶卷", subEn: "User custom film"))
        if let d = try? JSONEncoder().encode(arr), let s = String(data: d, encoding: .utf8) { customFilmsJSON = s; newFilmName = "" }
        }

        private func addCustomFlashUnit() {
        let name = newFlashName.trimmingCharacters(in: .whitespaces)
        guard !name.isEmpty, let gnVal = Double(newFlashGN) else { return }
        var arr: [FlashUnitModel] = []
        if let d = customFlashesJSON.data(using: .utf8), let dec = try? JSONDecoder().decode([FlashUnitModel].self, from: d) { arr = dec }
        arr.append(FlashUnitModel(id: "cfl_\(UUID().uuidString.prefix(5))", brand: .custom, nameZh: name, nameEn: name, shortBadge: String(name.prefix(10)), gnAtISO100: max(5, min(100, gnVal))))
        if let d = try? JSONEncoder().encode(arr), let s = String(data: d, encoding: .utf8) { customFlashesJSON = s; newFlashName = "" }
        }
        }

        // MARK: - 4-Step First-Launch Onboarding Wizard + Equipment Redline Summary Bar
        struct OnboardingSetupSheet: View {
        @Binding var hasCompletedOnboarding: Bool
        @Binding var themeRaw: Int
        @Binding var langRaw: Int
        @Binding var formatRaw: Int
        @Binding var filmBrandRaw: String
        @Binding var filmStockID: String
        @Binding var flashBrandRaw: String
        @Binding var flashUnitID: String
        @Binding var cameraPresetRaw: String
        @Binding var maxSyncSpeed: Int
        @Binding var syncModeRaw: Int
        var onFinish: () -> Void

        @State private var step: Int = 0
        var theme: AppTheme { AppTheme(rawValue: themeRaw) ?? .leicaBrushedBrass }
        var lang: AppLanguage { AppLanguage(rawValue: langRaw) ?? .zh }
        var cameraPreset: CameraShutterPreset { CameraShutterPreset(rawValue: cameraPresetRaw) ?? .leicaM }

        var body: some View {
        NavigationStack {
        ZStack {
        LinearGradient(colors: theme.backgroundGradient, startPoint: .topLeading, endPoint: .bottomTrailing).ignoresSafeArea()
        VStack(spacing: 12) {
        HStack(spacing: 6) {
        ForEach(0..<4, id: \.self) { i in
        Capsule().fill(i <= step ? theme.accent : Color.white.opacity(0.15)).frame(height: 5)
        }
        }
        .padding(.horizontal, 16).padding(.top, 8)

        ScrollView {
        VStack(alignment: .leading, spacing: 10) {
        if step == 0 {
        Text("1. 选择胶片相机与最高安全同步快门").fSys(15, .black).foregroundStyle(Color.white)
        ForEach(CameraShutterPreset.allCases) { preset in
        Button {
        cameraPresetRaw = preset.rawValue
        maxSyncSpeed = preset.defaultSync
        syncModeRaw = preset.defaultMode.rawValue
        if let fmt = preset.suggestedFormat { formatRaw = fmt.rawValue }
        } label: {
        HStack {
        VStack(alignment: .leading, spacing: 2) {
        Text(preset.title(for: lang)).fSys(12.5, .bold).foregroundStyle(Color.white)
        Text(preset.defectWarning(for: lang)).fSys(10, .regular).foregroundStyle(Color.white.opacity(0.68)).lineLimit(2)
        }
        Spacer()
        if cameraPresetRaw == preset.rawValue { Image(systemName: "checkmark.circle.fill").foregroundStyle(theme.accent) }
        }
        .padding(10).background(cameraPresetRaw == preset.rawValue ? theme.accent.opacity(0.20) : Color.white.opacity(0.07), in: RoundedRectangle(cornerRadius: 10))
        }
        }
        } else if step == 1 {
        Text("2. 选择常用胶卷画幅与胶卷型号").fSys(15, .black).foregroundStyle(Color.white)
        ForEach(FilmStockModel.catalog.prefix(10)) { st in
        Button {
        filmBrandRaw = st.brand.rawValue
        filmStockID = st.id
        } label: {
        HStack {
        FilmBrandLogoBadge(brand: st.brand, compact: true)
        Text(st.name).fSys(12.5, .bold).foregroundStyle(Color.white)
        Spacer()
        if filmStockID == st.id { Image(systemName: "checkmark.circle.fill").foregroundStyle(theme.accent) }
        }
        .padding(10).background(filmStockID == st.id ? theme.accent.opacity(0.20) : Color.white.opacity(0.07), in: RoundedRectangle(cornerRadius: 10))
        }
        }
        } else if step == 2 {
        Text("3. 选择常用机顶闪光灯型号").fSys(15, .black).foregroundStyle(Color.white)
        ForEach(FlashUnitModel.catalog.prefix(12)) { fl in
        Button {
        flashBrandRaw = fl.brand.rawValue
        flashUnitID = fl.id
        } label: {
        HStack {
        Text(fl.displayName(for: lang)).fSys(12, .bold).foregroundStyle(Color.white)
        Spacer()
        if flashUnitID == fl.id { Image(systemName: "checkmark.circle.fill").foregroundStyle(theme.accent) }
        }
        .padding(10).background(flashUnitID == fl.id ? theme.accent.opacity(0.20) : Color.white.opacity(0.07), in: RoundedRectangle(cornerRadius: 10))
        }
        }
        } else {
        Text("4. 选择喜欢的界面主题风格").fSys(15, .black).foregroundStyle(Color.white)
        ForEach(AppTheme.allCases) { t in
        Button {
        themeRaw = t.rawValue
        } label: {
        HStack {
        Image(systemName: t.icon).foregroundStyle(t.accent)
        Text(t.name(for: lang)).fSys(13, .bold).foregroundStyle(Color.white)
        Spacer()
        if themeRaw == t.rawValue { Image(systemName: "checkmark.circle.fill").foregroundStyle(theme.accent) }
        }
        .padding(12).background(themeRaw == t.rawValue ? theme.accent.opacity(0.20) : Color.white.opacity(0.07), in: RoundedRectangle(cornerRadius: 10))
        }
        }
        }
        }
        .padding(.horizontal, 16)
        }

        // Persistent Equipment & X-Sync Redline Summary Bar
        HStack {
        VStack(alignment: .leading, spacing: 2) {
        Text("当前机身同步红线：1/\(maxSyncSpeed)s").fMono(11, .black).foregroundStyle(theme.accent)
        Text(cameraPreset.title(for: lang)).fSys(10, .medium).foregroundStyle(Color.white.opacity(0.75)).lineLimit(1)
        }
        Spacer()
        }
        .padding(10).background(Color.white.opacity(0.08), in: RoundedRectangle(cornerRadius: 10)).padding(.horizontal, 16)

        HStack(spacing: 10) {
        if step > 0 {
        Button("上一步") { withAnimation { step -= 1 } }
        .fSys(13, .bold).frame(maxWidth: .infinity).padding(.vertical, 11)
        .background(Color.white.opacity(0.10), in: RoundedRectangle(cornerRadius: 11)).foregroundStyle(Color.white)
        }
        Button(step < 3 ? "下一步" : "进入 LumiFilm 测光台") {
        if step < 3 { withAnimation { step += 1 } } else { onFinish() }
        }
        .fSys(13.5, .black).frame(maxWidth: .infinity).padding(.vertical, 11)
        .background(theme.accent, in: RoundedRectangle(cornerRadius: 11)).foregroundStyle(Color.black)
        }
        .padding(.horizontal, 16).padding(.bottom, 12)
        }
        }
        .navigationTitle("LumiFilm 器材向导")
        .navigationBarTitleDisplayMode(.inline)
        .toolbar {
        ToolbarItem(placement: .topBarTrailing) {
        Button("跳过") { onFinish() }.foregroundStyle(Color.white.opacity(0.7))
        }
        }
        }
        .preferredColorScheme(.dark)
        }
        }
        EOF

    - name: Generate Xcode Project via XcodeGen
      run: |
        if ! command -v xcodegen >/dev/null 2>&1; then
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip -o /tmp/xcodegen.zip || true
          if [ -f /tmp/xcodegen.zip ]; then
            unzip -qo /tmp/xcodegen.zip -d /tmp/xcodegen_bin || true
            export PATH="/tmp/xcodegen_bin/xcodegen/bin:$PATH"
          fi
        fi
        if ! command -v xcodegen >/dev/null 2>&1; then
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
        fi
        cd LumiFilmBuild
        xcodegen generate

    - name: Build Unsigned Release App (Clean Signing for Sideloadly)
      run: |
        cd LumiFilmBuild
        xcodebuild clean build \
          -project LumiFilm.xcodeproj \
          -scheme LumiFilm \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          DEVELOPMENT_TEAM=""

    - name: Package Unsigned IPA with Embedded Widget & Clean Extended Attributes
      run: |
        cd LumiFilmBuild
        mkdir -p Payload
        cp -R build/Build/Products/Release-iphoneos/LumiFilm.app Payload/
        rm -rf Payload/LumiFilm.app/_CodeSignature Payload/LumiFilm.app/embedded.mobileprovision
        rm -rf Payload/LumiFilm.app/PlugIns/LumiFilmWidget.appex/_CodeSignature Payload/LumiFilm.app/PlugIns/LumiFilmWidget.appex/embedded.mobileprovision
        xattr -cr Payload/LumiFilm.app
        if [ -d "Payload/LumiFilm.app/PlugIns/LumiFilmWidget.appex" ]; then
          /usr/bin/codesign --force --sign - --timestamp=none Payload/LumiFilm.app/PlugIns/LumiFilmWidget.appex
        fi
        /usr/bin/codesign --force --sign - --timestamp=none Payload/LumiFilm.app
        zip -r9 ../LumiFilm-Unsigned.ipa Payload

    - name: Upload Unsigned IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LumiFilm-Unsigned-IPA
        path: LumiFilm-Unsigned.ipa
        if-no-files-found: error

    - name: Publish Automatic GitHub Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v10.6.2-${{ github.run_number }}"
        name: "LumiFilm v10.6.2 (Build #${{ github.run_number }}) — 满幅渐隐 3D 滚轮 & 1x 同轴激光测距"
        body: |
          ### LumiFilm v10.6.2 胶片闪光灯测光台更新亮点
          - **拟真满幅渐变消失 3D 机械滚轮**：在保持 v10.6.2 熟悉界面与操作逻辑的基础上，左下角拨轮完整铺满整个操控方格，采用真实圆筒弧面渐隐与防滑纹理设计，单手盲操更跟手。
          - **实景测光固定 1x 同轴激光测距**：取消存在视差与测距失准的 0.5x 超广角选项，固定采用与激光雷达同轴的 1x 主摄视角，静止画面轻触任意物体即刻刷新实测距离，并在顶栏提供「回中心」与「HOLD 锁定」按钮。
        files: LumiFilm-Unsigned.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
