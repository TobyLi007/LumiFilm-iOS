        struct MechanicalRotaryDialView: View {
         let selectedParameter: DialParameter
         let currentValueText: String
         let subtitleText: String
         let lang: AppLanguage
         let theme: AppTheme
         let onStepChange: (Int) -> Void
         @State private var visualAngle: Double = 0
         @State private var lastDragAngle: Double? = nil
         @State private var accumulatedAngle: Double = 0
         private func tickColor(for index: Int) -> Color {
          if index == 0 { return theme.accent }
          return (index % 3 == 0) ? Color.white.opacity(0.90) : Color.white.opacity(0.32)
         }
         var body: some View {
          VStack(spacing: 4) {
           ZStack {
            Circle()
             .fill(
             RadialGradient(
              colors: [theme.accent.opacity(0.24), Color.clear],
              center: .center,
              startRadius: 65,
              endRadius: 122
             )
            )
             .frame(width: 224, height: 224)
            Circle()
             .fill(
             AngularGradient(
              colors: theme.dialRingColors,
              center: .center
             )
            )
             .frame(width: 214, height: 214)
             .shadow(color: Color.black.opacity(0.55), radius: 12, x: 0, y: 6)
            Circle()
             .fill(
             LinearGradient(
              colors: [Color(white: 0.17), Color(white: 0.06)],
              startPoint: .topLeading,
              endPoint: .bottomTrailing
             )
            )
             .frame(width: 188, height: 188)
            ZStack {
             ForEach(0..<36, id: \.self) { i in
              Rectangle()
               .fill(tickColor(for: i))
               .frame(width: i % 3 == 0 ? 2.5 : 1.2, height: i % 3 == 0 ? 14 : 7)
               .offset(y: -84)
               .rotationEffect(.degrees(Double(i) * 10.0))
             }
             Circle()
              .fill(theme.accent)
              .frame(width: 8.5, height: 8.5)
              .offset(y: -68)
              .shadow(color: theme.accent, radius: 5)
            }
             .rotationEffect(.degrees(visualAngle))
            Circle()
             .fill(.ultraThinMaterial)
             .frame(width: 132, height: 132)
             .overlay(
             Circle()
              .stroke(
              LinearGradient(
               colors: [Color.white.opacity(0.50), theme.accent.opacity(0.35), Color.clear],
               startPoint: .topLeading,
               endPoint: .bottomTrailing
              ),
              lineWidth: 1.5
             )
            )
            VStack(spacing: 2) {
             Image(systemName: selectedParameter.icon)
              .font(.system(size: 14, weight: .bold))
              .foregroundStyle(theme.accent)
             Text(currentValueText)
              .font(.system(size: 24, weight: .black, design: .rounded))
              .foregroundStyle(Color.white)
              .minimumScaleFactor(0.7)
              .contentTransition(.numericText())
             Text(lang == .en ? "Spin or Tap - / +" : "滑动波轮或点两侧")
              .font(.system(size: 8.5, weight: .bold, design: .monospaced))
              .foregroundStyle(Color.white.opacity(0.55))
            }
            HStack {
             Button {
              withAnimation(.spring(response: 0.22, dampingFraction: 0.75)) {
               visualAngle -= 14
              }
              onStepChange(-1)
             } label: {
              Image(systemName: "minus")
               .font(.system(size: 16, weight: .black))
               .foregroundStyle(Color.white)
               .frame(width: 42, height: 42)
               .background(.ultraThinMaterial, in: Circle())
               .overlay(Circle().stroke(theme.accent.opacity(0.55), lineWidth: 1.1))
             }
             Spacer()
             Button {
              withAnimation(.spring(response: 0.22, dampingFraction: 0.75)) {
               visualAngle += 14
              }
              onStepChange(1)
             } label: {
              Image(systemName: "plus")
               .font(.system(size: 16, weight: .black))
               .foregroundStyle(Color.white)
               .frame(width: 42, height: 42)
               .background(.ultraThinMaterial, in: Circle())
               .overlay(Circle().stroke(theme.accent.opacity(0.55), lineWidth: 1.1))
             }
            }
             .padding(.horizontal, 6)
           }
            .contentShape(Rectangle())
            .gesture(
            DragGesture(minimumDistance: 0)
             .onChanged { value in
             let center = CGPoint(x: 112, y: 112)
             let dx = Double(value.location.x - center.x)
             let dy = Double(value.location.y - center.y)
             let currentAngle = atan2(dy, dx) * 180.0 / .pi
             if let last = lastDragAngle {
              var delta = currentAngle - last
              if delta > 180 { delta -= 360 }
              if delta < -180 { delta += 360 }
              visualAngle += delta
              accumulatedAngle += delta
              let stepThreshold = 12.0
              if abs(accumulatedAngle) >= stepThreshold {
               let steps = Int(accumulatedAngle / stepThreshold)
               accumulatedAngle -= Double(steps) * stepThreshold
               onStepChange(steps > 0 ? 1 : -1)
              }
             }
             lastDragAngle = currentAngle
            }
             .onEnded { _ in
             lastDragAngle = nil
             accumulatedAngle = 0
            }
           )
           Text(subtitleText)
            .font(.system(size: 10.5, weight: .medium))
            .foregroundStyle(Color.white.opacity(0.78))
            .lineLimit(1)
          }
         }
        }
