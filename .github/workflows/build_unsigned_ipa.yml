                            VStack(alignment: .leading, spacing: 4) {
                                Text("实时测距 (\(cameraReader.sensorModeBadge))")
                                    .font(.system(size: 11, weight: .bold))
                                    .foregroundColor(theme.textSecondary)
                                Text(String(format: "%.2f m", cameraReader.measuredDistanceMeters))
                                    .font(.system(size: 24, weight: .black, design: .monospaced))
                                    .foregroundColor(theme.okGreen)
                                Text("建议快门: \(ContentView.shutterLabels[suggestedShutterIndex])")
                                    .font(.system(size: 10, weight: .semibold))
                                    .foregroundColor(theme.textPrimary)
                            }
                            .padding(12)
                            .frame(maxWidth: .infinity, alignment: .leading)
                            .background(theme.panelCard)
                            .clipShape(RoundedRectangle(cornerRadius: 14))
                        }

                        // One-Tap Apply Buttons
                        VStack(spacing: 8) {
                            Button {
                                onApplyMeasuredDistance(cameraReader.measuredDistanceMeters)
                                onApplyAmbientEV(cameraReader.measuredEV100, ambientDiffAgainstCurrent)
                                dismiss()
                            } label: {
                                HStack {
                                    Image(systemName: "bolt.Cricle.fill")
                                    Text(String(format: "一键填入距离 (%.1fm) + 环境光比 (%+.1f EV)", cameraReader.measuredDistanceMeters, ambientDiffAgainstCurrent))
