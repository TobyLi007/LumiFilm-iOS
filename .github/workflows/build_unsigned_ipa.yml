          static let evBiasLabels: [String] = ["-3.0", "-2.7", "-2.3", "-2.0", "-1.7", "-1.3", "-1.0", "-0.7", "-0.3", "0.0", "+0.3", "+0.7", "+1.0", "+1.3", "+1.7", "+2.0", "+2.3", "+2.7", "+3.0"]
          static let powerFractions: [(label: String, value: Double)] = [
              ("1/1", 1.0), ("1/2", 0.5), ("1/4", 0.25), ("1/8", 0.125),
