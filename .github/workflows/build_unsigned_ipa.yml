        }

        var bellowsCompensationEV: Double {
            guard bellowsExtensionMM > 1.0, lensFocalMM > 10.0 else { return 0.0 }
            let magnification = bellowsExtensionMM / lensFocalMM
            return 2.0 * log2(1.0 + magnification)
        }

        // v10.5.0 Decoupled Optical Loss vs Flash Mode Bias:
        // Pure physical light loss between flash/subject/sensor (ND filter + diffuser/bounce + bellows extension)
        var opticalPhysicalLossEV: Double {
            Double(ndFilterStops) + modifierLossEV + bellowsCompensationEV
        }

        // Total EV shift applied when calculating flash output power
        var totalEffectiveCompensationEV: Double {
            exposureCompEV + currentStock.latitudeBiasEV + opticalPhysicalLossEV + shutterSyncMode.recommendedAmbientShiftEV
        }

        var effectiveGN: Double {
            currentFlash.effectiveGN(forZoom: flashZoomMM)
