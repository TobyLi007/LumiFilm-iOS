          // 4. Lower Split Deck: Left Bottom iOS Clock Drum Wheel + Right Bottom Parameter Cards (Fixed 208pt Height — Never Jumps!)
          private var lowerQuadrantControlDeck: some View {
              HStack(spacing: 10) {
                  // Bottom-Left: Full-Quadrant Vanishing 3D Barrel Wheel (v10.7.0)
                  iOSClockDrumWheelView(
                      theme: theme,
                      title: activeDial.rawValue,
                      unit: activeDial.unit,
                      items: wheelItemsForActiveDial,
                      selectedIndex: Binding(
                          get: { currentWheelIndex },
                          set: { newIdx in applyWheelIndex(newIdx) }
                      ),
                      onStepTick: {
                          feedback.playClick(theme: theme)
                      },
                      onEndScroll: {
                          speakCurrentResult()
                      },
                      onResetZero: activeDial == .evBias ? {
                          exposureCompEV = 0.0
                          feedback.playSuccess()
                          speakCurrentResult()
                      } : nil
                  )
                  .frame(maxWidth: .infinity)
                  .frame(height: 208)

                  // Bottom-Right: 5 Selectable Parameter Cards (Distance, Aperture, Shutter, EV Bias, ISO)
                  VStack(spacing: 5) {
                      ForEach(DialParameter.allCases) { param in
                          let isSel = activeDial == param
                          Button {
                              activeDial = param
                              feedback.playClick(theme: theme)
                          } label: {
                              HStack(spacing: 6) {
                                  Image(systemName: param.icon)
                                      .font(.system(size: 12, weight: .bold))
                                      .foregroundColor(isSel ? .black : (param == .evBias && abs(exposureCompEV) > 0.05 ? theme.secondaryAccent : theme.accent))
                                      .frame(width: 22, height: 22)
                                      .background(isSel ? theme.accent : Color.white.opacity(0.06))
                                      .clipShape(Circle())

                                  Text(param.rawValue)
                                      .font(.system(size: 11, weight: .bold))
                                      .foregroundColor(isSel ? theme.textPrimary : theme.textSecondary)

                                  Spacer(minLength: 2)

                                  if param == .distance {
                                      Button {
                                          manualDistanceInput = String(format: "%.1f", distanceMeters)
                                          isEditingDistanceNumber = true
                                      } label: {
                                          Image(systemName: "keyboard")
                                              .font(.system(size: 9, weight: .bold))
                                              .foregroundColor(theme.secondaryAccent)
                                              .padding(4)
                                              .background(theme.secondaryAccent.opacity(0.16))
                                              .clipShape(Circle())
                                      }
                                  } else if param == .evBias && abs(exposureCompEV) > 0.05 {
                                      Button {
                                          exposureCompEV = 0.0
                                          feedback.playClick(theme: theme)
                                          speakCurrentResult()
                                      } label: {
                                          Text("归零")
                                              .font(.system(size: 8, weight: .bold))
                                              .foregroundColor(theme.secondaryAccent)
                                              .padding(.horizontal, 4)
                                              .padding(.vertical, 2)
                                              .background(theme.secondaryAccent.opacity(0.16))
                                              .clipShape(Capsule())
                                      }
                                  }

                                  Text(formattedValue(for: param))
                                      .font(.system(size: 13, weight: .black, design: .monospaced))
                                      .foregroundColor(isSel ? theme.accent : (param == .evBias && abs(exposureCompEV) > 0.05 ? theme.secondaryAccent : theme.textPrimary))
                              }
                              .padding(.horizontal, 9)
                              .padding(.vertical, 6)
                              .frame(maxWidth: .infinity, maxHeight: .infinity)
                              .background(
                                  RoundedRectangle(cornerRadius: 11, style: .continuous)
                                      .fill(isSel ? theme.accent.opacity(0.18) : theme.panelCard)
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 11, style: .continuous)
                                              .stroke(isSel ? theme.accent : Color.white.opacity(0.06), lineWidth: isSel ? 1.4 : 0.8)
                                      )
                              )
                          }
                          .buttonStyle(.plain)
                      }
                  }
                  .frame(maxWidth: .infinity)
                  .frame(height: 208)
              }
              .alert("精确输入主体距离 (米)", isPresented: $isEditingDistanceNumber) {
                  TextField("例如 1.85", text: $manualDistanceInput)
                      .keyboardType(.decimalPad)
                  Button("取消", role: .cancel) {}
                  Button("确定") {
                      if let val = Double(manualDistanceInput.replacingOccurrences(of: ",", with: ".")) {
                          distanceMeters = max(0.25, min(30.0, val))
                          feedback.playSuccess()
                          speakCurrentResult()
                      }
                  }
              } message: {
                  Text("支持输入 0.25m ~ 30.0m 任意精确距离，自动代入闪光 GN 与近摄景深公式。")
              }
          }

