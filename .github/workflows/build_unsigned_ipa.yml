    func recenterExposurePoint() { setSpotPoint(CGPoint(x: 0.5, y: 0.5)) }
    func setSpotPoint(_ normPt: CGPoint) {
    let cx = max(0.08, min(0.92, normPt.x)); let cy = max(0.08, min(0.92, normPt.y))
    self.forceInstantSample = true; self.lastTapTime = Date().timeIntervalSinceReferenceDate
    DispatchQueue.main.async { self.spotNormalizedPoint = CGPoint(x: cx, y: cy) }
    guard let cam = device else { return }
    let devPt = CGPoint(x: cy, y: 1.0 - cx)
    do { try cam.lockForConfiguration()
    if cam.isExposurePointOfInterestSupported { cam.exposurePointOfInterest = devPt }
    if cam.isExposureModeSupported(.autoExpose) { cam.exposureMode = .autoExpose } else if cam.isExposureModeSupported(.continuousAutoExposure) { cam.exposureMode = .continuousAutoExposure }
    if cam.isFocusPointOfInterestSupported { cam.focusPointOfInterest = devPt }
    if cam.isFocusModeSupported(.autoFocus) { cam.focusMode = .autoFocus } else if cam.isFocusModeSupported(.continuousAutoFocus) { cam.focusMode = .continuousAutoFocus }
    cam.unlockForConfiguration() } catch {}
    videoQueue.asyncAfter(deadline: .now() + 0.55) { [weak self] in
    guard let self = self, let c = self.device, Date().timeIntervalSinceReferenceDate - self.lastTapTime >= 0.50 else { return }
    do { try c.lockForConfiguration()
    if c.isExposureModeSupported(.continuousAutoExposure) { c.exposureMode = .continuousAutoExposure }
    if c.isFocusModeSupported(.continuousAutoFocus) { c.focusMode = .continuousAutoFocus }
    c.unlockForConfiguration() } catch {} }}
    func depthDataOutput(_ output: AVCaptureDepthDataOutput, didOutput depthData: AVDepthData, timestamp: CMTime, connection: AVCaptureConnection) {
    guard !isHoldLocked else { return }
    let converted = depthData.converting(toDepthDataType: kCVPixelFormatType_DepthFloat32); let buf = converted.depthDataMap
    CVPixelBufferLockBaseAddress(buf, .readOnly); defer { CVPixelBufferUnlockBaseAddress(buf, .readOnly) }
    let w = CVPixelBufferGetWidth(buf); let h = CVPixelBufferGetHeight(buf); let rowBytes = CVPixelBufferGetBytesPerRow(buf)
    guard let base = CVPixelBufferGetBaseAddress(buf), w > 4, h > 4 else { return }
    let sp = spotNormalizedPoint
    let normX: Double = (w > h) ? Double(sp.y) : Double(sp.x)
    let normY: Double = (w > h) ? Double(1.0 - sp.x) : Double(sp.y)
    let centerX = Int(Double(w) * normX); let centerY = Int(Double(h) * normY)
    let radX = max(3, w * 6 / 100); let radY = max(3, h * 6 / 100)
    let cxMin = max(0, min(w - 1, centerX - radX)); let cxMax = max(0, min(w - 1, centerX + radX))
    let cyMin = max(0, min(h - 1, centerY - radY)); let cyMax = max(0, min(h - 1, centerY + radY))
    var validSamples: [Float] = []
    for y in stride(from: cyMin, through: cyMax, by: 1) {
    let rowPtr = base.advanced(by: y * rowBytes).assumingMemoryBound(to: Float32.self)
    for x in stride(from: cxMin, through: cxMax, by: 1) {
    let d = rowPtr[x]
    if d.isFinite && d >= 0.25 && d <= 15.0 { validSamples.append(d) }}}
    guard !validSamples.isEmpty else { return }
    validSamples.sort()
    let p35 = Double(validSamples[max(0, validSamples.count * 35 / 100)])
    if forceInstantSample || (Date().timeIntervalSinceReferenceDate - lastTapTime < 0.45) { smoothedDist = p35; forceInstantSample = false }
    else { smoothedDist = smoothedDist * 0.50 + p35 * 0.50 }
    let roundedDist = max(0.4, min(15.0, (smoothedDist * 10.0).rounded() / 10.0))
    lastDepthTime = Date().timeIntervalSinceReferenceDate
    DispatchQueue.main.async { self.hasLiDARDepth = true; self.liveDistanceMeters = roundedDist }}
    func captureOutput(_ output: AVCaptureOutput, didOutput sampleBuffer: CMSampleBuffer, from connection: AVCaptureConnection) {
    guard !isHoldLocked, let cam = device else { return }
    let now = Date().timeIntervalSinceReferenceDate
    guard now - lastUIUpdateTime >= 0.08 else { return }
    lastUIUpdateTime = now
    let ap = Double(max(cam.lensAperture, 1.2)); let dur = max(CMTimeGetSeconds(cam.exposureDuration), 0.00005); let isoVal = Double(max(cam.iso, 20.0)); let targetOffset = Double(cam.exposureTargetOffset)
    let rawEV100 = log2((ap * ap) / dur) - log2(isoVal / 100.0) - targetOffset + calibrationTrimEV; let clampedEV = max(-2.0, min(18.0, rawEV100))
    if now - lastTapTime < 0.45 { smoothedEV = clampedEV } else { smoothedEV = (smoothedEV * 0.65) + (clampedEV * 0.35) }
    let roundedEV = (smoothedEV * 10.0).rounded() / 10.0; let denom = max(1, Int((1.0 / dur).rounded()))
    var fallbackDist: Double? = nil
    if now - lastDepthTime > 0.45 {
    let lp = Double(max(0.02, min(0.98, cam.lensPosition))); let est = 0.35 / pow(1.0 - lp, 0.82); let clampedD = max(0.5, min(12.0, (est * 10.0).rounded() / 10.0))
    if forceInstantSample || (now - lastTapTime < 0.45) { smoothedDist = clampedD; forceInstantSample = false } else { smoothedDist = smoothedDist * 0.60 + clampedD * 0.40 }
    fallbackDist = (smoothedDist * 10.0).rounded() / 10.0 }
    DispatchQueue.main.async {
    self.liveEV100 = roundedEV; self.cameraISO = Float(isoVal); self.cameraShutterDenom = denom; self.cameraAperture = Float(ap); self.cameraTargetOffset = Float(targetOffset)
    if let fd = fallbackDist { self.liveDistanceMeters = fd }
    if self.continuousSyncToMeter { self.onLiveEVUpdated?(roundedEV) }}}}
