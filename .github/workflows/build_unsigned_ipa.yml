          // MARK: - Wheel Helpers
          private var wheelItemsForActiveDial: [String] {
              switch activeDial {
              case .distance:
                  return Self.distances.map { String(format: "%.1f", $0) }
              case .aperture:
                  return Self.apertures.map { String(format: "f/%.1f", $0) }
              case .shutter:
                  return Self.shutterLabels
              case .evBias:
                  return Self.evBiasLabels
              case .iso:
                  return Self.isoValues.map { "ISO \(Int($0))" }
              }
          }

          private var currentWheelIndex: Int {
              switch activeDial {
              case .distance:
                  return closestIndex(in: Self.distances, to: distanceMeters)
              case .aperture:
                  return closestIndex(in: Self.apertures, to: apertureF)
              case .shutter:
                  return max(0, min(Self.shutterLabels.count - 1, shutterIndex))
              case .evBias:
                  return closestIndex(in: Self.evBiasValues, to: exposureCompEV)
              case .iso:
                  return closestIndex(in: Self.isoValues, to: effectiveISO)
              }
          }

          private func applyWheelIndex(_ idx: Int) {
              switch activeDial {
              case .distance:
                  let safe = max(0, min(Self.distances.count - 1, idx))
                  distanceMeters = Self.distances[safe]
              case .aperture:
                  let safe = max(0, min(Self.apertures.count - 1, idx))
                  apertureF = Self.apertures[safe]
              case .shutter:
                  shutterIndex = max(0, min(Self.shutterLabels.count - 1, idx))
              case .evBias:
                  let safe = max(0, min(Self.evBiasValues.count - 1, idx))
                  exposureCompEV = Self.evBiasValues[safe]
              case .iso:
                  let safe = max(0, min(Self.isoValues.count - 1, idx))
                  selectedStockID = "custom_iso"
                  customISO = Self.isoValues[safe]
              }
          }

          private func formattedValue(for param: DialParameter) -> String {
              switch param {
              case .distance:
                  return String(format: "%.1fm", distanceMeters)
              case .aperture:
                  return String(format: "f/%.1f", apertureF)
              case .shutter:
                  return currentShutterLabel
              case .evBias:
                  return String(format: "%+.1f", exposureCompEV)
              case .iso:
                  return "\(Int(effectiveISO))"
              }
          }

          private func closestIndex(in array: [Double], to target: Double) -> Int {
              var bestIdx = 0
              var bestDiff = Double.greatestFiniteMagnitude
              for (i, v) in array.enumerated() {
                  let d = abs(v - target)
                  if d < bestDiff {
                      bestDiff = d
                      bestIdx = i
                  }
              }
              return bestIdx
          }

          private func formatFraction(_ val: Double) -> String {
              let denom = Int(round(1.0 / max(0.001, val)))
              return "1/\(denom)"
          }

          // MARK: - Logbook & Widget Sync
          private var decodedLogs: [FilmFrameRecord] {
              guard let data = filmLogsJSON.data(using: .utf8),
                    let arr = try? JSONDecoder().decode([FilmFrameRecord].self, from: data) else { return [] }
              return arr
          }

          private func saveLogs(_ logs: [FilmFrameRecord]) {
              if let data = try? JSONEncoder().encode(logs),
                 let str = String(data: data, encoding: .utf8) {
                  filmLogsJSON = str
              }
          }

          private func quickRecordCurrentFrame() {
              isLocatingGPS = true
              let capturedRoll = currentRollName
              let capturedFrame = currentFrameNumber
              let capturedStock = currentStock.name
              let capturedISO = Int(effectiveISO)
              let capturedFlash = currentFlash.name
              let capturedPower = closestPowerStop.label
              let capturedDist = distanceMeters
              let capturedAperture = apertureF
              let capturedShutter = currentShutterLabel
              let capturedComp = totalEffectiveCompensationEV
              let capturedNote = frameNoteDraft

              locationResolver.requestCurrentAddress { address, lat, lon in
                  isLocatingGPS = false
                  lastResolvedAddress = address
                  let record = FilmFrameRecord(
                      rollName: capturedRoll,
                      frameNumber: capturedFrame,
                      timestamp: Date(),
                      stockName: capturedStock,
                      effectiveISO: capturedISO,
                      flashName: capturedFlash,
                      flashPower: capturedPower,
                      distanceMeters: capturedDist,
                      aperture: capturedAperture,
                      shutterLabel: capturedShutter,
                      compEV: capturedComp,
                      note: capturedNote,
                      locationAddress: address,
                      latitude: lat,
                      longitude: lon
                  )
                  var current = decodedLogs
                  current.insert(record, at: 0)
                  saveLogs(current)
                  currentFrameNumber += 1
                  frameNoteDraft = ""
                  feedback.playSuccess()
              }
          }

          private func deleteLogItem(_ id: UUID) {
              var current = decodedLogs
              // Option F: If deleting the most recently logged frame, decrement currentFrameNumber automatically
              if let first = current.first, first.id == id && currentFrameNumber > 1 {
                  currentFrameNumber = max(1, first.frameNumber)
              }
              current.removeAll { $0.id == id }
              saveLogs(current)
          }

          private func exportLogsCSV() {
              var csv = "Roll,Frame,Timestamp,FilmStock,ISO,Flash,FlashPower,Distance_m,Aperture,Shutter,Comp_EV,Address,Latitude,Longitude,Note\n"
              let df = ISO8601DateFormatter()
              for r in decodedLogs {
                  let safeAddress = r.locationAddress.replacingOccurrences(of: ",", with: " ")
                  let safeNote = r.note.replacingOccurrences(of: ",", with: " ")
                  let latStr = r.latitude.map { String(format: "%.6f", $0) } ?? ""
                  let lonStr = r.longitude.map { String(format: "%.6f", $0) } ?? ""
                  csv += "\(r.rollName),\(r.frameNumber),\(df.string(from: r.timestamp)),\(r.stockName),\(r.effectiveISO),\(r.flashName),\(r.flashPower),\(String(format: "%.2f", r.distanceMeters)),f/\(String(format: "%.1f", r.aperture)),\(r.shutterLabel),\(String(format: "%+.1f", r.compEV)),\(safeAddress),\(latStr),\(lonStr),\(safeNote)\n"
              }
              let url = FileManager.default.temporaryDirectory.appendingPathComponent("LumiFilm_Logs.csv")
              try? csv.write(to: url, atomically: true, encoding: .utf8)
              shareFileURL = url
          }

          private func speakCurrentResult(force: Bool = false) {
              guard force || voiceBroadcastEnabled else { return }
              let res = closestPowerStop
              let text: String
              if flashPowerLockEnabled {
                  text = String(format: "锁定功率 %@，建议距离 %.1f 米，或光圈 %.1f", res.label, lockedRecommendedDistance, lockedRecommendedAperture)
              } else if res.isOverLimit {
                  text = "注意，闪光灯功率过载，请开大光圈或缩短距离"
              } else if res.isUnderMin {
                  text = "注意，距离过近可能过曝，请缩小光圈或加减光镜"
              } else {
                  let delta = abs(res.diffEV) < 0.08 ? "精准曝光" : String(format: "余量 %+.1f 档", res.diffEV)
                  text = "距离 \(String(format: "%.1f", distanceMeters)) 米，光圈 \(String(format: "%.1f", apertureF))，建议闪光输出 \(res.label)，\(delta)"
              }
              feedback.speak(text, persona: voicePersona, rate: Float(voiceRate), enabled: true)
          }

