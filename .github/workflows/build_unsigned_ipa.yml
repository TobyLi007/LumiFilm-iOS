    private var onAutoStopAfterActionTrigger: (() -> Void)?
    override init() {
    super.init(); synthesizer.delegate = self; impactLight.prepare(); impactMedium.prepare(); impactRigid.prepare(); selectionGen.prepare() }
    func dialTick(soundEnabled: Bool, hapticEnabled: Bool, magneticSnap: Bool = false) {
    if hapticEnabled { if magneticSnap { impactRigid.impactOccurred(intensity: 0.95) } else { selectionGen.selectionChanged() }}
    if soundEnabled { AudioServicesPlaySystemSound(magneticSnap ? 1157 : 1104) }}
    func buttonTap(soundEnabled: Bool, hapticEnabled: Bool) {
    if hapticEnabled { impactLight.impactOccurred() }
    if soundEnabled { AudioServicesPlaySystemSound(1104) }}
    func tabSwitchHaptic(soundEnabled: Bool, hapticEnabled: Bool) {
    if hapticEnabled { impactRigid.impactOccurred(intensity: 0.85) }
    if soundEnabled { AudioServicesPlaySystemSound(1104) }}
    func lockToggleFeedback(soundEnabled: Bool, hapticEnabled: Bool) {
    if hapticEnabled { impactMedium.impactOccurred() }
    if soundEnabled { AudioServicesPlaySystemSound(1105) }}
    func zeroEVSnapFeedback(soundEnabled: Bool, hapticEnabled: Bool) {
    if hapticEnabled { notifyGen.notificationOccurred(.success) }
    if soundEnabled { AudioServicesPlaySystemSound(1157) }}
    func refreshVoiceQualityStatus(persona: VoicePersona, lang: AppLanguage) {
    let langCode = (lang == .en) ? "en-US" : "zh-CN"
    let voices = AVSpeechSynthesisVoice.speechVoices().filter { $0.language.hasPrefix(lang == .en ? "en" : "zh") }
    if let best = voices.sorted(by: { $0.quality.rawValue > $1.quality.rawValue }).first {
    voiceQualityText = "\(best.name) (\(langCode))" } else { voiceQualityText = langCode }}
    func toggleSpeakExposure(_ text: String, soundEnabled: Bool, persona: VoicePersona, lang: AppLanguage) {
    guard soundEnabled else { return }
    if synthesizer.isSpeaking { synthesizer.stopSpeaking(at: .immediate); isSpeaking = false; return }
    try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .spokenAudio, options: [.duckOthers])
    try? AVAudioSession.sharedInstance().setActive(true)
    let utt = AVSpeechUtterance(string: text)
    let prefix = (lang == .en) ? "en" : "zh"
    let candidates = AVSpeechSynthesisVoice.speechVoices().filter { $0.language.hasPrefix(prefix) }.sorted { $0.quality.rawValue > $1.quality.rawValue }
    utt.voice = candidates.first ?? AVSpeechSynthesisVoice(language: lang == .en ? "en-US" : "zh-CN")
    utt.pitchMultiplier = persona.pitch; utt.rate = persona.rate
    isSpeaking = true; synthesizer.speak(utt) }
    func speechSynthesizer(_ synthesizer: AVSpeechSynthesizer, didFinish utterance: AVSpeechUtterance) { DispatchQueue.main.async { self.isSpeaking = false }}
    func speechSynthesizer(_ synthesizer: AVSpeechSynthesizer, didCancel utterance: AVSpeechUtterance) { DispatchQueue.main.async { self.isSpeaking = false }}
    func toggleVoiceListening(lang: AppLanguage, onRecognized: @escaping (String) -> Void) {
    if isListening { stopVoiceListening(); return }
    self.onCommandRecognized = onRecognized; self.onAutoStopAfterActionTrigger = nil
    SFSpeechRecognizer.requestAuthorization { authStatus in DispatchQueue.main.async {
    if authStatus == .authorized { AVAudioApplication.requestRecordPermission { granted in DispatchQueue.main.async { if granted { self.startRecordingSession(lang: lang) }}}} }}}
    func startVoiceFromShortcut(lang: AppLanguage, onRecognized: @escaping (String) -> Void, onAutoStoppedSpeak: @escaping () -> Void) {
    if isListening { stopVoiceListening() }
    self.onCommandRecognized = onRecognized; self.onAutoStopAfterActionTrigger = onAutoStoppedSpeak
    SFSpeechRecognizer.requestAuthorization { authStatus in DispatchQueue.main.async {
    if authStatus == .authorized { AVAudioApplication.requestRecordPermission { granted in DispatchQueue.main.async { if granted { FeedbackEngine.shared.startRecordingSession(lang: lang) }}}}}} }
    func startRecordingSession(lang: AppLanguage) {
    stopVoiceListening()
    let locale = Locale(identifier: lang == .en ? "en-US" : "zh-CN")
    speechRecognizer = SFSpeechRecognizer(locale: locale)
    guard let recognizer = speechRecognizer, recognizer.isAvailable else { return }
    do {
    let session = AVAudioSession.sharedInstance()
    try session.setCategory(.playAndRecord, mode: .measurement, options: [.defaultToSpeaker, .allowBluetooth])
    try session.setActive(true, options: .notifyOthersOnDeactivation)
    recognitionRequest = SFSpeechAudioBufferRecognitionRequest()
    guard let req = recognitionRequest else { return }
    req.shouldReportPartialResults = true
    let inputNode = audioEngine.inputNode
    let fmt = inputNode.outputFormat(forBus: 0)
    inputNode.removeTap(onBus: 0)
    inputNode.installTap(onBus: 0, bufferSize: 1024, format: fmt) { buf, _ in req.append(buf) }
    audioEngine.prepare(); try audioEngine.start(); isListening = true
    resetSilenceTimer()
    recognitionTask = recognizer.recognitionTask(with: req) { [weak self] res, err in
    guard let self = self else { return }
    if let r = res {
    let str = r.bestTranscription.formattedString
    DispatchQueue.main.async { self.onCommandRecognized?(str); self.resetSilenceTimer() }
    }
    if err != nil || (res?.isFinal ?? false) { DispatchQueue.main.async { self.stopVoiceListening(triggerAutoSpeak: true) } }}
    } catch { stopVoiceListening() }}
    private func resetSilenceTimer() {
    silenceTimer?.invalidate()
    silenceTimer = Timer.scheduledTimer(withTimeInterval: 2.2, repeats: false) { [weak self] _ in self?.stopVoiceListening(triggerAutoSpeak: true) }}
    func stopVoiceListening(triggerAutoSpeak: Bool = false) {
    silenceTimer?.invalidate(); silenceTimer = nil
    if audioEngine.isRunning { audioEngine.stop(); audioEngine.inputNode.removeTap(onBus: 0) }
    recognitionRequest?.endAudio(); recognitionRequest = nil
    recognitionTask?.cancel(); recognitionTask = nil
    let wasListening = isListening; isListening = false
    if wasListening && triggerAutoSpeak, let cb = onAutoStopAfterActionTrigger { onAutoStopAfterActionTrigger = nil; DispatchQueue.main.asyncAfter(deadline: .now() + 0.25) { cb() } }}}
