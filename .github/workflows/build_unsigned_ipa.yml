    final class LocalLoopbackSyncBridge {
    static let shared = LocalLoopbackSyncBridge()
    let discoveredGroups = ["group.com.lumifilm.flashmeter"]
    private let udpPort: UInt16 = 49188; private let pbName = "com.lumifilm.shared.pb.v93"
    private var serverRunning = false; private let queue = DispatchQueue(label: "com.lumifilm.udp.server", qos: .utility)
    private var latestDict: [String: Double] = [:]
    func publishState(_ dict: [String: Double]) {
    latestDict = dict
    if let data = try? JSONEncoder().encode(dict) {
    UserDefaults.standard.set(data, forKey: "lumifilm_v93_local")
    UserDefaults(suiteName: "group.com.lumifilm.flashmeter")?.set(data, forKey: "lumifilm_v93_dict")
    if let pb = UIPasteboard(name: UIPasteboard.Name(pbName), create: true) { pb.setData(data, forPasteboardType: "public.json") }
    for gid in discoveredGroups {
    if let url = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: gid)?.appendingPathComponent("lumifilm_v93.json") { try? data.write(to: url, options: .atomic) }}}
    WidgetCenter.shared.reloadAllTimelines() }
    func startServerIfNeeded() {
    guard !serverRunning else { return }; serverRunning = true
    queue.async { [weak self] in
    guard let self = self else { return }
    let fd = socket(AF_INET, SOCK_DGRAM, 0); guard fd >= 0 else { self.serverRunning = false; return }
    var reuse: Int32 = 1; setsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &reuse, socklen_t(MemoryLayout<Int32>.size))
    var addr = sockaddr_in(); addr.sin_len = UInt8(MemoryLayout<sockaddr_in>.size); addr.sin_family = sa_family_t(AF_INET); addr.sin_port = in_port_t(self.udpPort).bigEndian; addr.sin_addr.s_addr = inet_addr("127.0.0.1")
    let bindRes = withUnsafePointer(to: &addr) { aPtr in aPtr.withMemoryRebound(to: sockaddr.self, capacity: 1) { sa in bind(fd, sa, socklen_t(MemoryLayout<sockaddr_in>.size)) }}
    guard bindRes == 0 else { close(fd); self.serverRunning = false; return }
    var buf = [UInt8](repeating: 0, count: 2048)
    while true {
    var cliAddr = sockaddr_in(); var cliLen = socklen_t(MemoryLayout<sockaddr_in>.size)
    let n = withUnsafeMutablePointer(to: &cliAddr) { aPtr in aPtr.withMemoryRebound(to: sockaddr.self, capacity: 1) { sa in recvfrom(fd, &buf, buf.count, 0, sa, &cliLen) }}
    if n > 0 {
    let msg = String(bytes: buf[0..<n], encoding: .utf8) ?? "GET"
    if msg.hasPrefix("SET:") {
    let cmd = String(msg.dropFirst(4))
    self.applyCommandInMemory(cmd)
    DispatchQueue.main.async { NotificationCenter.default.post(name: Notification.Name("LumiFilmWidgetRemoteSet"), object: nil, userInfo: self.latestDict) }
    }
    if let reply = try? JSONEncoder().encode(self.latestDict) {
    reply.withUnsafeBytes { ptr in _ = withUnsafePointer(to: &cliAddr) { aPtr in aPtr.withMemoryRebound(to: sockaddr.self, capacity: 1) { sa in sendto(fd, ptr.baseAddress, ptr.count, 0, sa, cliLen) }}}}}}}}
    private func applyCommandInMemory(_ cmd: String) {
    var d = latestDict
    let apSteps: [Double] = [1.0, 1.2, 1.4, 1.8, 2.0, 2.8, 3.5, 4.0, 5.6, 8.0, 11.0, 16.0, 22.0]
    let shSteps: [Int] = [-15, -8, -4, -2, 1, 2, 4, 8, 15, 30, 50, 60, 90, 100, 125, 200, 250, 500, 1000, 2000, 4000]
    let distSteps: [Double] = [0.5, 0.7, 1.0, 1.2, 1.5, 2.0, 2.5, 3.0, 4.0, 5.0, 7.0, 10.0, 15.0]
    let evSteps: [Double] = [-2.0, -1.7, -1.3, -1.0, -0.7, -0.3, 0.0, 0.3, 0.7, 1.0, 1.3, 1.7, 2.0]
    let isoSteps: [Double] = [50, 64, 100, 125, 160, 200, 250, 320, 400, 500, 800, 1600, 3200]
    let curAp = d["lf_aperture"] ?? 5.6; let curSh = Int(round(d["lf_shutter"] ?? 125)); let curDist = d["lf_distance"] ?? 2.0; let curEV = d["lf_exp_comp_ev"] ?? 0.0; let curISO = d["lf_iso"] ?? 400.0
    switch cmd {
    case "ap_up": if let idx = apSteps.enumerated().min(by: { abs($0.element - curAp) < abs($1.element - curAp) })?.offset { d["lf_aperture"] = apSteps[min(apSteps.count - 1, idx + 1)] }
    case "ap_down": if let idx = apSteps.enumerated().min(by: { abs($0.element - curAp) < abs($1.element - curAp) })?.offset { d["lf_aperture"] = apSteps[max(0, idx - 1)] }
    case "dist_up": if let idx = distSteps.enumerated().min(by: { abs($0.element - curDist) < abs($1.element - curDist) })?.offset { d["lf_distance"] = distSteps[min(distSteps.count - 1, idx + 1)] }
    case "dist_down": if let idx = distSteps.enumerated().min(by: { abs($0.element - curDist) < abs($1.element - curDist) })?.offset { d["lf_distance"] = distSteps[max(0, idx - 1)] }
    case "sh_up": if let idx = shSteps.firstIndex(of: curSh) { d["lf_shutter"] = Double(shSteps[min(shSteps.count - 1, idx + 1)]) }
    case "sh_down": if let idx = shSteps.firstIndex(of: curSh) { d["lf_shutter"] = Double(shSteps[max(0, idx - 1)]) }
    case "ev_up": if let idx = evSteps.enumerated().min(by: { abs($0.element - curEV) < abs($1.element - curEV) })?.offset { d["lf_exp_comp_ev"] = evSteps[min(evSteps.count - 1, idx + 1)] }
    case "ev_down": if let idx = evSteps.enumerated().min(by: { abs($0.element - curEV) < abs($1.element - curEV) })?.offset { d["lf_exp_comp_ev"] = evSteps[max(0, idx - 1)] }
    case "iso_up": if let idx = isoSteps.enumerated().min(by: { abs($0.element - curISO) < abs($1.element - curISO) })?.offset { d["lf_iso"] = isoSteps[min(isoSteps.count - 1, idx + 1)] }
    case "iso_down": if let idx = isoSteps.enumerated().min(by: { abs($0.element - curISO) < abs($1.element - curISO) })?.offset { d["lf_iso"] = isoSteps[max(0, idx - 1)] }
    default: break }
    latestDict = d }}
    final class LocationAddressResolver: NSObject, ObservableObject, CLLocationManagerDelegate {
    static let shared = LocationAddressResolver()
    private let manager = CLLocationManager(); private let geocoder = CLGeocoder()
    @Published var isLocating: Bool = false
    private var completionHandler: ((String) -> Void)?
    override init() { super.init(); manager.delegate = self; manager.desiredAccuracy = kCLLocationAccuracyNearestTenMeters }
    func fetchCurrentPlace(completion: @escaping (String) -> Void) {
    self.completionHandler = completion; isLocating = true
    let status = manager.authorizationStatus
    if status == .notDetermined { manager.requestWhenInUseAuthorization() }
    else if status == .authorizedWhenInUse || status == .authorizedAlways { manager.requestLocation() }
    else { isLocating = false; completion("定位权限未开启") }}
    func locationManagerDidChangeAuthorization(_ manager: CLLocationManager) {
    let status = manager.authorizationStatus
    if isLocating && (status == .authorizedWhenInUse || status == .authorizedAlways) { manager.requestLocation() }}
    func locationManager(_ manager: CLLocationManager, didUpdateLocations locations: [CLLocation]) {
    guard let loc = locations.last else { isLocating = false; return }
    geocoder.reverseGeocodeLocation(loc) { [weak self] marks, _ in
    DispatchQueue.main.async {
    self?.isLocating = false
    if let pm = marks?.first {
    let parts = [pm.locality, pm.subLocality, pm.thoroughfare, pm.name].compactMap { $0 }
    var unique: [String] = []
    for p in parts { if !unique.contains(p) { unique.append(p) }}
    let text = unique.prefix(3).joined(separator: " · ")
    self?.completionHandler?(text.isEmpty ? String(format: "%.4f, %.4f", loc.coordinate.latitude, loc.coordinate.longitude) : text)
    } else { self?.completionHandler?(String(format: "%.4f, %.4f", loc.coordinate.latitude, loc.coordinate.longitude)) }
    self?.completionHandler = nil }}}
    func locationManager(_ manager: CLLocationManager, didFailWithError error: Error) {
    DispatchQueue.main.async { self.isLocating = false; self.completionHandler?("定位失败"); self.completionHandler = nil }}}
    enum FilmFormatType: Int, CaseIterable, Identifiable {
    case f135 = 0; case f120_645 = 1; case f120_6x6 = 2; case f120_6x7 = 3; case f120_6x9 = 4
