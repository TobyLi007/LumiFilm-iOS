        // MARK: - Haptic & Speech Feedback Engine
        final class FeedbackEngine: NSObject, ObservableObject {
            static let shared = FeedbackEngine()
            private let synthesizer = AVSpeechSynthesizer()
            private let selectionGenerator = UISelectionFeedbackGenerator()
            private let rigidGenerator = UIImpactFeedbackGenerator(style: .rigid)
            private let notifyGenerator = UINotificationFeedbackGenerator()

            override init() {
                super.init()
                selectionGenerator.prepare()
                rigidGenerator.prepare()
            }

            func playClick(theme: AppTheme) {
                rigidGenerator.impactOccurred(intensity: 0.78)
                AudioServicesPlaySystemSound(1104)
            }

            func playSuccess() {
                notifyGenerator.notificationOccurred(.success)
                AudioServicesPlaySystemSound(1157)
            }

            func speak(_ text: String, persona: VoicePersona, rate: Float, enabled: Bool) {
                guard enabled else { return }
                if synthesizer.isSpeaking {
                    synthesizer.stopSpeaking(at: .immediate)
                }
                try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .spokenAudio, options: [.duckOthers])
                try? AVAudioSession.sharedInstance().setActive(true)
                let utterance = AVSpeechUtterance(string: text)
                let zhVoices = AVSpeechSynthesisVoice.speechVoices().filter { $0.language.hasPrefix("zh") }.sorted { $0.quality.rawValue > $1.quality.rawValue }
                utterance.voice = zhVoices.first ?? AVSpeechSynthesisVoice(language: "zh-CN")
                utterance.pitchMultiplier = persona.pitch
                utterance.rate = max(0.38, min(0.62, rate))
                synthesizer.speak(utterance)
            }
        }

