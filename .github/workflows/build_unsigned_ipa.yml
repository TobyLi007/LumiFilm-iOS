           if lastEditedParameter == .distance && lockPower {
            solveForLockedPower(changed: .distance)
           }
           syncWidgetDefaults()
          }
           .onChange(of: shutterDenom) { _, _ in
           if lastEditedParameter == .shutter && lockPower {
            solveForLockedPower(changed: .shutter)
           }
          }
           .onChange(of: manualPowerIndex) { _, _ in
           if lockPower {
            solveForLockedPower(changed: .flashPower)
           }
          }
           .onChange(of: exposureCompEV) { _, newVal in
           let cleanVal: Double
           if abs(newVal) < 0.13 {
            cleanVal = 0.0
           } else {
            let snapped = round(newVal * 5.0) / 5.0
            cleanVal = abs(snapped) < 0.05 ? 0.0 : snapped
           }
           if abs(cleanVal - newVal) > 0.005 {
            exposureCompEV = cleanVal
           }
           if abs(cleanVal - lastSnappedEVComp) >= 0.15 {
            if abs(cleanVal) < 0.05 {
             feedback.zeroEVSnapFeedback(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled)
            } else {
             feedback.dialTick(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled, magneticSnap: false)
            }
            lastSnappedEVComp = cleanVal
           }
           if lockPower {
            solveForLockedPower(changed: .flashPower)
           }
           syncWidgetDefaults()
