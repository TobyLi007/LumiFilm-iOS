        var flashRole: FlashRoleMode { FlashRoleMode(rawValue: flashRoleRaw) ?? .keyAutoSum }
        var voicePersona: VoicePersona { VoicePersona(rawValue: voicePersonaRaw) ?? .magneticMale }

        var customFilmList: [FilmStockModel] {
        guard let d = customFilmsJSON.data(using: .utf8), let arr = try? JSONDecoder().decode([FilmStockModel].self, from: d) else { return [] }
        return arr }
        var allFilmStocks: [FilmStockModel] { FilmStockModel.catalog + customFilmList }
        var currentFilmStock: FilmStockModel {
        allFilmStocks.first(where: { $0.id == filmStockID }) ?? FilmStockModel.catalog[5] }
        var stocksForCurrentBrand: [FilmStockModel] {
        let list = allFilmStocks.filter { $0.brand == filmBrand }
        return list.isEmpty ? FilmStockModel.catalog : list }

        var customFlashList: [FlashUnitModel] {
        guard let d = customFlashesJSON.data(using: .utf8), let arr = try? JSONDecoder().decode([FlashUnitModel].self, from: d) else { return [] }
        return arr }
        var allFlashUnits: [FlashUnitModel] { FlashUnitModel.catalog + customFlashList }
        var currentFlashUnit: FlashUnitModel {
        allFlashUnits.first(where: { $0.id == flashUnitID }) ?? FlashUnitModel.catalog[2] }
        var flashesForCurrentBrand: [FlashUnitModel] {
        if flashBrand == .all { return allFlashUnits }
        let list = allFlashUnits.filter { $0.brand == flashBrand }
        return list.isEmpty ? allFlashUnits : list }

        var effectiveISO: Double {
        let base = (filmBrand == .customISO) ? iso : currentFilmStock.iso
        return max(25.0, min(6400.0, base * pow(2.0, pushPullStops))) }

        var effectiveGNAt100: Double {
        let baseGN = (currentFlashUnit.id == "custom") ? customGN : currentFlashUnit.gnAtISO100
        let ratedZ = Double(max(24, currentFlashUnit.ratedZoomMM))
        let curZ = Double(max(24, flashZoomMM))
        return baseGN * pow(curZ / ratedZ, 0.32) }

        var opticalPhysicalLossEV: Double {
        ndFilterStops + diffuserLossEV }

        var roleBiasEV: Double {
        switch flashRole {
        case .keyAutoSum: return 0.0
        case .fillNatural: return -1.3
        case .catchlightSoft: return -2.0
        case .pureFlash: return 0.0 }}

