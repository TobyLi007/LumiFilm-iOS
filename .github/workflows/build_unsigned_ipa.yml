        msg = lang == .en ? String(format: "Distance %.1f meters, f %.1f, recommended flash power %@, %@", distance, aperture, calc.mainFraction, trimStr) : String(format: "距离 %.1f 米，光圈 %.1f，推荐闪光输出 %@，%@", distance, aperture, calc.mainFraction, trimStr)
        }
        feedback.toggleSpeakExposure(msg, soundEnabled: force || soundEnabled, persona: voicePersona, lang: lang) }

        private func applySpokenVoiceCommand(_ text: String) {
        let low = text.lowercased()
        for d in distanceSteps {
        if low.contains(String(format: "%.1f米", d)) || low.contains("\(Int(d))米") || low.contains(String(format: "%.1fm", d)) {
        distance = d; break
        }}
        for ap in apertureSteps {
        if low.contains(String(format: "光圈%.1f", ap)) || low.contains(String(format: "f%.1f", ap)) || low.contains("光圈\(Int(ap))") {
        aperture = ap; break
        }}
        pushStateToWidget() }

        private func pushStateToWidget() {
        let dict: [String: Double] = [
        "lf_aperture": aperture,
        "lf_distance": distance,
        "lf_shutter": Double(shutter),
        "lf_iso": effectiveISO,
        "lf_gn": effectiveGNAt100,
        "lf_sync_speed": Double(maxSyncSpeed),
        "lf_exp_comp_ev": evComp,
        "lf_aux_loss": totalFlashLossEV,
        "lf_theme": Double(themeRaw),
        "lf_film_format": Double(formatRaw),
        "lf_sync_mode": Double(syncModeRaw),
        "lf_max_aperture": 1.0,
        "lf_sync_ts": Date().timeIntervalSince1970
        ]
        LocalLoopbackSyncBridge.shared.publishState(dict) }
        }

        // MARK: - App-Side Flash Calculator (Matches Widget & Supports Slow-Sync & Min Power)
        struct FlashCalculator_App {
        static func formatShutter(_ s: Int) -> String { s < 0 ? "\(-s)\"" : (s == 1 ? "1\"" : "1/\(s)s") }
        static func powerComponents(gnAt100: Double, iso: Double, distance: Double, aperture: Double, shutter: Int, maxSync: Int, lossEV: Double, formatRaw: Int, syncModeRaw: Int, minDenom: Int, lang: AppLanguage) -> (mainFraction: String, trimBadge: String?, statusNote: String, isWarning: Bool) {
        let isoFactor = sqrt(max(iso, 25.0) / 100.0)
        let fmt = FilmFormatType(rawValue: formatRaw) ?? .f135
        let closeUpLoss = fmt.closeUpLoss(at: distance)
        let effMaxSync = syncModeRaw == 1 ? max(maxSync, 500) : maxSync
        let isOverSync = shutter > effMaxSync
        if syncModeRaw == 0 && isOverSync {
        return (lang == .en ? "SYNC!" : "黑边!", "超同步", lang == .en ? "Over 1/\(effMaxSync)s X-Sync" : "超 1/\(effMaxSync)s 幕帘黑边", true)
        }
        let hssStops = (syncModeRaw == 2 && isOverSync) ? log2(Double(shutter) / Double(effMaxSync)) : 0.0
        let hssLoss = hssStops > 0 ? (1.5 + 1.0 * hssStops) : 0.0
        let leafWideLoss = (syncModeRaw == 1 && shutter >= 400 && aperture <= 2.8) ? 0.35 : 0.0
        let effGN = gnAt100 * isoFactor * pow(2.0, -(lossEV + hssLoss + closeUpLoss + leafWideLoss) / 2.0)
        let maxAp = effGN / max(distance, 0.3)
        let reqRatio = aperture / max(maxAp, 0.05)
        let reqPower = reqRatio * reqRatio
        if reqPower > 1.08 {
        let def = log2(reqPower)
        return ("OVER", String(format: "-%.1fEV", def), lang == .en ? "Full power underexposed" : "全功率仍欠曝·开大光圈", true)
        }
        let minAllowed = 1.0 / Double(max(16, minDenom))
        if reqPower < minAllowed * 0.68 {
        return ("LOW", "<1/\(minDenom)", lang == .en ? "Too close · Stop down" : "距离过近·收小光圈或加ND", true)
        }
        let rawStops = log2(1.0 / reqPower)
        let rounded = round(rawStops * 3.0) / 3.0
        let maxWhole = Int(round(log2(Double(max(16, minDenom)))))
        let whole = max(0, min(maxWhole, Int(round(rounded))))
        let denom = 1 << whole
        let trim = Double(whole) - rounded
        let base = denom == 1 ? "1/1" : "1/\(denom)"
        if abs(trim) < 0.14 {
        return (base, nil, lang == .en ? "Exact Full-Stop Output" : "精准整档闪光输出", false)
        }
        return (base, String(format: "%+.1fEV", trim), lang == .en ? "1/3-Stop Fine Trim" : "1/3档微调余量", false)
        }}

