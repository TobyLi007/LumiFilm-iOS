          var voicePersona: VoicePersona { VoicePersona(rawValue: voicePersonaRaw) ?? .gentleSister }

          var customStocks: [FilmStockModel] {
              guard let data = customFilmStocksJSON.data(using: .utf8),
                    let decoded = try? JSONDecoder().decode([FilmStockModel].self, from: data) else { return [] }
              return decoded
          }
          var allFilmStocks: [FilmStockModel] { FilmStockModel.builtInCatalog + customStocks }
          var currentStock: FilmStockModel {
              allFilmStocks.first(where: { $0.id == selectedStockID }) ?? FilmStockModel.builtInCatalog[2]
          }
          var stocksForSelectedBrand: [FilmStockModel] {
              let filtered = allFilmStocks.filter { $0.brand == selectedBrand && $0.supportedFormats.contains(filmFormat) }
              return filtered.isEmpty ? allFilmStocks.filter { $0.brand == selectedBrand } : filtered
          }

          var customFlashes: [FlashUnitModel] {
              guard let data = customFlashUnitsJSON.data(using: .utf8),
                    let decoded = try? JSONDecoder().decode([FlashUnitModel].self, from: data) else { return [] }
              return decoded
          }
          var allFlashUnits: [FlashUnitModel] { FlashUnitModel.builtInFlashes + customFlashes }
          var currentFlash: FlashUnitModel {
              allFlashUnits.first(where: { $0.id == selectedFlashID }) ?? FlashUnitModel.builtInFlashes[0]
          }
          var currentSyncPreset: CameraShutterPreset {
              CameraShutterPreset.presets.first(where: { $0.id == selectedSyncPresetID }) ?? CameraShutterPreset.presets[0]
          }

          var effectiveISO: Double {
              let base = currentStock.id == "custom_iso" ? customISO : currentStock.nominalISO
              return max(12.0, min(12800.0, base * pow(2.0, pushPullStops)))
          }

          var bellowsCompensationEV: Double {
              guard bellowsExtensionMM > 1.0, lensFocalMM > 10.0 else { return 0.0 }
              let magnification = bellowsExtensionMM / lensFocalMM
              return 2.0 * log2(1.0 + magnification)
          }

          // v10.5.0 Decoupled Optical Loss vs Flash Mode Bias:
          // Pure physical light loss between flash/subject/sensor (ND filter + diffuser/bounce + bellows extension)
          var opticalPhysicalLossEV: Double {
              Double(ndFilterStops) + modifierLossEV + bellowsCompensationEV
          }

          // Total EV shift applied when calculating flash output power
          var totalEffectiveCompensationEV: Double {
              exposureCompEV + currentStock.latitudeBiasEV + opticalPhysicalLossEV + shutterSyncMode.recommendedAmbientShiftEV
          }

          var effectiveGN: Double {
              currentFlash.effectiveGN(forZoom: flashZoomMM)
          }

          var lockedPowerFraction: (label: String, value: Double) {
              let idx = max(0, min(Self.powerFractions.count - 1, lockedPowerFractionIndex))
              return Self.powerFractions[idx]
          }

          // Inverse calculation when Flash Power Lock is enabled:
          // Strictly uses opticalPhysicalLossEV + exposureCompEV + latitudeBiasEV so fill-flash mode doesn't corrupt physical GN!
          var lockedRecommendedDistance: Double {
              let isoFactor = sqrt(effectiveISO / 100.0)
              let physicalEV = exposureCompEV + currentStock.latitudeBiasEV + opticalPhysicalLossEV
              let compFactor = pow(2.0, -physicalEV / 2.0)
              let fullPowerGN = effectiveGN * isoFactor * compFactor
              let lockedGN = fullPowerGN * sqrt(lockedPowerFraction.value)
              return max(0.25, min(30.0, lockedGN / max(0.7, apertureF)))
          }

          var lockedRecommendedAperture: Double {
              let isoFactor = sqrt(effectiveISO / 100.0)
              let physicalEV = exposureCompEV + currentStock.latitudeBiasEV + opticalPhysicalLossEV
              let compFactor = pow(2.0, -physicalEV / 2.0)
              let fullPowerGN = effectiveGN * isoFactor * compFactor
              let lockedGN = fullPowerGN * sqrt(lockedPowerFraction.value)
              return max(0.95, min(64.0, lockedGN / max(0.3, distanceMeters)))
          }

          var requiredFullPowerGNAtISO100: Double {
              let isoFactor = sqrt(effectiveISO / 100.0)
              let compFactor = pow(2.0, totalEffectiveCompensationEV / 2.0)
              var rawReq = (distanceMeters * apertureF / max(0.1, isoFactor)) * compFactor
              if subtractAmbientInFillMode && ambientDifferenceEV > -3.5 {
                  let ambientContribution = min(0.75, pow(2.0, ambientDifferenceEV))
                  let flashShare = max(0.20, 1.0 - ambientContribution * 0.55)
                  rawReq *= sqrt(flashShare)
              }
              return rawReq
          }

          var powerRatio: Double {
              pow(requiredFullPowerGNAtISO100 / max(1.0, effectiveGN), 2.0)
          }

          var closestPowerStop: (label: String, diffEV: Double, isOverLimit: Bool, isUnderMin: Bool) {
              if flashPowerLockEnabled {
                  return (lockedPowerFraction.label, 0.0, false, false)
              }
              let ratio = max(0.0001, powerRatio)
              if ratio > 1.18 {
                  let overEV = log2(ratio)
                  return ("MAX 过载", overEV, true, false)
              }
              let minAllowed = currentFlash.minPowerFraction
              if ratio < minAllowed * 0.70 {
                  let underEV = log2(ratio / minAllowed)
                  return ("< \(formatFraction(minAllowed)) 过曝风险", underEV, false, true)
              }
              let validFractions = Self.powerFractions.filter { $0.value >= minAllowed - 0.0001 }
              var best = validFractions.first ?? ("1/1", 1.0)
              var minLogDiff = Double.greatestFiniteMagnitude
              for item in validFractions {
                  let logDiff = abs(log2(ratio / item.value))
                  if logDiff < minLogDiff {
                      minLogDiff = logDiff
                      best = item
                  }
              }
              let residualEV = log2(ratio / best.value)
              return (best.label, residualEV, false, false)
          }

          var currentShutterSpeed: Double {
              let idx = max(0, min(Self.shutterSpeeds.count - 1, shutterIndex))
              return Self.shutterSpeeds[idx]
          }
          var currentShutterLabel: String {
              let idx = max(0, min(Self.shutterLabels.count - 1, shutterIndex))
              return Self.shutterLabels[idx]
          }
          var isXSyncExceeded: Bool {
              if shutterSyncMode == .highSpeedSync { return false }
              return currentShutterSpeed < (currentSyncPreset.maxSyncSpeed - 0.0002)
          }

          var sceneAmbientEV100: Double {
              let baseEV = log2((apertureF * apertureF) / currentShutterSpeed) - log2(effectiveISO / 100.0)
              return baseEV + ambientDifferenceEV
          }

          // v10.5.0 Schwarzschild Reciprocity Failure Calculator for Night & Slow-Sync Exposures (>= 1.0s)
          var reciprocityCorrectionInfo: (hasFailure: Bool, correctedSeconds: Double, additionalEV: Double, guideText: String) {
              guard currentShutterSpeed >= 1.0 else {
                  return (false, currentShutterSpeed, 0.0, "")
              }
              let t = currentShutterSpeed
              let p: Double
              switch currentStock.brand {
              case .fujifilm:
                  p = currentStock.isSlideFilm ? 1.24 : 1.18 // Provia/Velvia vs Acros/Superia
              case .ilford:
                  p = 1.26 // HP5+ / FP4+ / Delta classic silver-halide slope
              case .kodak:
                  p = currentStock.isSlideFilm ? 1.22 : 1.15 // Portra / Vision3 T-Grain forgiving slope
              case .cinestill:
                  p = 1.16 // Vision3 500T / 800T tungsten core
              case .lomoOther:
                  p = 1.28 // Classic emulsion higher reciprocity curve
              }
              let corrected = pow(t, p)
              let extraSeconds = max(0.0, corrected - t)
              let extraEV = log2(corrected / t)
              let formattedCorrected = corrected >= 10.0 ? String(format: "%.0fs", corrected) : String(format: "%.1fs", corrected)
              let formattedExtra = extraSeconds >= 10.0 ? String(format: "+%.0fs", extraSeconds) : String(format: "+%.1fs", extraSeconds)
              let text = "倒易律补偿：测光 \(currentShutterLabel) → 实曝需 \(formattedCorrected)（\(formattedExtra) / +\(String(format: "%.1f", extraEV)) EV）"
              return (true, corrected, extraEV, text)
          }

          var dofRange: (near: Double, far: Double, totalCM: Double) {
              let coc = filmFormat.circleOfConfusionMM
              let f = filmFormat.standardFocalLengthMM
              let N = apertureF
              let sMM = distanceMeters * 1000.0
              let H = (f * f) / (N * coc) + f
              let nearMM = (sMM * (H - f)) / (H + sMM - 2.0 * f)
              let farMM: Double
              if sMM >= H {
                  farMM = 999000.0
              } else {
                  farMM = (sMM * (H - f)) / (H - sMM)
              }
              let nearM = max(0.1, nearMM / 1000.0)
              let farM = min(999.0, max(nearM, farMM / 1000.0))
              let totalCM = min(999.0, (farM - nearM) * 100.0)
              return (nearM, farM, totalCM)
          }

          var syncStateSignature: String {
              "\(selectedStockID)|\(selectedFlashID)|\(distanceMeters)|\(apertureF)|\(shutterIndex)|\(exposureCompEV)|\(ndFilterStops)|\(modifierLossEV)|\(bellowsExtensionMM)|\(flashPowerLockEnabled)|\(lockedPowerFractionIndex)|\(shutterSyncModeRaw)|\(flashZoomMM)|\(pushPullStops)|\(subtractAmbientInFillMode)|\(ambientDifferenceEV)"
          }

