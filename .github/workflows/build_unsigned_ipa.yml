    enum FilmBrandCategory: String, CaseIterable, Identifiable {
    case kodak = "kodak"; case fujifilm = "fujifilm"; case cinestill = "cinestill"; case ilford = "ilford"; case lomoOther = "lomo"; case customISO = "custom"
    var id: String { rawValue }
    func title(for lang: AppLanguage) -> String { switch self {
    case .kodak: return lang == .en ? "Kodak" : "Kodak 柯达"; case .fujifilm: return lang == .en ? "Fujifilm" : "Fujifilm 富士"
    case .cinestill: return "CineStill"; case .ilford: return lang == .en ? "Ilford B&W" : "Ilford 伊尔福"
    case .lomoOther: return lang == .en ? "Lomo / Harman" : "Lomo / 哈曼"; case .customISO: return lang == .en ? "Custom ISO" : "手动 ISO" }}
    var meshColors: (Color, Color) { switch self {
    case .kodak: return (Color(red: 0.96, green: 0.68, blue: 0.16), Color(red: 0.85, green: 0.28, blue: 0.14))
    case .fujifilm: return (Color(red: 0.12, green: 0.78, blue: 0.48), Color(red: 0.14, green: 0.52, blue: 0.68))
    case .cinestill: return (Color(red: 0.95, green: 0.24, blue: 0.28), Color(red: 0.16, green: 0.72, blue: 0.88))
    case .ilford: return (Color(white: 0.72), Color(red: 0.45, green: 0.50, blue: 0.58))
    case .lomoOther: return (Color(red: 0.82, green: 0.28, blue: 0.88), Color(red: 0.96, green: 0.55, blue: 0.22))
    case .customISO: return (Color(red: 0.90, green: 0.68, blue: 0.32), Color(red: 0.48, green: 0.35, blue: 0.20)) }}
    var badgeLabel: String { switch self { case .kodak: return "KODAK"; case .fujifilm: return "FUJI"; case .cinestill: return "800T"; case .ilford: return "ILFORD"; case .lomoOther: return "LOMO"; case .customISO: return "ISO" }}
    var badgeBg: Color { switch self {
    case .kodak: return Color(red: 0.98, green: 0.74, blue: 0.12); case .fujifilm: return Color(red: 0.08, green: 0.68, blue: 0.38)
    case .cinestill: return Color(red: 0.88, green: 0.20, blue: 0.24); case .ilford: return Color(white: 0.22)
    case .lomoOther: return Color(red: 0.74, green: 0.24, blue: 0.82); case .customISO: return Color(white: 0.28) }}
    var badgeFg: Color { self == .kodak ? Color.black : Color.white }
    static func detect(from name: String) -> FilmBrandCategory {
    let low = name.lowercased()
    if low.contains("kodak") || low.contains("portra") || low.contains("gold") || low.contains("ektar") || low.contains("tri-x") || low.contains("tmax") || low.contains("ultramax") { return .kodak }
    if low.contains("fuji") || low.contains("superia") || low.contains("velvia") || low.contains("provia") || low.contains("acros") || low.contains("c200") { return .fujifilm }
    if low.contains("cinestill") || low.contains("800t") || low.contains("400d") || low.contains("50d") { return .cinestill }
    if low.contains("ilford") || low.contains("hp5") || low.contains("delta") || low.contains("fp4") || low.contains("pan") || low.contains("xp2") { return .ilford }
    if low.contains("lomo") || low.contains("harman") || low.contains("phoenix") || low.contains("foma") { return .lomoOther }
    return .customISO }}
