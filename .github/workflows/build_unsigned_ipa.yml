    - name: Generate LumiFilmApp.swift (Part 1/15)
      run: |
        cat << 'EOF' > LumiFilmBuild/LumiFilm/LumiFilmApp.swift
        import SwiftUI
        import UIKit
        import AVFoundation
        import AudioToolbox
        import WidgetKit
        import AppIntents
        import CoreLocation
        import Darwin

        // MARK: - Local Loopback & Shared Store Bridge for Sideloadly Free Apple ID Widget Sync
        final class LocalLoopbackSyncBridge {
            static let shared = LocalLoopbackSyncBridge()
            private let suiteName = "group.com.lumifilm.flashmeter"
            private let pbName = "com.lumifilm.shared.pb.v93"
            private let udpPort: UInt16 = 49188
            private var serverRunning = false
            private let queue = DispatchQueue(label: "com.lumifilm.udp.server", qos: .utility)
            private var latestDict: [String: Double] = [:]

            func publishState(_ payload: [String: Any]) {
                let dist = (payload["distanceMeters"] as? Double) ?? 2.0
                let ap = (payload["apertureF"] as? Double) ?? 5.6
                let shIdx = (payload["shutterIndex"] as? Int) ?? 14
                let shutterMap: [Int] = [-15, -8, -4, -2, 1, 2, 4, 8, 15, 30, 50, 60, 90, 100, 125, 160, 200, 250, 500, 1000]
                let shVal = Double(shutterMap[max(0, min(shutterMap.count - 1, shIdx))])
                let evComp = (payload["exposureCompEV"] as? Double) ?? 0.0
                let ndStops = Double((payload["ndFilterStops"] as? Int) ?? 0)
                let modLoss = (payload["modifierLossEV"] as? Double) ?? 0.0
                let dict: [String: Double] = [
                    "lf_distance": dist,
                    "lf_aperture": ap,
                    "lf_shutter": shVal,
                    "lf_exp_comp_ev": evComp,
                    "lf_aux_loss": ndStops + modLoss,
                    "lf_iso": 400.0,
                    "lf_gn": 28.0,
                    "lf_sync_speed": 125.0,
                    "lf_theme": 2.0,
                    "lf_sync_ts": Date().timeIntervalSince1970
                ]
                latestDict = dict
                if let data = try? JSONEncoder().encode(dict) {
                    UserDefaults.standard.set(data, forKey: "lumifilm_v93_local")
                    UserDefaults(suiteName: suiteName)?.set(data, forKey: "lumifilm_v93_dict")
                    if let pb = UIPasteboard(name: UIPasteboard.Name(pbName), create: true) {
                        pb.setData(data, forPasteboardType: "public.json")
                    }
                }
                startServerIfNeeded()
            }

            func startServerIfNeeded() {
                guard !serverRunning else { return }
                serverRunning = true
                queue.async { [weak self] in
                    guard let self = self else { return }
                    let fd = socket(AF_INET, SOCK_DGRAM, 0)
                    guard fd >= 0 else {
                        self.serverRunning = false
                        return
                    }
                    var reuse: Int32 = 1
                    setsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &reuse, socklen_t(MemoryLayout<Int32>.size))
                    var addr = sockaddr_in()
                    addr.sin_len = UInt8(MemoryLayout<sockaddr_in>.size)
                    addr.sin_family = sa_family_t(AF_INET)
                    addr.sin_port = in_port_t(self.udpPort).bigEndian
                    addr.sin_addr.s_addr = inet_addr("127.0.0.1")
                    let bindRes = withUnsafePointer(to: &addr) { aPtr in
                        aPtr.withMemoryRebound(to: sockaddr.self, capacity: 1) { sa in
                            bind(fd, sa, socklen_t(MemoryLayout<sockaddr_in>.size))
                        }
                    }
                    guard bindRes == 0 else {
                        close(fd)
                        self.serverRunning = false
                        return
                    }
                    var buf = [UInt8](repeating: 0, count: 2048)
                    while true {
                        var cliAddr = sockaddr_in()
                        var cliLen = socklen_t(MemoryLayout<sockaddr_in>.size)
                        let n = withUnsafeMutablePointer(to: &cliAddr) { aPtr in
                            aPtr.withMemoryRebound(to: sockaddr.self, capacity: 1) { sa in
                                recvfrom(fd, &buf, buf.count, 0, sa, &cliLen)
                            }
                        }
                        if n > 0, let reply = try? JSONEncoder().encode(self.latestDict) {
                            reply.withUnsafeBytes { ptr in
                                _ = withUnsafePointer(to: &cliAddr) { aPtr in
                                    aPtr.withMemoryRebound(to: sockaddr.self, capacity: 1) { sa in
                                        sendto(fd, ptr.baseAddress, ptr.count, 0, sa, cliLen)
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        // MARK: - Street-Level Chinese GPS Reverse Geocoder
        final class LocationAddressResolver: NSObject, ObservableObject, CLLocationManagerDelegate {
            private let manager = CLLocationManager()
            private let geocoder = CLGeocoder()
            private var completionHandler: ((String, Double?, Double?) -> Void)?

            override init() {
                super.init()
                manager.delegate = self
                manager.desiredAccuracy = kCLLocationAccuracyNearestTenMeters
            }

            func requestCurrentAddress(completion: @escaping (String, Double?, Double?) -> Void) {
                self.completionHandler = completion
                let status = manager.authorizationStatus
                if status == .notDetermined {
                    manager.requestWhenInUseAuthorization()
                } else if status == .authorizedWhenInUse || status == .authorizedAlways {
                    manager.requestLocation()
                } else {
                    completion("未开启定位权限", nil, nil)
                    self.completionHandler = nil
                }
            }

            func locationManagerDidChangeAuthorization(_ manager: CLLocationManager) {
                let status = manager.authorizationStatus
                if completionHandler != nil && (status == .authorizedWhenInUse || status == .authorizedAlways) {
                    manager.requestLocation()
                }
            }

            func locationManager(_ manager: CLLocationManager, didUpdateLocations locations: [CLLocation]) {
                guard let loc = locations.last else {
                    completionHandler?("定位未知", nil, nil)
                    completionHandler = nil
                    return
                }
                let lat = loc.coordinate.latitude
                let lon = loc.coordinate.longitude
                geocoder.reverseGeocodeLocation(loc, preferredLocale: Locale(identifier: "zh_CN")) { [weak self] marks, _ in
                    DispatchQueue.main.async {
                        if let pm = marks?.first {
                            let parts = [pm.locality, pm.subLocality, pm.thoroughfare, pm.subThoroughfare, pm.name].compactMap { $0 }
                            var unique: [String] = []
                            for p in parts where !unique.contains(p) {
                                unique.append(p)
                            }
                            let addr = unique.prefix(3).joined(separator: " ")
                            self?.completionHandler?(addr.isEmpty ? String(format: "%.4f, %.4f", lat, lon) : addr, lat, lon)
                        } else {
                            self?.completionHandler?(String(format: "%.4f, %.4f", lat, lon), lat, lon)
                        }
                        self?.completionHandler = nil
                    }
                }
            }

            func locationManager(_ manager: CLLocationManager, didFailWithError error: Error) {
                DispatchQueue.main.async {
                    self.completionHandler?("室内/无GPS信号", nil, nil)
                    self.completionHandler = nil
                }
            }
        }

