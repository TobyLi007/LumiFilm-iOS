name: Build LumiFilm v6.0 Native iOS IPA (Single Speak + Lens Limit + 0.5m Magnet + Multi-Lock + Apple Music Glass Tabs)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository (Node 24 Ready)
        uses: actions/checkout@v5

      - name: Generate Project, Glassmorphic App Icon & SwiftUI Sources
        run: |
          mkdir -p LumiFilmBuild/LumiFilm/Assets.xcassets/AppIcon.appiconset LumiFilmBuild/LumiFilmWidget
          cd LumiFilmBuild

          # 1. Generate 1024x1024 Glassmorphic Film Flash App Icon via CoreGraphics Swift script
          cat << 'ICONEOF' > make_icon.swift
          import Cocoa
          import Darwin

          let size = CGSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()
          guard let ctx = NSGraphicsContext.current?.cgContext else { exit(1) }

          let colorSpace = CGColorSpaceCreateDeviceRGB()

          let bgColors = [
              CGColor(red: 0.16, green: 0.11, blue: 0.08, alpha: 1.0),
              CGColor(red: 0.36, green: 0.21, blue: 0.12, alpha: 1.0),
              CGColor(red: 0.09, green: 0.07, blue: 0.06, alpha: 1.0)
          ] as CFArray
          let bgGrad = CGGradient(colorsSpace: colorSpace, colors: bgColors, locations: [0.0, 0.55, 1.0])!
          ctx.drawLinearGradient(bgGrad, start: CGPoint(x: 0, y: 1024), end: CGPoint(x: 1024, y: 0), options: [])

          let glowColors = [
              CGColor(red: 0.96, green: 0.55, blue: 0.24, alpha: 0.65),
              CGColor(red: 0.85, green: 0.22, blue: 0.38, alpha: 0.25),
              CGColor(red: 0.0, green: 0.0, blue: 0.0, alpha: 0.0)
          ] as CFArray
          let glowGrad = CGGradient(colorsSpace: colorSpace, colors: glowColors, locations: [0.0, 0.5, 1.0])!
          ctx.drawRadialGradient(glowGrad, startCenter: CGPoint(x: 460, y: 520), startRadius: 20, endCenter: CGPoint(x: 512, y: 512), endRadius: 460, options: [])

          ctx.saveGState()
          ctx.translateBy(x: 512, y: 512)
          ctx.rotate(by: -.pi / 4.2)
          let filmRect = CGRect(x: -600, y: -110, width: 1200, height: 220)
          ctx.setFillColor(CGColor(red: 0.08, green: 0.07, blue: 0.06, alpha: 0.78))
          ctx.fill(filmRect)
          ctx.setFillColor(CGColor(red: 0.92, green: 0.78, blue: 0.58, alpha: 0.55))
          for x in stride(from: -540, to: 540, by: 64) {
              ctx.fill(CGRect(x: CGFloat(x), y: 74, width: 34, height: 22))
              ctx.fill(CGRect(x: CGFloat(x), y: -96, width: 34, height: 22))
          }
          ctx.restoreGState()

          let center = CGPoint(x: 512, y: 512)
          ctx.saveGState()
          ctx.addArc(center: center, radius: 330, startAngle: 0, endAngle: .pi * 2, clockwise: false)
          ctx.setFillColor(CGColor(red: 0.78, green: 0.58, blue: 0.32, alpha: 0.95))
          ctx.fillPath()

          ctx.addArc(center: center, radius: 296, startAngle: 0, endAngle: .pi * 2, clockwise: false)
          ctx.setFillColor(CGColor(red: 0.14, green: 0.13, blue: 0.12, alpha: 0.96))
          ctx.fillPath()

          for i in 0..<36 {
              let angleVal = Double(i) * (Double.pi * 2.0 / 36.0)
              let r1: Double = (i % 3 == 0) ? 250.0 : 268.0
              let r2: Double = 288.0
              let cosA = Darwin.cos(angleVal)
              let sinA = Darwin.sin(angleVal)
              let p1 = CGPoint(x: Double(center.x) + cosA * r1, y: Double(center.y) + sinA * r1)
              let p2 = CGPoint(x: Double(center.x) + cosA * r2, y: Double(center.y) + sinA * r2)
              ctx.setStrokeColor(i == 9 ? CGColor(red: 0.95, green: 0.45, blue: 0.25, alpha: 1.0) : CGColor(red: 0.94, green: 0.88, blue: 0.76, alpha: 0.8))
              ctx.setLineWidth(i % 3 == 0 ? 7 : 3.5)
              ctx.move(to: p1)
              ctx.addLine(to: p2)
              ctx.strokePath()
          }
          ctx.restoreGState()

          let glassRect = CGRect(x: 262, y: 262, width: 500, height: 500)
          let glassPath = CGPath(roundedRect: glassRect, cornerWidth: 160, cornerHeight: 160, transform: nil)
          ctx.saveGState()
          ctx.addPath(glassPath)
          ctx.setFillColor(CGColor(red: 1.0, green: 0.96, blue: 0.90, alpha: 0.22))
          ctx.fillPath()
          ctx.addPath(glassPath)
          ctx.setStrokeColor(CGColor(red: 1.0, green: 0.92, blue: 0.78, alpha: 0.65))
          ctx.setLineWidth(8)
          ctx.strokePath()
          ctx.restoreGState()

          let bolt = CGMutablePath()
          bolt.move(to: CGPoint(x: 548, y: 700))
          bolt.addLine(to: CGPoint(x: 382, y: 500))
          bolt.addLine(to: CGPoint(x: 498, y: 500))
          bolt.addLine(to: CGPoint(x: 462, y: 324))
          bolt.addLine(to: CGPoint(x: 642, y: 532))
          bolt.addLine(to: CGPoint(x: 522, y: 532))
          bolt.closeSubpath()

          ctx.saveGState()
          ctx.setShadow(offset: CGSize(width: 0, height: 8), blur: 28, color: CGColor(red: 1.0, green: 0.65, blue: 0.25, alpha: 0.95))
          ctx.addPath(bolt)
          ctx.setFillColor(CGColor(red: 1.0, green: 0.97, blue: 0.88, alpha: 1.0))
          ctx.fillPath()
          ctx.restoreGState()

          image.unlockFocus()

          if let tiff = image.tiffRepresentation,
             let rep = NSBitmapImageRep(data: tiff),
             let png = rep.representation(using: .png, properties: [:]) {
              try! png.write(to: URL(fileURLWithPath: "LumiFilm/Assets.xcassets/AppIcon.appiconset/AppIcon.png"))
          }
          ICONEOF

          swift make_icon.swift

          cat << 'JSONEOF' > LumiFilm/Assets.xcassets/Contents.json
          {
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSONEOF

          cat << 'JSONEOF' > LumiFilm/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSONEOF

          # 2. Generate XcodeGen project.yml (iOS 17.0 deploymentTarget)
          cat << 'EOF' > project.yml
          name: LumiFilm
          options:
            bundleIdPrefix: com.lumifilm.exposure
            deploymentTarget:
              iOS: "17.0"
            xcodeVersion: "16.0"
            generateEmptyDirectories: true

          targets:
            LumiFilm:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: LumiFilm
              info:
                path: LumiFilm/Info.plist
                properties:
                  CFBundleDisplayName: LumiFilm
                  CFBundleShortVersionString: "6.0.0"
                  CFBundleVersion: "60"
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  NSMicrophoneUsageDescription: "LumiFilm 需要麦克风权限来识别您说出的拍摄距离、光圈与场景，立即播报推荐的闪光灯输出功率。"
                  NSSpeechRecognitionUsageDescription: "LumiFilm 需要语音识别权限以将您的抓拍语音转换为闪光灯曝光参数。"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.lumifilm.exposure.app
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  MARKETING_VERSION: "6.0.0"
                  CURRENT_PROJECT_VERSION: "60"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
              dependencies:
                - target: LumiFilmWidget
                  embed: true

            LumiFilmWidget:
              type: app-extension
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: LumiFilmWidget
              info:
                path: LumiFilmWidget/Info.plist
                properties:
                  CFBundleDisplayName: LumiFilm Widget
                  CFBundleShortVersionString: "6.0.0"
                  CFBundleVersion: "60"
                  NSExtension:
                    NSExtensionPointIdentifier: com.apple.widgetkit-extension
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.lumifilm.exposure.app.widget
                  MARKETING_VERSION: "6.0.0"
                  CURRENT_PROJECT_VERSION: "60"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          # 3. Generate LumiFilmApp.swift
          cat << 'EOF' > LumiFilm/LumiFilmApp.swift
          import SwiftUI
          import AppIntents
          import WidgetKit
          import AVFoundation
          import AudioToolbox

          @main
          struct LumiFilmApp: App {
              init() {
                  LumiFilmShortcutsProvider.updateAppShortcutParameters()
              }
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }

          struct FlashModelSpec: Identifiable, Hashable {
              let id: String
              let nameZh: String
              let nameEn: String
              let nameJa: String
              let shortName: String
              let baseGN: Double
              let ratedZoom: Int
              let minPowerDenom: Int
              let recycleSec: Double
          }

          enum LumiTheme: Int, CaseIterable, Identifiable {
              case instagram = 0   // Instagram Sunset Glass
              case threads = 1     // Threads Monochrome Frosted Glass
              case brass = 2       // Vintage Brass Patina (纯色胶片露铜质感)

              var id: Int { rawValue }

              func title(lang: String) -> String {
                  switch self {
                  case .instagram:
                      return lang == "en" ? "Instagram Sunset" : (lang == "ja" ? "IG サンセット" : "Ins 落日流光")
                  case .threads:
                      return lang == "en" ? "Threads Mono" : (lang == "ja" ? "Threads モノクロ" : "Threads 极简毛玻璃")
                  case .brass:
                      return lang == "en" ? "Leica Brass Patina" : (lang == "ja" ? "真鍮フィルム露銅" : "胶片黑漆露铜")
                  }
              }

              var backgroundGradient: LinearGradient {
                  switch self {
                  case .instagram:
                      return LinearGradient(
                          colors: [
                              Color(red: 0.16, green: 0.08, blue: 0.24),
                              Color(red: 0.38, green: 0.12, blue: 0.26),
                              Color(red: 0.48, green: 0.24, blue: 0.14)
                          ],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                  case .threads:
                      return LinearGradient(
                          colors: [
                              Color(red: 0.06, green: 0.06, blue: 0.07),
                              Color(red: 0.13, green: 0.13, blue: 0.15),
                              Color(red: 0.08, green: 0.08, blue: 0.09)
                          ],
                          startPoint: .top,
                          endPoint: .bottom
                      )
                  case .brass:
                      return LinearGradient(
                          colors: [
                              Color(red: 0.11, green: 0.10, blue: 0.08),
                              Color(red: 0.20, green: 0.16, blue: 0.11),
                              Color(red: 0.13, green: 0.11, blue: 0.09)
                          ],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                  }
              }

              var accentColor: Color {
                  switch self {
                  case .instagram:
                      return Color(red: 1.0, green: 0.48, blue: 0.35)
                  case .threads:
                      return Color(red: 0.94, green: 0.94, blue: 0.96)
                  case .brass:
                      return Color(red: 0.85, green: 0.65, blue: 0.34)
                  }
              }

              var secondaryAccent: Color {
                  switch self {
                  case .instagram:
                      return Color(red: 0.92, green: 0.30, blue: 0.58)
                  case .threads:
                      return Color(red: 0.65, green: 0.68, blue: 0.74)
                  case .brass:
                      return Color(red: 0.72, green: 0.48, blue: 0.24)
                  }
              }
          }

          // Feature 1: Single-utterance Speech Synthesizer with Tap-Again-to-Cancel
          final class SpeechManager: NSObject, ObservableObject, AVSpeechSynthesizerDelegate {
              static let shared = SpeechManager()
              private let synthesizer = AVSpeechSynthesizer()
              @Published var isSpeaking: Bool = false

              override init() {
                  super.init()
                  synthesizer.delegate = self
              }

              func toggleSpeak(text: String, lang: String) {
                  if synthesizer.isSpeaking || isSpeaking {
                      synthesizer.stopSpeaking(at: .immediate)
                      DispatchQueue.main.async {
                          self.isSpeaking = false
                      }
                      return
                  }

                  do {
                      let session = AVAudioSession.sharedInstance()
                      try session.setCategory(.playback, mode: .spokenAudio, options: [.duckOthers])
                      try session.setActive(true, options: .notifyOthersOnDeactivation)
                  } catch {
                      // Continue even if audio session category fails
                  }

                  let utterance = AVSpeechUtterance(string: text)
                  let voiceCode = lang == "en" ? "en-US" : (lang == "ja" ? "ja-JP" : "zh-CN")
                  utterance.voice = AVSpeechSynthesisVoice(language: voiceCode)
                  utterance.rate = 0.51
                  utterance.pitchMultiplier = 1.0

                  DispatchQueue.main.async {
                      self.isSpeaking = true
                  }
                  synthesizer.speak(utterance)
              }

              func stopImmediately() {
                  if synthesizer.isSpeaking || isSpeaking {
                      synthesizer.stopSpeaking(at: .immediate)
                      DispatchQueue.main.async {
                          self.isSpeaking = false
                      }
                  }
              }

              func speechSynthesizer(_ synthesizer: AVSpeechSynthesizer, didFinish utterance: AVSpeechUtterance) {
                  DispatchQueue.main.async {
                      self.isSpeaking = false
                  }
              }

              func speechSynthesizer(_ synthesizer: AVSpeechSynthesizer, didCancel utterance: AVSpeechUtterance) {
                  DispatchQueue.main.async {
                      self.isSpeaking = false
                  }
              }
          }

          final class FeedbackEngine {
              static let shared = FeedbackEngine()
              private let selectionGen = UISelectionFeedbackGenerator()
              private let impactLight = UIImpactFeedbackGenerator(style: .light)
              private let impactMedium = UIImpactFeedbackGenerator(style: .medium)
              private let impactRigid = UIImpactFeedbackGenerator(style: .rigid)

              func prepare() {
                  selectionGen.prepare()
                  impactLight.prepare()
                  impactRigid.prepare()
              }

              func dialTick(soundOn: Bool, hapticsOn: Bool) {
                  if hapticsOn {
                      impactLight.impactOccurred(intensity: 0.85)
                  }
                  if soundOn {
                      AudioServicesPlaySystemSound(1157)
                  }
              }

              // Feature 3: Distinct magnetic detent click at 0.5m snap intervals
              func magnetSnapTick(soundOn: Bool, hapticsOn: Bool) {
                  if hapticsOn {
                      impactRigid.impactOccurred(intensity: 1.0)
                  }
                  if soundOn {
                      AudioServicesPlaySystemSound(1157)
                  }
              }

              func buttonTap(soundOn: Bool, hapticsOn: Bool) {
                  if hapticsOn {
                      impactMedium.impactOccurred()
                  }
                  if soundOn {
                      AudioServicesPlaySystemSound(1104)
                  }
              }
          }

          enum DialChannel: String, CaseIterable {
              case distance = "DIST"
              case power = "POWER"
              case aperture = "F-STOP"
              case shutter = "SHUTTER"
          }

          struct ExposureDiagnostic {
              let powerText: String
              let evDelta: Double
              let isUnderexposed: Bool
              let isOverexposed: Bool
              let warningTitle: String
              let warningAdvice: String
              let quickFixLabel: String
              let suggestedPowerStops: Double
              let suggestedDistanceM: Double
              let suggestedAperture: Double
          }

          final class ExposureStore: ObservableObject {
              static let shared = ExposureStore()

              @AppStorage("lf_has_onboarded_v6") var hasCompletedOnboarding: Bool = false
              @AppStorage("lf_theme_id") var themeRaw: Int = 2
              @AppStorage("lf_lang") var lang: String = "zh"
              @AppStorage("lf_sound_on") var soundOn: Bool = true
              @AppStorage("lf_haptics_on") var hapticsOn: Bool = true

              @AppStorage("lf_flash_id") var flashId: String = "godox-v350"
              @AppStorage("lf_is_custom_gn") var isCustomGN: Bool = false
              @AppStorage("lf_custom_gn_val") var customGNVal: Double = 36.0
              @AppStorage("lf_film_name") var filmName: String = "Kodak Portra 400"
              @AppStorage("lf_iso") var iso: Int = 400
              @AppStorage("lf_zoom_mm") var zoomMM: Int = 50
              @AppStorage("lf_max_sync") var maxSyncDenom: Int = 125

              // Feature 2: Lens Maximum Aperture Limit set during initial onboarding
              @AppStorage("lf_lens_max_aperture") var lensMaxAperture: Double = 2.0

              // Feature 3: Magnetic 0.5m Snap on Distance Dial
              @AppStorage("lf_magnet_05m") var isDistanceMagnetOn: Bool = true

              // Feature 4 & 5: Individual Parameter Lock States
              @AppStorage("lf_lock_power") var isPowerLocked: Bool = false
              @AppStorage("lf_lock_aperture") var isApertureLocked: Bool = false
              @AppStorage("lf_lock_distance") var isDistanceLocked: Bool = false
              @AppStorage("lf_lock_shutter") var isShutterLocked: Bool = false

              @AppStorage("lf_distance_m") var distanceM: Double = 2.0
              @AppStorage("lf_aperture") var aperture: Double = 4.0
              @AppStorage("lf_power_stops") var powerStopOffset: Double = -2.0
              @AppStorage("lf_shutter_denom") var shutterDenom: Int = 125
              @AppStorage("lf_ambient_ev") var ambientSceneEV: Double = 7.0
              @AppStorage("lf_mod_loss") var modifierLossEV: Double = 0.0
              @AppStorage("lf_bounce_loss") var bounceLossEV: Double = 0.0

              let allApertureSteps: [Double] = [1.2, 1.4, 1.8, 2.0, 2.4, 2.8, 3.5, 4.0, 4.8, 5.6, 6.7, 8.0, 9.5, 11.0, 13.0, 16.0, 22.0]
              let lensMaxApertureChoices: [Double] = [1.2, 1.4, 1.8, 2.0, 2.8, 3.5, 4.0, 5.6]
              let shutterSteps: [Int] = [15, 30, 60, 125, 250, 500, 1000, 2000, 4000]

              let catalog: [FlashModelSpec] = [
                  FlashModelSpec(id: "godox-v350", nameZh: "神牛 Godox V350 (主力推荐)", nameEn: "Godox V350 (Primary)", nameJa: "Godox V350 (推奨)", shortName: "Godox V350", baseGN: 36, ratedZoom: 105, minPowerDenom: 128, recycleSec: 1.7),
                  FlashModelSpec(id: "godox-tt350", nameZh: "神牛 Godox TT350 (AA版)", nameEn: "Godox TT350", nameJa: "Godox TT350", shortName: "Godox TT350", baseGN: 36, ratedZoom: 105, minPowerDenom: 128, recycleSec: 2.2),
                  FlashModelSpec(id: "godox-lux-jr", nameZh: "神牛 Godox Lux Junior", nameEn: "Godox Lux Junior", nameJa: "Godox Lux Junior", shortName: "Lux Junior", baseGN: 12, ratedZoom: 28, minPowerDenom: 64, recycleSec: 3.0),
                  FlashModelSpec(id: "godox-v1pro", nameZh: "神牛 Godox V1Pro", nameEn: "Godox V1Pro", nameJa: "Godox V1Pro", shortName: "Godox V1Pro", baseGN: 42, ratedZoom: 105, minPowerDenom: 256, recycleSec: 1.3),
                  FlashModelSpec(id: "godox-v860iii", nameZh: "神牛 Godox V860III", nameEn: "Godox V860III", nameJa: "Godox V860III", shortName: "Godox V860III", baseGN: 60, ratedZoom: 200, minPowerDenom: 256, recycleSec: 1.5),
                  FlashModelSpec(id: "profoto-a10", nameZh: "Profoto A10", nameEn: "Profoto A10", nameJa: "Profoto A10", shortName: "Profoto A10", baseGN: 42, ratedZoom: 105, minPowerDenom: 256, recycleSec: 1.0)
              ]

              var availableApertureSteps: [Double] {
                  let filtered = allApertureSteps.filter { $0 >= lensMaxAperture - 0.05 }
                  return filtered.isEmpty ? [lensMaxAperture, 5.6, 8.0, 11.0, 16.0, 22.0] : filtered
              }

              var currentTheme: LumiTheme {
                  LumiTheme(rawValue: themeRaw) ?? .brass
              }

              var activeFlashSpec: FlashModelSpec {
                  catalog.first(where: { $0.id == flashId }) ?? catalog[0]
              }

              var activeGN: Double {
                  isCustomGN ? customGNVal : activeFlashSpec.baseGN
              }

              var displayFlashTitle: String {
                  if isCustomGN {
                      if lang == "en" { return "User Custom" }
                      if lang == "ja" { return "ユーザーカスタム" }
                      return "用户自定义"
                  }
                  return activeFlashSpec.shortName
              }

              func enforceApertureLimit() {
                  if aperture < lensMaxAperture {
                      aperture = lensMaxAperture
                  }
              }

              func computeFullEffectiveGN(forShutter sDenom: Int) -> Double {
                  let spec = activeFlashSpec
                  let zoomFactor = isCustomGN ? 1.0 : pow(Double(zoomMM) / Double(spec.ratedZoom), 0.38)
                  let gn100 = activeGN * zoomFactor
                  let isoFactor = sqrt(Double(iso) / 100.0)
                  let hssLoss = sDenom > maxSyncDenom ? (2.0 + log2(Double(sDenom) / Double(maxSyncDenom))) : 0.0
                  let totalLoss = modifierLossEV + bounceLossEV + hssLoss
                  let lossFactor = pow(2.0, -totalLoss / 2.0)
                  return max(gn100 * isoFactor * lossFactor, 0.1)
              }

              // Feature 4 & 5: Priority Solver respecting locked parameters (Power, Shutter, Aperture, Distance)
              func solveExposure(changed: DialChannel? = nil) {
                  enforceApertureLimit()
                  let spec = activeFlashSpec
                  let minStops = -log2(Double(spec.minPowerDenom))

                  if isPowerLocked {
                      // 1. Priority 1: Adjust Shutter Speed (if unlocked) to avoid HSS power loss and match ambient scene
                      if !isShutterLocked && changed != .shutter {
                          let targetEV = ambientSceneEV + 1.0 // -1.0 EV background bias
                          let isoStops = log2(Double(iso) / 100.0)
                          let idealDenom = pow(2.0, targetEV + isoStops) / pow(aperture, 2.0)
                          let safeCandidates = shutterSteps.filter { $0 <= maxSyncDenom }
                          let pool = safeCandidates.isEmpty ? shutterSteps : safeCandidates
                          if let bestS = pool.min(by: { abs(log2(Double($0)) - log2(max(idealDenom, 1.0))) < abs(log2(Double($1)) - log2(max(idealDenom, 1.0))) }) {
                              shutterDenom = bestS
                          }
                      }

                      let fullEffGN = computeFullEffectiveGN(forShutter: shutterDenom)
                      let lockedEffGN = fullEffGN * sqrt(pow(2.0, powerStopOffset))

                      // 2. Priority 2: Adjust Aperture (if unlocked and user didn't just manually turn Aperture)
                      if !isApertureLocked && changed != .aperture {
                          let idealF = lockedEffGN / max(distanceM, 0.4)
                          let steps = availableApertureSteps
                          if let bestF = steps.min(by: { abs(log2($0) - log2(max(idealF, 0.7))) < abs(log2($1) - log2(max(idealF, 0.7))) }) {
                              aperture = bestF
                          }
                      }

                      // 3. Priority 3: Adjust Distance (if unlocked and Aperture is locked OR lens max aperture limit was hit when changing power)
                      let remainingNeededF = lockedEffGN / max(distanceM, 0.4)
                      let hitMaxApertureCeiling = remainingNeededF < (lensMaxAperture - 0.15)
                      if !isDistanceLocked && changed != .distance && (isApertureLocked || (hitMaxApertureCeiling && changed == .power)) {
                          let idealDist = lockedEffGN / max(aperture, 1.0)
                          let clampedDist = min(max(idealDist, 0.5), 12.0)
                          if isDistanceMagnetOn {
                              distanceM = (clampedDist * 2.0).rounded() / 2.0
                          } else {
                              distanceM = (clampedDist * 10.0).rounded() / 10.0
                          }
                      }
                  } else {
                      // Flash Power is UNLOCKED -> solve for Flash Power
                      if !isShutterLocked && changed != .shutter {
                          let targetEV = ambientSceneEV + 1.0
                          let isoStops = log2(Double(iso) / 100.0)
                          let idealDenom = pow(2.0, targetEV + isoStops) / pow(aperture, 2.0)
                          let safeCandidates = shutterSteps.filter { $0 <= maxSyncDenom }
                          let pool = safeCandidates.isEmpty ? shutterSteps : safeCandidates
                          if let bestS = pool.min(by: { abs(log2(Double($0)) - log2(max(idealDenom, 1.0))) < abs(log2(Double($1)) - log2(max(idealDenom, 1.0))) }) {
                              shutterDenom = bestS
                          }
                      }

                      let fullEffGN = computeFullEffectiveGN(forShutter: shutterDenom)
                      let reqGN = aperture * distanceM
                      let reqRatio = pow(reqGN / fullEffGN, 2.0)
                      let rawStops = log2(max(reqRatio, 1e-6))
                      let snapped = (rawStops * 3.0).rounded() / 3.0
                      powerStopOffset = min(max(snapped, minStops), 0.0)
                  }
              }

              func evaluateDiagnostic() -> ExposureDiagnostic {
                  let spec = activeFlashSpec
                  let minStops = -log2(Double(spec.minPowerDenom))
                  let fullEffGN = computeFullEffectiveGN(forShutter: shutterDenom)
                  let currentEffGN = fullEffGN * sqrt(pow(2.0, powerStopOffset))
                  let reqGN = aperture * distanceM

                  let evDelta = 2.0 * log2(currentEffGN / max(reqGN, 0.01))
                  let isUnder = evDelta < -0.25
                  let isOver = evDelta > 0.35

                  let neededRatio = pow(reqGN / fullEffGN, 2.0)
                  let neededStopsRaw = log2(max(neededRatio, 1e-6))
                  let suggestedPowerStops = min(max((neededStopsRaw * 3.0).rounded() / 3.0, minStops), 0.0)
                  let suggestedPowerStr = formatPower(suggestedPowerStops, minDenom: spec.minPowerDenom)

                  let suggestedDist = min(max(currentEffGN / max(aperture, 1.0), 0.5), 12.0)
                  let snappedSugDist = isDistanceMagnetOn ? ((suggestedDist * 2.0).rounded() / 2.0) : ((suggestedDist * 10.0).rounded() / 10.0)

                  let idealF = currentEffGN / max(distanceM, 0.4)
                  let suggestedF = availableApertureSteps.min(by: { abs(log2($0) - log2(max(idealF, 0.7))) < abs(log2($1) - log2(max(idealF, 0.7))) }) ?? lensMaxAperture

                  let currentPowerText = formatPower(powerStopOffset, minDenom: spec.minPowerDenom)
                  let maxApStr = String(format: "f/%.1f", lensMaxAperture).replacingOccurrences(of: ".0", with: "")

                  var warnTitle = ""
                  var warnAdvice = ""
                  var fixLabel = ""

                  if isUnder {
                      let deficitStr = String(format: "%.1f", abs(evDelta))
                      if neededStopsRaw <= 0.15 {
                          if lang == "en" {
                              warnTitle = "⚠️ Insufficient Flash Power (-\(deficitStr) EV)"
                              warnAdvice = "Suggestion: Unlock & increase flash power to \(suggestedPowerStr), or move closer to \(String(format: "%.1f", snappedSugDist))m (Lens limit: \(maxApStr))."
                              fixLabel = "⚡ Boost to \(suggestedPowerStr)"
                          } else if lang == "ja" {
                              warnTitle = "⚠️ フラッシュ光量不足 (-\(deficitStr) EV)"
                              warnAdvice = "提案：フラッシュ出力を \(suggestedPowerStr) に上げるか、\(String(format: "%.1f", snappedSugDist))m に近づいてください（開放制限 \(maxApStr)）。"
                              fixLabel = "⚡ 出力を \(suggestedPowerStr) へ"
                          } else {
                              warnTitle = "⚠️ 当前闪光灯功率不足 (欠曝 -\(deficitStr) EV)"
                              warnAdvice = "修改建议：① 增加闪光灯功率至 \(suggestedPowerStr)，或 ② 走近至 \(String(format: "%.1f", snappedSugDist))m / 解锁参数（受镜头最大光圈 \(maxApStr) 限制）。"
                              fixLabel = "⚡ 增至 \(suggestedPowerStr)"
                          }
                      } else {
                          if lang == "en" {
                              warnTitle = "⚠️ Max 1/1 Power Still Underexposed (-\(deficitStr) EV)"
                              warnAdvice = "Suggestion: Increase flash power/GN, raise ISO, or move closer to \(String(format: "%.1f", snappedSugDist))m (Lens max \(maxApStr))."
                              fixLabel = "⚡ Auto Balance"
                          } else if lang == "ja" {
                              warnTitle = "⚠️ 1/1 フル発光でも光量不足 (-\(deficitStr) EV)"
                              warnAdvice = "提案：フラッシュ出力/GNを上げるか、距離を \(String(format: "%.1f", snappedSugDist))m に近づけてください。"
                              fixLabel = "⚡ 自動補正"
                          } else {
                              warnTitle = "⚠️ 闪光灯功率不足 (欠曝 -\(deficitStr) EV)"
                              warnAdvice = "修改建议：请增加闪光灯功率至 1/1 全光（或提高 ISO / 换更高 GN 闪光灯），或将距离拉近至 \(String(format: "%.1f", snappedSugDist))m。"
                              fixLabel = "⚡ 提至1/1并配平"
                          }
                      }
                  } else if isOver {
                      let overStr = String(format: "%.1f", evDelta)
                      if lang == "en" {
                          warnTitle = "⚠️ Flash Output Too Strong (+\(overStr) EV)"
                          warnAdvice = "Suggestion: Lower flash power to \(suggestedPowerStr) or stop down aperture to f/\(String(format: "%.1f", suggestedF))."
                          fixLabel = "⚡ Set \(suggestedPowerStr)"
                      } else if lang == "ja" {
                          warnTitle = "⚠️ フラッシュ光量過多 (+\(overStr) EV)"
                          warnAdvice = "提案：フラッシュ出力を \(suggestedPowerStr) に下げるか、絞りを f/\(String(format: "%.1f", suggestedF)) に絞ってください。"
                          fixLabel = "⚡ \(suggestedPowerStr) に下げる"
                      } else {
                          warnTitle = "⚠️ 当前闪光输出过强 (过曝 +\(overStr) EV)"
                          warnAdvice = "修改建议：调低闪光灯功率至 \(suggestedPowerStr)，或收小光圈至 f/\(String(format: "%.1f", suggestedF))。"
                          fixLabel = "⚡ 降至 \(suggestedPowerStr)"
                      }
                  }

                  return ExposureDiagnostic(
                      powerText: currentPowerText,
                      evDelta: evDelta,
                      isUnderexposed: isUnder,
                      isOverexposed: isOver,
                      warningTitle: warnTitle,
                      warningAdvice: warnAdvice,
                      quickFixLabel: fixLabel,
                      suggestedPowerStops: suggestedPowerStops,
                      suggestedDistanceM: snappedSugDist,
                      suggestedAperture: suggestedF
                  )
              }

              func applyQuickFix(_ diag: ExposureDiagnostic) {
                  let spec = activeFlashSpec
                  let fullEffGN = computeFullEffectiveGN(forShutter: shutterDenom)
                  let reqGN = aperture * distanceM
                  let neededStopsRaw = log2(max(pow(reqGN / fullEffGN, 2.0), 1e-6))

                  if neededStopsRaw <= 0.15 {
                      // Increase or decrease flash power directly to match
                      powerStopOffset = diag.suggestedPowerStops
                  } else {
                      // Boost power to 1/1 full and bring aperture/distance into range
                      powerStopOffset = 0.0
                      if !isApertureLocked {
                          aperture = lensMaxAperture
                      }
                      let newReqF = fullEffGN / max(distanceM, 0.4)
                      if newReqF < aperture {
                          distanceM = diag.suggestedDistanceM
                      }
                  }
                  WidgetCenter.shared.reloadAllTimelines()
              }

              func formatPower(_ stopOffset: Double, minDenom: Int) -> String {
                  let minStops = -log2(Double(minDenom))
                  let clamped = min(max(stopOffset, minStops), 0.0)
                  let roundedThirds = (clamped * 3.0).rounded() / 3.0
                  let whole = floor(roundedThirds + 1e-6)
                  let rem = roundedThirds - whole
                  let denom = Int(pow(2.0, -whole).rounded())
                  let base = "1/\(denom)"
                  if rem > 0.5 { return "\(base) +0.7" }
                  if rem > 0.16 { return "\(base) +0.3" }
                  return base
              }
          }

          struct CalculateFlashPowerIntent: AppIntent {
              static var title: LocalizedStringResource = "计算闪光灯输出功率 (LumiFilm)"
              static var description = IntentDescription("输入拍摄距离与光圈，立即计算并语音播报闪光灯手动输出功率比。")
              static var openAppWhenRun: Bool = false

              @Parameter(title: "拍摄距离 (米 / Meters)", default: 2.0)
              var distanceMeters: Double

              @Parameter(title: "光圈大小 (f-stop)", default: 4.0)
              var apertureFStop: Double

              func perform() async throws -> some IntentResult & ProvidesDialog & ShowsSnippetView {
                  let store = ExposureStore.shared
                  store.distanceM = distanceMeters
                  store.aperture = max(apertureFStop, store.lensMaxAperture)
                  store.solveExposure(changed: .distance)
                  let diag = store.evaluateDiagnostic()
                  WidgetCenter.shared.reloadAllTimelines()

                  let dialogText = "距离 \(String(format: "%.1f", store.distanceM)) 米，光圈 f/\(String(format: "%.1f", store.aperture))，请将【\(store.displayFlashTitle)】调至 \(diag.powerText) 功率。"
                  return .result(dialog: IntentDialog(stringLiteral: dialogText)) {
                      VStack(alignment: .leading, spacing: 6) {
                          Text("⚡ LumiFilm · \(store.displayFlashTitle) (GN\(Int(store.activeGN)))")
                              .font(.caption)
                              .foregroundStyle(.secondary)
                          Text("推荐闪光功率：\(diag.powerText)")
                              .font(.title3.bold())
                          Text("距离 \(String(format: "%.1f", store.distanceM))m · f/\(String(format: "%.1f", store.aperture)) · ISO \(store.iso) · 1/\(store.shutterDenom)s")
                              .font(.caption2)
                      }
                      .padding()
                  }
              }
          }

          struct LumiFilmShortcutsProvider: AppShortcutsProvider {
              static var appShortcuts: [AppShortcut] {
                  return [
                      AppShortcut(
                          intent: CalculateFlashPowerIntent(),
                          phrases: [
                              "用 \(.applicationName) 算闪光灯功率",
