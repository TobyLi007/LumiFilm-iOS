              private func speakPower(_ powerText: String) {
                  let msg: String
                  if store.lang == "en" {
                      msg = "Distance \(String(format: "%.1f", store.distanceM)) meters, f \(String(format: "%.1f", store.aperture)). Set flash power to \(powerText)."
                  } else if store.lang == "ja" {
                      msg = "距離 \(String(format: "%.1f", store.distanceM)) メートル、推奨フラッシュ出力は \(powerText) です。"
                  } else {
                      msg = "距离 \(String(format: "%.1f", store.distanceM)) 米，光圈 \(String(format: "%.1f", store.aperture))，请将闪光灯拨至 \(powerText) 功率。"
                  }
                  let utterance = AVSpeechUtterance(string: msg)
                  utterance.voice = AVSpeechSynthesisVoice(language: store.lang == "en" ? "en-US" : (store.lang == "ja" ? "ja-JP" : "zh-CN"))
                  speechSynthesizer.speak(utterance)
              }
          }

          // MARK: - Authentic Vintage Film Camera Mechanical Rotary Dial Component
          struct MechanicalRotaryDialView: View {
              @ObservedObject var store: ExposureStore
              let channel: DialChannel
              let accentColor: Color
              let onStep: (Int) -> Void

              @State private var lastDragAngle: Double? = nil
              @State private var accumulatedAngle: Double = 0

              private var currentRotationDegrees: Double {
                  switch channel {
                  case .distance:
                      let ratio = (store.distanceM - 0.4) / 11.6
                      return 135.0 - ratio * 270.0
                  case .aperture:
                      let list = store.apertureSteps
                      let idx = list.enumerated().min(by: { abs($0.element - store.aperture) < abs($1.element - store.aperture) })?.offset ?? 5
                      let ratio = Double(idx) / Double(max(list.count - 1, 1))
                      return 135.0 - ratio * 270.0
                  case .shutter:
                      let list = store.shutterSteps
                      let idx = list.firstIndex(of: store.shutterDenom) ?? 3
                      let ratio = Double(idx) / Double(max(list.count - 1, 1))
                      return 135.0 - ratio * 270.0
                  }
              }

              private var centerReadoutText: String {
                  switch channel {
                  case .distance:
                      return String(format: "%.1fm", store.distanceM)
                  case .aperture:
                      return String(format: "f/%.1f", store.aperture).replacingOccurrences(of: ".0", with: "")
                  case .shutter:
                      return "1/\(store.shutterDenom)"
                  }
              }

              var body: some View {
                  ZStack {
                      // Outer Knurled Brass / Metallic Bezel Ring
                      Circle()
                          .fill(
                              AngularGradient(
                                  colors: [
                                      Color(red: 0.76, green: 0.60, blue: 0.36),
                                      Color(red: 0.94, green: 0.84, blue: 0.66),
                                      Color(red: 0.56, green: 0.42, blue: 0.24),
                                      Color(red: 0.88, green: 0.74, blue: 0.50),
                                      Color(red: 0.76, green: 0.60, blue: 0.36)
                                  ],
                                  center: .center
                              )
                          )
                          .frame(width: 196, height: 196)
                          .shadow(color: .black.opacity(0.45), radius: 14, x: 0, y: 8)

                      // Knurled Edge serrations
                      Circle()
                          .stroke(Color.black.opacity(0.45), style: StrokeStyle(lineWidth: 5, dash: [2.5, 2.5]))
                          .frame(width: 192, height: 192)

                      // Rotating Black Anodized Engraved Shutter Plate
                      ZStack {
                          Circle()
                              .fill(
                                  RadialGradient(
                                      colors: [Color(red: 0.22, green: 0.20, blue: 0.18), Color(red: 0.09, green: 0.08, blue: 0.07)],
                                      center: .center,
                                      startRadius: 10,
                                      endRadius: 90
                                  )
                              )
                              .frame(width: 174, height: 174)

                          // Engraved Ticks around the plate
                          ForEach(0..<36, id: \.self) { i in
                              let angle = -135.0 + (Double(i) / 35.0) * 270.0
                              VStack {
                                  Rectangle()
                                      .fill(i % 4 == 0 ? Color(red: 0.95, green: 0.90, blue: 0.78) : Color.white.opacity(0.35))
                                      .frame(width: i % 4 == 0 ? 2.0 : 1.0, height: i % 4 == 0 ? 9 : 5)
                                  Spacer()
                              }
                              .frame(height: 166)
                              .rotationEffect(.degrees(angle))
                          }
                      }
                      .rotationEffect(.degrees(currentRotationDegrees))
                      .animation(.interactiveSpring(response: 0.18, dampingFraction: 0.75), value: currentRotationDegrees)

                      // Top 12 O'Clock Engraved Orange/Red Index Pointer
                      VStack {
                          Image(systemName: "arrowtriangle.down.fill")
                              .font(.system(size: 12, weight: .black))
                              .foregroundStyle(accentColor)
                              .offset(y: -4)
                          Spacer()
                      }
                      .frame(height: 204)

                      // Stationary Brass Center Core & Glass Window
                      ZStack {
                          Circle()
                              .fill(
                                  LinearGradient(
                                      colors: [Color(red: 0.82, green: 0.66, blue: 0.42), Color(red: 0.52, green: 0.38, blue: 0.20)],
                                      startPoint: .topLeading,
                                      endPoint: .bottomTrailing
                                  )
                              )
                              .frame(width: 92, height: 92)

                          Circle()
                              .fill(Color(red: 0.12, green: 0.11, blue: 0.10))
                              .frame(width: 82, height: 82)

                          VStack(spacing: 2) {
                              Text(channel.rawValue)
                                  .font(.system(size: 9, weight: .bold, design: .monospaced))
                                  .foregroundStyle(accentColor)
                              Text(centerReadoutText)
                                  .font(.system(size: 18, weight: .heavy, design: .monospaced))
                                  .foregroundStyle(.white)
                              Text("ROTATE DIAL")
                                  .font(.system(size: 7, weight: .semibold, design: .monospaced))
                                  .foregroundStyle(.white.opacity(0.5))
                          }
                      }
                  }
                  .frame(width: 204, height: 204)
                  .contentShape(Circle())
                  .gesture(
                      DragGesture(minimumDistance: 2)
                          .onChanged { value in
                              let center = CGPoint(x: 102, y: 102)
                              let dx = Double(value.location.x - center.x)
                              let dy = Double(value.location.y - center.y)
                              let angle = atan2(dy, dx) * 180.0 / .pi

                              if let last = lastDragAngle {
                                  var delta = angle - last
                                  if delta > 180 { delta -= 360 }
                                  if delta < -180 { delta += 360 }
                                  accumulatedAngle += delta
                                  if abs(accumulatedAngle) >= 11.0 {
                                      let steps = Int(accumulatedAngle / 11.0)
                                      accumulatedAngle -= Double(steps) * 11.0
                                      onStep(steps > 0 ? 1 : -1)
                                  }
                              }
                              lastDragAngle = angle
                          }
                          .onEnded { _ in
                              lastDragAngle = nil
                              accumulatedAngle = 0
                          }
                  )
              }
          }

          struct GlassMetricTile: View {
