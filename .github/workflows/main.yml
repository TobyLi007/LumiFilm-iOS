                                      .padding(.vertical, 5)
                                      .background(isSel ? theme.accent : Color.white.opacity(0.12), in: Capsule())
                              }
                          }
                      }
                  }
                  .padding(13)
                  .background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 18))
              }

              private var themeSetupCard: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      Text("4. 选择喜欢的 UI 主题风格")
                          .font(.system(size: 13, weight: .bold))
                          .foregroundStyle(Color.white)
                      HStack(spacing: 8) {
                          ForEach(AppTheme.allCases) { item in
                              let isSel = (themeRaw == item.rawValue)
                              Button {
                                  themeRaw = item.rawValue
                              } label: {
                                  Text(item.name)
                                      .font(.system(size: 11, weight: .bold))
                                      .foregroundStyle(isSel ? Color.black : Color.white)
                                      .frame(maxWidth: .infinity)
                                      .padding(.vertical, 9)
                                      .background(isSel ? theme.accent : Color.white.opacity(0.12), in: RoundedRectangle(cornerRadius: 10))
                              }
                          }
                      }
                  }
                  .padding(13)
                  .background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 18))
              }
          }
          EOF

      - name: Generate Xcode Project & Compile Unsigned Release App
        run: |
          set -o pipefail
          cd LumiFilmBuild
          brew install xcodegen
          xcodegen generate
          xcodebuild clean build \
            -project LumiFilm.xcodeproj \
            -scheme LumiFilm \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || {
              echo "=== XCODE COMPILER ERRORS ==="
              grep -E "error:|fatal error:" build.log || true
              exit 1
            }

      - name: Stamp Info.plist Bundle Versions & Package Unsigned IPA for Sideloadly
        run: |
          cd LumiFilmBuild
          APP_PATH=$(find build_output -name "LumiFilm.app" -type d | head -n 1)
          echo "Found built app at: $APP_PATH"

          # Ensure Main App Info.plist has valid non-empty Bundle Version strings (fixes Sideloadly IXErrorDomain Code=17)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 7.1.0" "$APP_PATH/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 7.1.0" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 71" "$APP_PATH/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 71" "$APP_PATH/Info.plist"

          # Ensure Embedded Widget Extension Info.plist also has valid non-empty Bundle Version strings
          if [ -d "$APP_PATH/PlugIns/LumiFilmWidget.appex" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 7.1.0" "$APP_PATH/PlugIns/LumiFilmWidget.appex/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 7.1.0" "$APP_PATH/PlugIns/LumiFilmWidget.appex/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 71" "$APP_PATH/PlugIns/LumiFilmWidget.appex/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 71" "$APP_PATH/PlugIns/LumiFilmWidget.appex/Info.plist"
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r9 ../LumiFilm-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumiFilm-Unsigned-IPA
          path: LumiFilm-Unsigned.ipa
