                                      .font(.system(size: 8, weight: .heavy, design: .monospaced))
                              }
                              .padding(.horizontal, 6)
                              .padding(.vertical, 3)
                              .background(
                                  isLocked ? accent : Color.white.opacity(0.12),
                                  in: Capsule()
                              )
                              .foregroundStyle(isLocked ? .black : .white.opacity(0.85))
                          }
                          .buttonStyle(.plain)
                      }

                      Button(action: onSelect) {
                          VStack(alignment: .leading, spacing: 4) {
                              Text(value)
                                  .font(.system(size: 23, weight: .heavy, design: .monospaced))
                                  .foregroundStyle(isSelected ? accent : .white)
                                  .lineLimit(1)
                                  .minimumScaleFactor(0.7)
                              Text(subtitle)
                                  .font(.system(size: 9.5, weight: .medium))
                                  .foregroundStyle(.white.opacity(0.65))
                                  .lineLimit(1)
                          }
                          .frame(maxWidth: .infinity, alignment: .leading)
                      }
                      .buttonStyle(.plain)
                  }
                  .padding(11)
                  .background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 20, style: .continuous))
                  .overlay(
                      RoundedRectangle(cornerRadius: 20, style: .continuous)
                          .stroke(
                              isLocked ? accent.opacity(0.9) : (isSelected ? accent : .white.opacity(0.20)),
                              lineWidth: (isSelected || isLocked) ? 1.6 : 0.8
                          )
