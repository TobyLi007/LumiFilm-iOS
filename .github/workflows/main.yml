name: Build LumiFilm v5.0 Native iOS IPA (Glassmorphic + 3 Themes + Rotary Dial + WidgetFix)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository (Node 24 Ready)
        uses: actions/checkout@v5

      - name: Generate Project, Glassmorphic App Icon & SwiftUI Sources
        run: |
          mkdir -p LumiFilmBuild/LumiFilm/Assets.xcassets/AppIcon.appiconset LumiFilmBuild/LumiFilmWidget
          cd LumiFilmBuild

          # 1. Generate 1024x1024 Glassmorphic Film Flash App Icon via CoreGraphics Swift script
          cat << 'ICONEOF' > make_icon.swift
          import Cocoa

          let size = CGSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()
          guard let ctx = NSGraphicsContext.current?.cgContext else { exit(1) }

          let colorSpace = CGColorSpaceCreateDeviceRGB()

          // Dark smoked brass-glass background gradient
          let bgColors = [
              CGColor(red: 0.16, green: 0.11, blue: 0.08, alpha: 1.0),
              CGColor(red: 0.36, green: 0.21, blue: 0.12, alpha: 1.0),
              CGColor(red: 0.09, green: 0.07, blue: 0.06, alpha: 1.0)
          ] as CFArray
          let bgGrad = CGGradient(colorsSpace: colorSpace, colors: bgColors, locations: [0.0, 0.55, 1.0])!
          ctx.drawLinearGradient(bgGrad, start: CGPoint(x: 0, y: 1024), end: CGPoint(x: 1024, y: 0), options: [])

          // Warm Sunset / Amber Radial Glow
          let glowColors = [
              CGColor(red: 0.96, green: 0.55, blue: 0.24, alpha: 0.65),
              CGColor(red: 0.85, green: 0.22, blue: 0.38, alpha: 0.25),
              CGColor(red: 0.0, green: 0.0, blue: 0.0, alpha: 0.0)
          ] as CFArray
          let glowGrad = CGGradient(colorsSpace: colorSpace, colors: glowColors, locations: [0.0, 0.5, 1.0])!
          ctx.drawRadialGradient(glowGrad, startCenter: CGPoint(x: 460, y: 520), startRadius: 20, endCenter: CGPoint(x: 512, y: 512), endRadius: 460, options: [])

          // 35mm Film Strip Diagonal Ribbon
          ctx.saveGState()
          ctx.translateBy(x: 512, y: 512)
          ctx.rotate(by: -.pi / 4.2)
          let filmRect = CGRect(x: -600, y: -110, width: 1200, height: 220)
          ctx.setFillColor(CGColor(red: 0.08, green: 0.07, blue: 0.06, alpha: 0.78))
          ctx.fill(filmRect)
          ctx.setFillColor(CGColor(red: 0.92, green: 0.78, blue: 0.58, alpha: 0.55))
          for x in stride(from: -540, to: 540, by: 64) {
              ctx.fill(CGRect(x: CGFloat(x), y: 74, width: 34, height: 22))
              ctx.fill(CGRect(x: CGFloat(x), y: -96, width: 34, height: 22))
          }
          ctx.restoreGState()

          // Brass Mechanical Shutter Dial Ring
          let center = CGPoint(x: 512, y: 512)
          ctx.saveGState()
          ctx.addArc(center: center, radius: 330, startAngle: 0, endAngle: .pi * 2, clockwise: false)
          ctx.setFillColor(CGColor(red: 0.78, green: 0.58, blue: 0.32, alpha: 0.95))
          ctx.fillPath()

          ctx.addArc(center: center, radius: 296, startAngle: 0, endAngle: .pi * 2, clockwise: false)
          ctx.setFillColor(CGColor(red: 0.14, green: 0.13, blue: 0.12, alpha: 0.96))
          ctx.fillPath()

          // Tick marks around mechanical dial
          for i in 0..<36 {
              let angle = CGFloat(i) * (.pi * 2 / 36.0)
              let r1: CGFloat = (i % 3 == 0) ? 250 : 268
              let r2: CGFloat = 288
              let p1 = CGPoint(x: center.x + cos(angle) * r1, y: center.y + sin(angle) * r1)
              let p2 = CGPoint(x: center.x + cos(angle) * r2, y: center.y + sin(angle) * r2)
              ctx.setStrokeColor(i == 9 ? CGColor(red: 0.95, green: 0.45, blue: 0.25, alpha: 1.0) : CGColor(red: 0.94, green: 0.88, blue: 0.76, alpha: 0.8))
              ctx.setLineWidth(i % 3 == 0 ? 7 : 3.5)
              ctx.move(to: p1)
              ctx.addLine(to: p2)
              ctx.strokePath()
          }
          ctx.restoreGState()

          // Frosted Glassmorphic Flash Reflector Dome & Lightning Core
          let glassRect = CGRect(x: 262, y: 262, width: 500, height: 500)
          let glassPath = CGPath(roundedRect: glassRect, cornerWidth: 160, cornerHeight: 160, transform: nil)
          ctx.saveGState()
          ctx.addPath(glassPath)
          ctx.setFillColor(CGColor(red: 1.0, green: 0.96, blue: 0.90, alpha: 0.22))
          ctx.fillPath()
          ctx.addPath(glassPath)
          ctx.setStrokeColor(CGColor(red: 1.0, green: 0.92, blue: 0.78, alpha: 0.65))
          ctx.setLineWidth(8)
          ctx.strokePath()
          ctx.restoreGState()

          // Xenon Flash Lightning Bolt Symbol in Center
          let bolt = CGMutablePath()
          bolt.move(to: CGPoint(x: 548, y: 700))
          bolt.addLine(to: CGPoint(x: 382, y: 500))
          bolt.addLine(to: CGPoint(x: 498, y: 500))
          bolt.addLine(to: CGPoint(x: 462, y: 324))
          bolt.addLine(to: CGPoint(x: 642, y: 532))
          bolt.addLine(to: CGPoint(x: 522, y: 532))
          bolt.closeSubpath()

          ctx.saveGState()
          ctx.setShadow(offset: CGSize(width: 0, height: 8), blur: 28, color: CGColor(red: 1.0, green: 0.65, blue: 0.25, alpha: 0.95))
          ctx.addPath(bolt)
          ctx.setFillColor(CGColor(red: 1.0, green: 0.97, blue: 0.88, alpha: 1.0))
          ctx.fillPath()
          ctx.restoreGState()

          image.unlockFocus()

          if let tiff = image.tiffRepresentation,
             let rep = NSBitmapImageRep(data: tiff),
             let png = rep.representation(using: .png, properties: [:]) {
              try! png.write(to: URL(fileURLWithPath: "LumiFilm/Assets.xcassets/AppIcon.appiconset/AppIcon.png"))
          }
          ICONEOF

          swift make_icon.swift

          cat << 'JSONEOF' > LumiFilm/Assets.xcassets/Contents.json
          {
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSONEOF

          cat << 'JSONEOF' > LumiFilm/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSONEOF

          # 2. Generate XcodeGen project.yml
          cat << 'EOF' > project.yml
          name: LumiFilm
          options:
            bundleIdPrefix: com.lumifilm.exposure
            deploymentTarget:
              iOS: "16.4"
            xcodeVersion: "15.0"
            generateEmptyDirectories: true

          targets:
            LumiFilm:
              type: application
              platform: iOS
              deploymentTarget: "16.4"
              sources:
                - path: LumiFilm
              info:
                path: LumiFilm/Info.plist
                properties:
                  CFBundleDisplayName: LumiFilm
                  CFBundleShortVersionString: "5.0.0"
                  CFBundleVersion: "50"
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  NSMicrophoneUsageDescription: "LumiFilm 需要麦克风权限来识别您说出的拍摄距离、光圈与场景，立即播报推荐的闪光灯输出功率。"
                  NSSpeechRecognitionUsageDescription: "LumiFilm 需要语音识别权限以将您的抓拍语音转换为闪光灯曝光参数。"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.lumifilm.exposure.app
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  MARKETING_VERSION: "5.0.0"
                  CURRENT_PROJECT_VERSION: "50"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
              dependencies:
                - target: LumiFilmWidget
                  embed: true

            LumiFilmWidget:
              type: app-extension
              platform: iOS
              deploymentTarget: "16.4"
              sources:
                - path: LumiFilmWidget
              info:
                path: LumiFilmWidget/Info.plist
                properties:
                  CFBundleDisplayName: LumiFilm Widget
                  CFBundleShortVersionString: "5.0.0"
                  CFBundleVersion: "50"
                  NSExtension:
                    NSExtensionPointIdentifier: com.apple.widgetkit-extension
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.lumifilm.exposure.app.widget
                  MARKETING_VERSION: "5.0.0"
                  CURRENT_PROJECT_VERSION: "50"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          # 3. Generate LumiFilmApp.swift (Store + Audio/Haptics + AppIntents)
          cat << 'EOF' > LumiFilm/LumiFilmApp.swift
          import SwiftUI
          import AppIntents
          import WidgetKit
          import AVFoundation
          import AudioToolbox

          @main
          struct LumiFilmApp: App {
              init() {
                  LumiFilmShortcutsProvider.updateAppShortcutParameters()
              }
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }

          struct FlashModelSpec: Identifiable, Hashable {
              let id: String
              let nameZh: String
              let nameEn: String
              let nameJa: String
              let shortName: String
              let baseGN: Double
              let ratedZoom: Int
              let minPowerDenom: Int
              let recycleSec: Double
          }

          enum LumiTheme: Int, CaseIterable, Identifiable {
              case instagram = 0   // Instagram Sunset Glass
              case threads = 1     // Threads Monochrome Frosted Glass
              case brass = 2       // Vintage Brass Patina (纯色胶片露铜质感)

              var id: Int { rawValue }

              func title(lang: String) -> String {
                  switch self {
                  case .instagram:
                      return lang == "en" ? "Instagram Sunset" : (lang == "ja" ? "IG サンセット" : "Ins 落日流光")
                  case .threads:
                      return lang == "en" ? "Threads Mono" : (lang == "ja" ? "Threads モノクロ" : "Threads 极简毛玻璃")
                  case .brass:
                      return lang == "en" ? "Leica Brass Patina" : (lang == "ja" ? "真鍮フィルム露銅" : "胶片黑漆露铜")
                  }
              }

              var backgroundGradient: LinearGradient {
                  switch self {
                  case .instagram:
                      return LinearGradient(
                          colors: [
                              Color(red: 0.16, green: 0.08, blue: 0.24),
                              Color(red: 0.38, green: 0.12, blue: 0.26),
                              Color(red: 0.48, green: 0.24, blue: 0.14)
                          ],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                  case .threads:
                      return LinearGradient(
                          colors: [
                              Color(red: 0.06, green: 0.06, blue: 0.07),
                              Color(red: 0.13, green: 0.13, blue: 0.15),
                              Color(red: 0.08, green: 0.08, blue: 0.09)
                          ],
                          startPoint: .top,
                          endPoint: .bottom
                      )
                  case .brass:
                      return LinearGradient(
                          colors: [
                              Color(red: 0.11, green: 0.10, blue: 0.08),
                              Color(red: 0.20, green: 0.16, blue: 0.11),
                              Color(red: 0.13, green: 0.11, blue: 0.09)
                          ],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                  }
              }

              var accentColor: Color {
                  switch self {
                  case .instagram:
                      return Color(red: 1.0, green: 0.48, blue: 0.35)
                  case .threads:
                      return Color(red: 0.94, green: 0.94, blue: 0.96)
                  case .brass:
                      return Color(red: 0.85, green: 0.65, blue: 0.34)
                  }
              }

              var secondaryAccent: Color {
                  switch self {
                  case .instagram:
                      return Color(red: 0.92, green: 0.30, blue: 0.58)
                  case .threads:
                      return Color(red: 0.65, green: 0.68, blue: 0.74)
                  case .brass:
                      return Color(red: 0.72, green: 0.48, blue: 0.24)
                  }
              }
          }

          final class FeedbackEngine {
              static let shared = FeedbackEngine()
              private let selectionGen = UISelectionFeedbackGenerator()
              private let impactLight = UIImpactFeedbackGenerator(style: .light)
              private let impactMedium = UIImpactFeedbackGenerator(style: .medium)

              func prepare() {
                  selectionGen.prepare()
                  impactLight.prepare()
              }

              func dialTick(soundOn: Bool, hapticsOn: Bool) {
                  if hapticsOn {
                      impactLight.impactOccurred(intensity: 0.85)
                  }
                  if soundOn {
                      // 1157 = Crisp iOS mechanical wheel tick sound
                      AudioServicesPlaySystemSound(1157)
                  }
              }

              func buttonTap(soundOn: Bool, hapticsOn: Bool) {
                  if hapticsOn {
                      impactMedium.impactOccurred()
                  }
                  if soundOn {
                      AudioServicesPlaySystemSound(1104)
                  }
              }
          }

          final class ExposureStore: ObservableObject {
              static let shared = ExposureStore()

              @AppStorage("lf_has_onboarded_v5") var hasCompletedOnboarding: Bool = false
              @AppStorage("lf_theme_id") var themeRaw: Int = 2 // Default to Brass Patina or user choice
              @AppStorage("lf_lang") var lang: String = "zh"
              @AppStorage("lf_sound_on") var soundOn: Bool = true
              @AppStorage("lf_haptics_on") var hapticsOn: Bool = true

              @AppStorage("lf_flash_id") var flashId: String = "godox-v350"
              @AppStorage("lf_is_custom_gn") var isCustomGN: Bool = false
              @AppStorage("lf_custom_gn_val") var customGNVal: Double = 36.0
              @AppStorage("lf_film_name") var filmName: String = "Kodak Portra 400"
              @AppStorage("lf_iso") var iso: Int = 400
              @AppStorage("lf_zoom_mm") var zoomMM: Int = 50
              @AppStorage("lf_max_sync") var maxSyncDenom: Int = 125

              @AppStorage("lf_distance_m") var distanceM: Double = 2.0
              @AppStorage("lf_aperture") var aperture: Double = 4.0
              @AppStorage("lf_power_stops") var powerStopOffset: Double = -2.0
              @AppStorage("lf_shutter_denom") var shutterDenom: Int = 125
              @AppStorage("lf_mod_loss") var modifierLossEV: Double = 0.0
              @AppStorage("lf_bounce_loss") var bounceLossEV: Double = 0.0

              let apertureSteps: [Double] = [1.4, 1.8, 2.0, 2.8, 3.5, 4.0, 5.6, 8.0, 11.0, 16.0, 22.0]
              let shutterSteps: [Int] = [15, 30, 60, 125, 250, 500, 1000, 2000, 4000]
              let distanceSteps: [Double] = [0.5, 0.7, 1.0, 1.2, 1.5, 1.8, 2.0, 2.5, 3.0, 4.0, 5.0, 7.0, 10.0]

              let catalog: [FlashModelSpec] = [
                  FlashModelSpec(id: "godox-v350", nameZh: "神牛 Godox V350 (主力推荐)", nameEn: "Godox V350 (Primary)", nameJa: "Godox V350 (推奨)", shortName: "Godox V350", baseGN: 36, ratedZoom: 105, minPowerDenom: 128, recycleSec: 1.7),
                  FlashModelSpec(id: "godox-tt350", nameZh: "神牛 Godox TT350 (AA版)", nameEn: "Godox TT350", nameJa: "Godox TT350", shortName: "Godox TT350", baseGN: 36, ratedZoom: 105, minPowerDenom: 128, recycleSec: 2.2),
                  FlashModelSpec(id: "godox-lux-jr", nameZh: "神牛 Godox Lux Junior", nameEn: "Godox Lux Junior", nameJa: "Godox Lux Junior", shortName: "Lux Junior", baseGN: 12, ratedZoom: 28, minPowerDenom: 64, recycleSec: 3.0),
                  FlashModelSpec(id: "godox-v1pro", nameZh: "神牛 Godox V1Pro", nameEn: "Godox V1Pro", nameJa: "Godox V1Pro", shortName: "Godox V1Pro", baseGN: 42, ratedZoom: 105, minPowerDenom: 256, recycleSec: 1.3),
                  FlashModelSpec(id: "godox-v860iii", nameZh: "神牛 Godox V860III", nameEn: "Godox V860III", nameJa: "Godox V860III", shortName: "Godox V860III", baseGN: 60, ratedZoom: 200, minPowerDenom: 256, recycleSec: 1.5),
                  FlashModelSpec(id: "profoto-a10", nameZh: "Profoto A10", nameEn: "Profoto A10", nameJa: "Profoto A10", shortName: "Profoto A10", baseGN: 42, ratedZoom: 105, minPowerDenom: 256, recycleSec: 1.0)
              ]

              var currentTheme: LumiTheme {
                  LumiTheme(rawValue: themeRaw) ?? .brass
              }

              var activeFlashSpec: FlashModelSpec {
                  catalog.first(where: { $0.id == flashId }) ?? catalog[0]
              }

              var activeGN: Double {
                  isCustomGN ? customGNVal : activeFlashSpec.baseGN
              }

              var displayFlashTitle: String {
                  if isCustomGN {
                      if lang == "en" { return "User Custom" }
                      if lang == "ja" { return "ユーザーカスタム" }
                      return "用户自定义"
                  }
                  return activeFlashSpec.shortName
              }

              func calculateRecommendedPower(distance: Double, fStop: Double) -> (powerText: String, stopOffset: Double, isOutOfRange: Bool) {
                  let spec = activeFlashSpec
                  let minStops = -log2(Double(spec.minPowerDenom))
                  let zoomFactor = isCustomGN ? 1.0 : pow(Double(zoomMM) / Double(spec.ratedZoom), 0.38)
                  let gn100 = activeGN * zoomFactor
                  let isoFactor = sqrt(Double(iso) / 100.0)
                  let totalLoss = modifierLossEV + bounceLossEV
                  let lossFactor = pow(2.0, -totalLoss / 2.0)
                  let fullEffGN = max(gn100 * isoFactor * lossFactor, 0.1)

                  let reqGN = fStop * distance
                  let reqRatio = pow(reqGN / fullEffGN, 2.0)
                  let rawStops = log2(max(reqRatio, 1e-6))
                  let snapped = (rawStops * 3.0).rounded() / 3.0
                  let outOfRange = rawStops > 0.25 || rawStops < (minStops - 0.25)
                  let clamped = min(max(snapped, minStops), 0.0)

                  return (formatPower(clamped, minDenom: spec.minPowerDenom), clamped, outOfRange)
              }

              func formatPower(_ stopOffset: Double, minDenom: Int) -> String {
                  let minStops = -log2(Double(minDenom))
                  let clamped = min(max(stopOffset, minStops), 0.0)
                  let roundedThirds = (clamped * 3.0).rounded() / 3.0
                  let whole = floor(roundedThirds + 1e-6)
                  let rem = roundedThirds - whole
                  let denom = Int(pow(2.0, -whole).rounded())
                  let base = "1/\(denom)"
                  if rem > 0.5 { return "\(base) +0.7" }
                  if rem > 0.16 { return "\(base) +0.3" }
                  return base
              }
          }

          struct CalculateFlashPowerIntent: AppIntent {
              static var title: LocalizedStringResource = "计算闪光灯输出功率 (LumiFilm)"
              static var description = IntentDescription("输入拍摄距离与光圈，立即计算并语音播报闪光灯手动输出功率比。")
              static var openAppWhenRun: Bool = false

              @Parameter(title: "拍摄距离 (米 / Meters)", default: 2.0)
              var distanceMeters: Double

              @Parameter(title: "光圈大小 (f-stop)", default: 4.0)
              var apertureFStop: Double

              func perform() async throws -> some IntentResult & ProvidesDialog & ShowsSnippetView {
                  let store = ExposureStore.shared
                  store.distanceM = distanceMeters
                  store.aperture = apertureFStop
                  let result = store.calculateRecommendedPower(distance: distanceMeters, fStop: apertureFStop)
                  store.powerStopOffset = result.stopOffset
                  WidgetCenter.shared.reloadAllTimelines()

                  let dialogText = "距离 \(String(format: "%.1f", distanceMeters)) 米，光圈 f/\(String(format: "%.1f", apertureFStop))，请将【\(store.displayFlashTitle)】调至 \(result.powerText) 功率。"
                  return .result(dialog: IntentDialog(stringLiteral: dialogText)) {
                      VStack(alignment: .leading, spacing: 6) {
                          Text("⚡ LumiFilm · \(store.displayFlashTitle) (GN\(Int(store.activeGN)))")
                              .font(.caption)
                              .foregroundStyle(.secondary)
                          Text("推荐闪光功率：\(result.powerText)")
                              .font(.title3.bold())
                          Text("距离 \(String(format: "%.1f", distanceMeters))m · f/\(String(format: "%.1f", apertureFStop)) · ISO \(store.iso) · 1/\(store.shutterDenom)s")
                              .font(.caption2)
                      }
                      .padding()
                  }
              }
          }

          struct LumiFilmShortcutsProvider: AppShortcutsProvider {
              static var appShortcuts: [AppShortcut] {
                  return [
                      AppShortcut(
                          intent: CalculateFlashPowerIntent(),
                          phrases: [
                              "用 \(.applicationName) 算闪光灯功率",
                              "Ask \(.applicationName) for flash power",
                              "\(.applicationName) 测光速算"
                          ],
                          shortTitle: "闪光灯测光速算",
                          systemImageName: "bolt.circle.fill"
                      )
                  ]
              }
          }
          EOF

          # 4. Generate ContentView.swift (Glassmorphism + Mechanical Rotary Dial + First-Launch Onboarding + 3 Themes)
          cat << 'EOF' > LumiFilm/ContentView.swift
          import SwiftUI
          import WidgetKit
          import AVFoundation

          enum DialChannel: String, CaseIterable {
              case distance = "DIST"
              case aperture = "F-STOP"
              case shutter = "SHUTTER"
          }

          struct ContentView: View {
              @StateObject private var store = ExposureStore.shared
              @State private var selectedTab: Int = 0
              @State private var activeChannel: DialChannel = .distance
              @State private var showOnboardingSheet: Bool = false
              private let speechSynthesizer = AVSpeechSynthesizer()

              var body: some View {
                  let theme = store.currentTheme
                  let solved = store.calculateRecommendedPower(distance: store.distanceM, fStop: store.aperture)

                  ZStack {
                      // Full-screen Rich Theme Background
                      theme.backgroundGradient
                          .ignoresSafeArea()

                      // Ambient glowing orbs for Frosted Glassmorphism depth
                      Circle()
                          .fill(theme.accentColor.opacity(0.28))
                          .frame(width: 260, height: 260)
                          .blur(radius: 65)
                          .offset(x: -110, y: -230)

                      Circle()
                          .fill(theme.secondaryAccent.opacity(0.22))
                          .frame(width: 280, height: 280)
                          .blur(radius: 75)
                          .offset(x: 120, y: 180)

                      VStack(spacing: 0) {
                          // Top Frosted Glass Header Bar
                          HStack(spacing: 10) {
                              VStack(alignment: .leading, spacing: 3) {
                                  HStack(spacing: 6) {
                                      Image(systemName: "bolt.Ring.closed")
                                          .foregroundStyle(theme.accentColor)
                                      Text(store.lang == "en" ? "LumiFilm Flash" : (store.lang == "ja" ? "LumiFilm 露出手帖" : "LumiFilm 胶片闪光"))
                                          .font(.system(size: 18, weight: .bold, design: .serif))
                                          .foregroundStyle(.white)
                                  }
                                  Text("\(store.displayFlashTitle) (GN\(Int(store.activeGN))) · \(store.filmName) (ISO \(store.iso))")
                                      .font(.system(size: 11, weight: .medium, design: .monospaced))
                                      .foregroundStyle(.white.opacity(0.75))
                              }
                              Spacer()

                              Button {
                                  FeedbackEngine.shared.buttonTap(soundOn: store.soundOn, hapticsOn: store.hapticsOn)
                                  showOnboardingSheet = true
                              } label: {
                                  HStack(spacing: 4) {
                                      Image(systemName: "film")
                                      Text(store.lang == "en" ? "Roll Setup" : (store.lang == "ja" ? "ロール設定" : "换卷/设灯"))
                                  }
                                  .font(.system(size: 11, weight: .bold))
                                  .foregroundStyle(.white)
                                  .padding(.horizontal, 11)
                                  .padding(.vertical, 7)
                                  .background(.ultraThinMaterial, in: Capsule())
                                  .overlay(Capsule().stroke(.white.opacity(0.28), lineWidth: 0.8))
                              }
                          }
                          .padding(.horizontal, 16)
                          .padding(.top, 8)
                          .padding(.bottom, 10)

                          // Main Content Area
                          if selectedTab == 0 {
                              meterTabView(theme: theme, solved: solved)
                          } else if selectedTab == 1 {
                              ambientTabView(theme: theme, solved: solved)
