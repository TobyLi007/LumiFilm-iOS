                  .onTapGesture {
                      feedback.buttonTap(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled)
                      withAnimation(.spring(response: 0.28, dampingFraction: 0.76)) {
                          selectedParameter = param
                          lastEditedParameter = param
                      }
