                                      feedback.dialTick(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled, magneticSnap: s == maxSyncSpeed)
                                      withAnimation(.spring(response: 0.26, dampingFraction: 0.76)) {
                                          shutterDenom = s
                                          if lockPower { solveForLockedPower(changed: .shutter) }
                                      }
                                  } label: {
                                      Text("1/\(s)")
                                          .font(.system(size: 10, weight: .bold, design: .monospaced))
                                          .foregroundStyle(fg)
                                          .padding(.horizontal, 9)
                                          .padding(.vertical, 4.5)
                                          .background(active ? theme.accent : Color.white.opacity(0.12), in: Capsule())
                                  }
                              }
                          case .flashPower:
                              ForEach(0..<powerDenominators.count, id: \.self) { idx in
                                  let d = powerDenominators[idx]
                                  let label = d == 1 ? "1/1" : "1/\(d)"
                                  let active = (manualPowerIndex == idx && lockPower)
                                  Button {
                                      lastEditedParameter = .flashPower
                                      feedback.dialTick(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled, magneticSnap: true)
                                      withAnimation(.spring(response: 0.26, dampingFraction: 0.76)) {
                                          lockPower = true
                                          manualPowerIndex = idx
                                          solveForLockedPower(changed: .flashPower)
                                      }
                                  } label: {
                                      Text(label)
                                          .font(.system(size: 10, weight: .bold, design: .monospaced))
                                          .foregroundStyle(active ? Color.black : Color.white)
                                          .padding(.horizontal, 9)
                                          .padding(.vertical, 4.5)
                                          .background(active ? theme.accent : Color.white.opacity(0.12), in: Capsule())
                                  }
                              }
                          }
                      }
                  }
              }

