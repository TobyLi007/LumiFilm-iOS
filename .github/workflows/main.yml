              private func stepActiveChannel(by delta: Int) {
                  switch activeChannel {
                  case .distance:
                      if store.isDistanceMagnetOn {
                          // Feature 3: 0.5m Magnetic Snap Resolution
                          let halfSteps = (store.distanceM * 2.0).rounded()
                          let next = min(max((halfSteps + Double(delta)) * 0.5, 0.5), 12.0)
                          store.distanceM = next
                          FeedbackEngine.shared.magnetSnapTick(soundOn: store.soundOn, hapticsOn: store.hapticsOn)
                      } else {
                          let next = min(max(((store.distanceM + Double(delta) * 0.1) * 10.0).rounded() / 10.0, 0.4), 12.0)
                          store.distanceM = next
                          let isHalfMeterMark = abs(next.truncatingRemainder(dividingBy: 0.5)) < 0.02
                          if isHalfMeterMark {
                              FeedbackEngine.shared.magnetSnapTick(soundOn: store.soundOn, hapticsOn: store.hapticsOn)
                          } else {
                              FeedbackEngine.shared.dialTick(soundOn: store.soundOn, hapticsOn: store.hapticsOn)
                          }
                      }
                      store.solveExposure(changed: .distance)

                  case .power:
                      // Feature 4: Adjusting Power locks Power and solves Aperture/Distance/Shutter
                      FeedbackEngine.shared.dialTick(soundOn: store.soundOn, hapticsOn: store.hapticsOn)
                      let minStops = -log2(Double(store.activeFlashSpec.minPowerDenom))
                      let next = ((store.powerStopOffset + Double(delta) / 3.0) * 3.0).rounded() / 3.0
                      store.powerStopOffset = min(max(next, minStops), 0.0)
                      store.isPowerLocked = true
                      store.solveExposure(changed: .power)

                  case .aperture:
                      FeedbackEngine.shared.dialTick(soundOn: store.soundOn, hapticsOn: store.hapticsOn)
                      let list = store.availableApertureSteps
                      let curIdx = list.enumerated().min(by: { abs($0.element - store.aperture) < abs($1.element - store.aperture) })?.offset ?? 0
                      let nextIdx = min(max(curIdx + delta, 0), list.count - 1)
                      store.aperture = list[nextIdx]
                      store.solveExposure(changed: .aperture)

                  case .shutter:
                      FeedbackEngine.shared.dialTick(soundOn: store.soundOn, hapticsOn: store.hapticsOn)
                      let list = store.shutterSteps
                      let curIdx = list.firstIndex(of: store.shutterDenom) ?? 3
                      let nextIdx = min(max(curIdx + delta, 0), list.count - 1)
                      store.shutterDenom = list[nextIdx]
                      store.solveExposure(changed: .shutter)
                  }
                  WidgetCenter.shared.reloadAllTimelines()
              }

