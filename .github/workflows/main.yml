                                          .font(.system(size: 20, weight: .black, design: .rounded))
                                          .foregroundStyle(Color.white)
                                      Text(lang == .en ? "Set your film ISO, lens max aperture & flash GN" : "首次胶卷、镜头最大光圈与闪光灯预设（自动记忆）")
                                          .font(.system(size: 11))
                                          .foregroundStyle(Color.white.opacity(0.72))
                                  }
