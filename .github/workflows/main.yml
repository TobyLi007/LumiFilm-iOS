              private func stepActiveChannel(by delta: Int) {
                  FeedbackEngine.shared.dialTick(soundOn: store.soundOn, hapticsOn: store.hapticsOn)
                  switch activeChannel {
                  case .distance:
                      let next = min(max(store.distanceM + Double(delta) * 0.1, 0.4), 12.0)
                      store.distanceM = (next * 10).rounded() / 10
                  case .aperture:
                      let list = store.apertureSteps
                      let curIdx = list.enumerated().min(by: { abs($0.element - store.aperture) < abs($1.element - store.aperture) })?.offset ?? 5
                      let nextIdx = min(max(curIdx + delta, 0), list.count - 1)
                      store.aperture = list[nextIdx]
                  case .shutter:
                      let list = store.shutterSteps
                      let curIdx = list.firstIndex(of: store.shutterDenom) ?? 3
                      let nextIdx = min(max(curIdx + delta, 0), list.count - 1)
                      store.shutterDenom = list[nextIdx]
                  }
                  WidgetCenter.shared.reloadAllTimelines()
              }

