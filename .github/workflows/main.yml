              private var filterLabelName: String {
                  if abs(filterLossEV - 0.0) < 0.05 { return "无滤镜" }
                  if abs(filterLossEV - 0.3) < 0.05 { return "柔焦/UV (-0.3EV)" }
                  if abs(filterLossEV - 1.0) < 0.05 { return "黄镜 (-1EV)" }
                  if abs(filterLossEV - 2.0) < 0.05 { return "ND4 (-2EV)" }
                  if abs(filterLossEV - 3.0) < 0.05 { return "ND8 (-3EV)" }
                  return String(format: "-%.1fEV", filterLossEV)
              }

              private func formatFStop(_ val: Double) -> String {
                  if abs(val - round(val)) < 0.05 {
                      return "f/\(Int(round(val)))"
                  }
                  return String(format: "f/%.1f", val)
              }

              private func computeFullEffectiveGN(forShutter shutter: Int) -> Double {
                  let effectiveISO = max(filmISO * pow(2.0, pushPullEV), 25.0)
                  let isoFactor = sqrt(effectiveISO / 100.0)
                  let hssStops = shutter > maxSyncSpeed ? log2(Double(shutter) / Double(maxSyncSpeed)) : 0.0
                  let hssLoss = hssStops > 0 ? (1.0 + 0.5 * hssStops) : 0.0
                  let totalLoss = modifierLossEV + bounceLossEV + filterLossEV + exposureCompEV + hssLoss
                  return flashGN * isoFactor * pow(2.0, -totalLoss / 2.0)
              }

              private var lockedPowerFraction: Double {
                  let idx = max(0, min(powerDenominators.count - 1, manualPowerIndex))
                  return 1.0 / Double(powerDenominators[idx])
              }

              private var lockedPowerText: String {
                  let idx = max(0, min(powerDenominators.count - 1, manualPowerIndex))
                  let d = powerDenominators[idx]
                  return d == 1 ? "1/1" : "1/\(d)"
              }

              private var exposureResult: (powerTitle: String, subNote: String, statusColor: Color, warningBanner: String?, ambientDiffEV: Double) {
                  let effGN = computeFullEffectiveGN(forShutter: shutterDenom)
                  let maxApertureAtFull = effGN / max(distance, 0.3)
                  let requiredRatio = aperture / max(maxApertureAtFull, 0.05)
                  let requiredPower = requiredRatio * requiredRatio

                  let effectiveISO = max(filmISO * pow(2.0, pushPullEV), 25.0)
                  let cameraEV100 = log2((aperture * aperture) * Double(shutterDenom)) - log2(effectiveISO / 100.0)
                  let effectiveSceneEV = ambientEV100 - filterLossEV - exposureCompEV
                  let ambientDiffEV = effectiveSceneEV - cameraEV100

                  if lockPower {
                      let availGN = effGN * sqrt(lockedPowerFraction)
                      let achievedAperture = availGN / max(distance, 0.3)
                      let evError = 2.0 * log2(achievedAperture / max(aperture, 0.1))

                      var advice: String? = nil
                      if evError < -0.35 {
                          let neededDist = max(0.5, round((availGN / aperture) * 2.0) / 2.0)
                          if aperture <= maxLensAperture + 0.05 {
                              advice = String(format: "⚠️ 当前锁死 %@ 功率不足 (欠曝 %.1f EV)！光圈已达镜头极限 %@，请提高闪光灯功率、靠近至 %.1fm 或提升 ISO。", lockedPowerText, abs(evError), formatFStop(maxLensAperture), neededDist)
                          } else {
                              advice = String(format: "⚠️ 当前锁死 %@ 功率不足 (欠曝 %.1f EV)！建议增大闪光灯功率、开大光圈至 %@ 或靠近至 %.1fm。", lockedPowerText, abs(evError), formatFStop(max(maxLensAperture, achievedAperture)), neededDist)
                          }
                      } else if evError > 0.45 {
                          let neededDist = min(15.0, round((availGN / aperture) * 2.0) / 2.0)
                          advice = String(format: "⚠️ 当前锁死 %@ 功率过强 (过曝 +%.1f EV)！建议降低闪光灯功率、收缩光圈至 %@ 或后退至 %.1fm。", lockedPowerText, evError, formatFStop(min(22.0, achievedAperture)), neededDist)
                      } else if shutterDenom > maxSyncSpeed {
                          advice = "⚡ 快门 1/\(shutterDenom)s 超出同步速度 1/\(maxSyncSpeed)s，已计入 HSS 高速同步光损。"
                      }

                      let statusCol: Color = abs(evError) <= 0.35 ? Color.green : (evError < 0 ? Color.red : Color.orange)
                      let sub = abs(evError) <= 0.35
                          ? "锁定功率匹配良好 · 1/\(shutterDenom)s · \(formatFStop(aperture)) · \(String(format: "%.1fm", distance))"
                          : String(format: "偏差 %+.1f EV · 理想光圈 %@ 或距离 %.1fm", evError, formatFStop(achievedAperture), availGN / aperture)
                      return ("\(lockedPowerText) LOCKED", sub, statusCol, advice, ambientDiffEV)
                  }

                  if requiredPower > 1.05 {
                      let deficitStops = log2(requiredPower)
                      let maxSafeDist = max(0.5, round((effGN / aperture) * 2.0) / 2.0)
                      let warn = String(format: "⚠️ 闪光灯全功率仍欠曝 %.1f 档！建议：增加闪光灯功率(换大GN灯)、开大光圈至 %@ 或靠近至 %.1fm。", deficitStops, formatFStop(max(maxLensAperture, maxApertureAtFull)), maxSafeDist)
                      return ("OVER (>1/1)", String(format: "欠曝 -%.1f EV · 需靠近至 %.1fm", deficitStops, maxSafeDist), Color.red, warn, ambientDiffEV)
                  }

                  if requiredPower < (1.0 / 256.0) {
                      let warn = "⚠️ 距离过近且光圈较大，1/128 最小功率仍可能过曝！建议收缩光圈、加装 ND 滤镜或拉远距离。"
                      return ("LOW (<1/128)", "过曝风险 · 请收小光圈或拉远距离", Color.orange, warn, ambientDiffEV)
                  }

                  let rawStopsDown = log2(1.0 / requiredPower)
                  let roundedStops = round(rawStopsDown * 3.0) / 3.0
                  let nearestWhole = Int(floor(roundedStops + 0.08))
                  let clampedWhole = max(0, min(7, nearestWhole))
                  let denom = 1 << clampedWhole
                  let remainderEV = roundedStops - Double(clampedWhole)
                  let baseFraction = denom == 1 ? "1/1" : "1/\(denom)"

                  var syncWarn: String? = nil
                  if shutterDenom > maxSyncSpeed {
                      syncWarn = "⚡ 快门 1/\(shutterDenom)s 超出胶片机同步速度 1/\(maxSyncSpeed)s，请确认支持 HSS 或调回 1/\(maxSyncSpeed)s。"
                  } else if ambientDiffEV > 0.8 {
                      syncWarn = String(format: "☀️ 环境光比当前快门/光圈亮 +%.1f EV，建议加快快门速度或收缩光圈防环境过曝。", ambientDiffEV)
                  }

                  if abs(remainderEV) < 0.14 {
                      return (baseFraction, "精准档位 · \(formatFStop(aperture)) · 1/\(shutterDenom)s · \(String(format: "%.1fm", distance))", Color.green, syncWarn, ambientDiffEV)
                  } else {
                      let trim = String(format: "%+.1f EV", -remainderEV)
                      return ("\(baseFraction) (\(trim))", "手动微调 · \(formatFStop(aperture)) · 1/\(shutterDenom)s · \(String(format: "%.1fm", distance))", theme.accent, syncWarn, ambientDiffEV)
                  }
              }

              private func solveForLockedPower(changed: DialParameter) {
                  guard lockPower else { return }
                  let effGN = computeFullEffectiveGN(forShutter: shutterDenom)
                  let targetGN = effGN * sqrt(lockedPowerFraction)

                  if changed != .aperture && !lockAperture {
                      let idealAp = targetGN / max(distance, 0.3)
                      let clampedAp = max(maxLensAperture, min(22.0, idealAp))
                      if let closest = apertureSteps.min(by: { abs($0 - clampedAp) < abs($1 - clampedAp) }) {
                          aperture = closest
                      }
                  } else if changed != .distance && !lockDistance {
                      let idealDist = targetGN / max(aperture, 0.8)
                      let snappedDist = round(idealDist * 2.0) / 2.0
                      distance = max(0.5, min(15.0, snappedDist))
                  } else if changed != .shutter && !lockShutter {
                      let effectiveISO = max(filmISO * pow(2.0, pushPullEV), 25.0)
                      let targetShutterDouble = pow(2.0, ambientEV100 - filterLossEV - exposureCompEV + log2(effectiveISO / 100.0)) / max(aperture * aperture, 1.0)
                      let maxAllowed = maxSyncSpeed
                      let validSteps = shutterSteps.filter { $0 <= maxAllowed }
                      if let closest = (validSteps.isEmpty ? shutterSteps : validSteps).min(by: { abs(Double($0) - targetShutterDouble) < abs(Double($1) - targetShutterDouble) }) {
                          shutterDenom = closest
                      }
                  }
              }

              private func normalizeChineseNumbers(_ raw: String) -> String {
                  var s = raw.lowercased()
                  let phraseReplacements: [(String, String)] = [
                      ("四千", "4000"), ("两千", "2000"), ("二千", "2000"), ("一千六百", "1600"), ("一千", "1000"),
                      ("八百", "800"), ("五百", "500"), ("四百", "400"), ("三百二", "320"), ("两百五", "250"), ("二百五", "250"),
                      ("两百", "200"), ("二百", "200"), ("一百六", "160"), ("一百二十五", "125"), ("一百二", "125"), ("一百", "100"),
                      ("六十", "60"), ("五十", "50"), ("三十", "30"), ("二十二", "22"), ("十六", "16"), ("十五", "15"),
                      ("十三", "13"), ("十一", "11"), ("五点六", "5.6"), ("二点八", "2.8"), ("一点四", "1.4"), ("一点八", "1.8"),
                      ("一点二", "1.2"), ("二点五", "2.5"), ("一点五", "1.5"), ("三点五", "3.5"), ("三点二", "3.2"),
                      ("零点五", "0.5"), ("半米", "0.5米"), ("艾弗", "f"), ("エフ", "f")
                  ]
                  for (k, v) in phraseReplacements {
                      s = s.replacingOccurrences(of: k, with: v)
                  }
                  let singleDigits: [(String, String)] = [
                      ("一", "1"), ("二", "2"), ("两", "2"), ("三", "3"), ("四", "4"),
                      ("五", "5"), ("六", "6"), ("七", "7"), ("八", "8"), ("九", "9"), ("十", "10")
                  ]
                  for (k, v) in singleDigits {
                      s = s.replacingOccurrences(of: k, with: v)
                  }
                  s = s.replacingOccurrences(of: "点", with: ".")
                  return s
              }

              private func applyVoiceCommand(_ transcript: String) {
                  let text = normalizeChineseNumbers(transcript)
                  var matchedAny = false
                  var lastChanged: DialParameter? = nil

                  // 1. Parse Shutter Speed FIRST ("快门200", "快门速度200分之一秒", "200分之一秒", "1/200")
                  let shutterPatterns = [
                      "(?:快门速度|快门|shutter(?:\\s*speed)?)\\s*(?:1/)?(\\d{2,4})(?:\\s*分之一秒|\\s*秒)?",
                      "(\\d{2,4})\\s*分之一秒?",
                      "1/(\\d{2,4})\\s*秒?"
                  ]
                  for pat in shutterPatterns {
                      if let regex = try? NSRegularExpression(pattern: pat),
                         let match = regex.firstMatch(in: text, range: NSRange(text.startIndex..., in: text)),
                         let r = Range(match.range(at: 1), in: text),
                         let val = Int(text[r]), val >= 10 && val <= 8000 {
                          if let closest = shutterSteps.min(by: { abs($0 - val) < abs($1 - val) }) {
                              shutterDenom = closest
                              selectedParameter = .shutter
                              lastChanged = .shutter
                              matchedAny = true
                              break
                          }
                      }
                  }

                  // 2. Parse Distance ("距离2.5", "2.5米", "3m")
                  if let distRegex = try? NSRegularExpression(pattern: "(?:距离\\s*(\\d+(?:\\.\\d+)?)|(\\d+(?:\\.\\d+)?)\\s*(?:米|m\\b))"),
                     let match = distRegex.firstMatch(in: text, range: NSRange(text.startIndex..., in: text)) {
                      let r1 = Range(match.range(at: 1), in: text)
                      let r2 = Range(match.range(at: 2), in: text)
                      if let str = (r1 != nil ? String(text[r1!]) : (r2 != nil ? String(text[r2!]) : nil)),
                         let val = Double(str), val >= 0.4 && val <= 20.0 {
                          let snapped = max(0.5, min(15.0, round(val * 2.0) / 2.0))
                          distance = snapped
                          selectedParameter = .distance
                          lastChanged = .distance
                          matchedAny = true
                      }
                  }

                  // 3. Parse Aperture ("f3" -> f/3.0, "f/2.8", "光圈3", "光圈 5.6")
                  if let apRegex = try? NSRegularExpression(pattern: "(?:光圈|\\bf\\s*/?\\s*)(\\d+(?:\\.\\d+)?)"),
                     let match = apRegex.firstMatch(in: text, range: NSRange(text.startIndex..., in: text)),
                     let r = Range(match.range(at: 1), in: text),
                     let val = Double(text[r]), val >= 1.0 && val <= 32.0 {
                      let clamped = max(maxLensAperture, min(22.0, val))
                      if let closest = apertureSteps.min(by: { abs($0 - clamped) < abs($1 - clamped) }) {
                          aperture = closest
                          selectedParameter = .aperture
                          lastChanged = .aperture
                          matchedAny = true
                      }
                  }

                  // 4. Parse Flash Power ("全功率", "1/4", "四分之一", "功率 8")
                  if text.contains("全功率") || text.contains("1/1") {
                      manualPowerIndex = 0
                      lockPower = true
                      selectedParameter = .flashPower
                      lastChanged = .flashPower
                      matchedAny = true
                  } else if let pRegex = try? NSRegularExpression(pattern: "(?:1/|功率\\s*(?:1/)?)(\\d{1,3})\\s*(?:分之一)?"),
                            let match = pRegex.firstMatch(in: text, range: NSRange(text.startIndex..., in: text)),
                            let r = Range(match.range(at: 1), in: text),
                            let denomVal = Int(text[r]),
                            let idx = powerDenominators.firstIndex(of: denomVal) {
                      manualPowerIndex = idx
                      lockPower = true
                      selectedParameter = .flashPower
                      lastChanged = .flashPower
                      matchedAny = true
                  } else if let cnPowerRegex = try? NSRegularExpression(pattern: "(2|4|8|16|32|64|128)\\s*分之一(?!秒)"),
                            let match = cnPowerRegex.firstMatch(in: text, range: NSRange(text.startIndex..., in: text)),
                            let r = Range(match.range(at: 1), in: text),
                            let denomVal = Int(text[r]),
                            let idx = powerDenominators.firstIndex(of: denomVal) {
                      manualPowerIndex = idx
                      lockPower = true
                      selectedParameter = .flashPower
                      lastChanged = .flashPower
                      matchedAny = true
                  }

                  // 5. Parse ISO ("iso 400", "感光度 800")
                  if let isoRegex = try? NSRegularExpression(pattern: "(?:iso|感光度)\\s*(\\d{2,4})"),
                     let match = isoRegex.firstMatch(in: text, range: NSRange(text.startIndex..., in: text)),
                     let r = Range(match.range(at: 1), in: text),
                     let val = Double(text[r]),
                     let closest = isoSteps.min(by: { abs($0 - val) < abs($1 - val) }) {
                      filmISO = closest
                      selectedParameter = .iso
                      lastChanged = .iso
                      matchedAny = true
                  }

                  if matchedAny, let changed = lastChanged {
                      lastEditedParameter = changed
                      if lockPower {
                          solveForLockedPower(changed: changed)
                      }
                      WidgetCenter.shared.reloadAllTimelines()
                  }
              }

              private func recordCurrentFrameToLog() {
                  feedback.lockToggleFeedback(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled)
                  let fNum = max(1, min(36, Int(round(currentFrameNumber))))
                  let fmt = DateFormatter()
                  fmt.dateFormat = "HH:mm"
                  let entry = FilmFrameRecord(
                      frameNumber: fNum,
                      aperture: aperture,
                      shutterDenom: shutterDenom,
                      distance: distance,
                      powerLabel: exposureResult.powerTitle,
                      iso: filmISO * pow(2.0, pushPullEV),
                      evComp: exposureCompEV,
                      filterName: filterLabelName,
                      timestamp: fmt.string(from: Date())
                  )
                  var list = rollFrames
                  if let existingIdx = list.firstIndex(where: { $0.frameNumber == fNum }) {
                      list[existingIdx] = entry
                  } else {
                      list.append(entry)
                      list.sort { $0.frameNumber < $1.frameNumber }
                  }
                  saveRollFrames(list)
                  logSavedToast = String(format: "已记录第 #%02d 张 (%@ · 1/%ds · %@)", fNum, formatFStop(aperture), shutterDenom, exposureResult.powerTitle)
                  if fNum < 36 {
                      currentFrameNumber = Double(fNum + 1)
                  }
              }

