                                  }
                              }
                          case .shutter:
                              ForEach(shutterSteps, id: \.self) { s in
                                  let active = (shutterDenom == s)
                                  let fg: Color = active ? Color.black : (s > maxSyncSpeed ? Color.orange : Color.white)
