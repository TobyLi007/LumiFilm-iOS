name: Build Unsigned LumiFilm iOS App (v7.1 - Fixed Xcode 16.4 Compilation & Full v7 Features)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Project, 3D Dynamic Glossy Glass App Icon & SwiftUI Sources
        run: |
          mkdir -p LumiFilmBuild/LumiFilm/Assets.xcassets/AppIcon.appiconset LumiFilmBuild/LumiFilmWidget

          # 1. Create Assets.xcassets Contents.json
          cat << 'EOF' > LumiFilmBuild/LumiFilm/Assets.xcassets/Contents.json
          {
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

          cat << 'EOF' > LumiFilmBuild/LumiFilm/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

          # 2. Generate 1024x1024 3D Dynamic Glossy Liquid-Glass App Icon
          cat << 'EOF' > make_icon.swift
          import AppKit
          import CoreGraphics
          import Darwin

          let size = 1024
          let colorSpace = CGColorSpaceCreateDeviceRGB()
          guard let ctx = CGContext(
              data: nil,
              width: size,
              height: size,
              bitsPerComponent: 8,
              bytesPerRow: 0,
              space: colorSpace,
              bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue
          ) else { exit(1) }

          let center = CGPoint(x: 512.0, y: 512.0)

          // Deep 3D Obsidian & Warm Amber Studio Backdrop
          let bgColors = [
              CGColor(red: 0.03, green: 0.04, blue: 0.08, alpha: 1.0),
              CGColor(red: 0.10, green: 0.07, blue: 0.14, alpha: 1.0),
              CGColor(red: 0.22, green: 0.11, blue: 0.06, alpha: 1.0)
          ] as CFArray
          let bgGrad = CGGradient(colorsSpace: colorSpace, colors: bgColors, locations: [0.0, 0.55, 1.0])!
          ctx.drawLinearGradient(bgGrad, start: CGPoint(x: 100, y: 980), end: CGPoint(x: 924, y: 40), options: [])

          // Dynamic Xenon & Amber radial energy aura
          let auraColors = [
              CGColor(red: 1.0, green: 0.62, blue: 0.18, alpha: 0.65),
              CGColor(red: 0.25, green: 0.78, blue: 1.0, alpha: 0.30),
              CGColor(red: 0.0, green: 0.0, blue: 0.0, alpha: 0.0)
          ] as CFArray
          let auraGrad = CGGradient(colorsSpace: colorSpace, colors: auraColors, locations: [0.0, 0.50, 1.0])!
          ctx.drawRadialGradient(auraGrad, startCenter: CGPoint(x: 512, y: 540), startRadius: 20, endCenter: center, endRadius: 490, options: [])

          // Dynamic Sweeping Light Trails (3D Motion Arcs)
          ctx.saveGState()
          for arcIdx in 0..<6 {
              let radius = CGFloat(355 + arcIdx * 20)
              let startA = Double(arcIdx) * 0.45 + 0.2
              let endA = startA + 1.15
              ctx.addArc(center: center, radius: radius, startAngle: CGFloat(startA), endAngle: CGFloat(endA), clockwise: false)
              ctx.setStrokeColor(arcIdx % 2 == 0
                  ? CGColor(red: 1.0, green: 0.68, blue: 0.24, alpha: 0.55)
                  : CGColor(red: 0.38, green: 0.88, blue: 1.0, alpha: 0.50))
              ctx.setLineWidth(CGFloat(10 - arcIdx))
              ctx.setLineCap(.round)
              ctx.strokePath()
          }
          ctx.restoreGState()

          // Outer 3D Frosted Glass Squircle Block with Deep Bevel
          let glassRect = CGRect(x: 96, y: 96, width: 832, height: 832)
          let glassPath = CGPath(roundedRect: glassRect, cornerWidth: 210, cornerHeight: 210, transform: nil)
          ctx.saveGState()
          ctx.addPath(glassPath)
          ctx.clip()
          let glassColors = [
              CGColor(red: 1.0, green: 1.0, blue: 1.0, alpha: 0.32),
              CGColor(red: 0.85, green: 0.92, blue: 1.0, alpha: 0.12),
              CGColor(red: 0.12, green: 0.10, blue: 0.16, alpha: 0.48),
              CGColor(red: 0.98, green: 0.65, blue: 0.28, alpha: 0.28)
          ] as CFArray
          let glassGrad = CGGradient(colorsSpace: colorSpace, colors: glassColors, locations: [0.0, 0.32, 0.72, 1.0])!
          ctx.drawLinearGradient(glassGrad, start: CGPoint(x: 120, y: 920), end: CGPoint(x: 900, y: 110), options: [])

          // Top Curved Liquid-Glass Specular Highlight Ribbon
          let glossPath = CGMutablePath()
          glossPath.move(to: CGPoint(x: 96, y: 928))
          glossPath.addLine(to: CGPoint(x: 928, y: 928))
          glossPath.addLine(to: CGPoint(x: 928, y: 630))
          glossPath.addQuadCurve(to: CGPoint(x: 96, y: 540), control: CGPoint(x: 490, y: 740))
          glossPath.closeSubpath()
          ctx.addPath(glossPath)
          ctx.clip()
          let specColors = [
              CGColor(red: 1.0, green: 1.0, blue: 1.0, alpha: 0.52),
              CGColor(red: 1.0, green: 1.0, blue: 1.0, alpha: 0.04)
          ] as CFArray
          let specGrad = CGGradient(colorsSpace: colorSpace, colors: specColors, locations: [0.0, 1.0])!
          ctx.drawLinearGradient(specGrad, start: CGPoint(x: 512, y: 928), end: CGPoint(x: 512, y: 540), options: [])
          ctx.restoreGState()

          // Double Specular Glass Rim Borders
          ctx.addPath(glassPath)
          ctx.setStrokeColor(CGColor(red: 1.0, green: 0.92, blue: 0.78, alpha: 0.85))
          ctx.setLineWidth(12)
          ctx.strokePath()

          let innerGlassRect = CGRect(x: 118, y: 118, width: 788, height: 788)
          let innerGlassPath = CGPath(roundedRect: innerGlassRect, cornerWidth: 192, cornerHeight: 192, transform: nil)
          ctx.addPath(innerGlassPath)
          ctx.setStrokeColor(CGColor(red: 0.55, green: 0.90, blue: 1.0, alpha: 0.38))
          ctx.setLineWidth(4)
          ctx.strokePath()

          // Film Perforation Sprocket Strip (Left & Right)
          for xPos in [148, 842] {
              for row in 0..<6 {
                  let hole = CGRect(x: xPos, y: 245 + row * 94, width: 34, height: 54)
                  let holePath = CGPath(roundedRect: hole, cornerWidth: 10, cornerHeight: 10, transform: nil)
                  ctx.addPath(holePath)
                  ctx.setFillColor(CGColor(red: 0.98, green: 0.78, blue: 0.45, alpha: 0.42))
                  ctx.fillPath()
              }
          }

          // 3D Sculpted Leica Brass Rotary Dial Ring
          ctx.saveGState()
          ctx.addArc(center: center, radius: 325, startAngle: 0, endAngle: CGFloat(Double.pi * 2.0), clockwise: false)
          ctx.clip()
          let brassColors = [
              CGColor(red: 1.0, green: 0.86, blue: 0.55, alpha: 1.0),
              CGColor(red: 0.78, green: 0.52, blue: 0.22, alpha: 1.0),
              CGColor(red: 0.22, green: 0.16, blue: 0.12, alpha: 1.0),
              CGColor(red: 0.95, green: 0.75, blue: 0.42, alpha: 1.0)
          ] as CFArray
          let brassGrad = CGGradient(colorsSpace: colorSpace, colors: brassColors, locations: [0.0, 0.35, 0.72, 1.0])!
          ctx.drawLinearGradient(brassGrad, start: CGPoint(x: 200, y: 820), end: CGPoint(x: 820, y: 200), options: [])
          ctx.restoreGState()

          // Inner Dark Obsidian Meter Core
          ctx.addArc(center: center, radius: 274, startAngle: 0, endAngle: CGFloat(Double.pi * 2.0), clockwise: false)
          ctx.setFillColor(CGColor(red: 0.06, green: 0.07, blue: 0.11, alpha: 0.96))
          ctx.fillPath()

          // Dial Knurling & Glowing Scale Ticks
          for i in 0..<36 {
              let angleVal: Double = Double(i) * (Double.pi / 18.0)
              let r1: CGFloat = (i % 3 == 0) ? 236.0 : 254.0
              let r2: CGFloat = 270.0
              let cosA = CGFloat(Darwin.cos(angleVal))
              let sinA = CGFloat(Darwin.sin(angleVal))
              let p1 = CGPoint(x: center.x + cosA * r1, y: center.y + sinA * r1)
              let p2 = CGPoint(x: center.x + cosA * r2, y: center.y + sinA * r2)
              ctx.setStrokeColor(i == 9
                  ? CGColor(red: 1.0, green: 0.38, blue: 0.18, alpha: 1.0)
                  : CGColor(red: 0.98, green: 0.88, blue: 0.68, alpha: 0.88))
              ctx.setLineWidth(i % 3 == 0 ? 7.5 : 3.5)
              ctx.setLineCap(.round)
              ctx.move(to: p1)
              ctx.addLine(to: p2)
              ctx.strokePath()
          }

          // 3D Convex Sapphire Lens Dome in Center
          ctx.saveGState()
          ctx.addArc(center: center, radius: 215, startAngle: 0, endAngle: CGFloat(Double.pi * 2.0), clockwise: false)
          ctx.clip()
          let domeColors = [
              CGColor(red: 0.22, green: 0.65, blue: 0.98, alpha: 0.55),
              CGColor(red: 0.08, green: 0.12, blue: 0.24, alpha: 0.88),
              CGColor(red: 0.98, green: 0.48, blue: 0.15, alpha: 0.52)
          ] as CFArray
          let domeGrad = CGGradient(colorsSpace: colorSpace, colors: domeColors, locations: [0.0, 0.55, 1.0])!
          ctx.drawRadialGradient(domeGrad, startCenter: CGPoint(x: 445, y: 595), startRadius: 15, endCenter: center, endRadius: 225, options: [])

          // Lens Specular Crescent Reflection
          ctx.addArc(center: CGPoint(x: 455, y: 585), radius: 135, startAngle: 0.35, endAngle: 2.45, clockwise: false)
          ctx.setStrokeColor(CGColor(red: 1.0, green: 1.0, blue: 1.0, alpha: 0.65))
          ctx.setLineWidth(18)
          ctx.setLineCap(.round)
          ctx.strokePath()
          ctx.restoreGState()

          // Dynamic 3D Flash Lightning Bolt Bursting Through the Dome
          let bolt = CGMutablePath()
          bolt.move(to: CGPoint(x: 560, y: 760))
          bolt.addLine(to: CGPoint(x: 382, y: 515))
          bolt.addLine(to: CGPoint(x: 510, y: 515))
          bolt.addLine(to: CGPoint(x: 452, y: 264))
          bolt.addLine(to: CGPoint(x: 652, y: 525))
          bolt.addLine(to: CGPoint(x: 522, y: 525))
          bolt.closeSubpath()

          // Outer Neon Amber Glow for Lightning Bolt
          ctx.saveGState()
          ctx.setShadow(offset: CGSize(width: 0, height: 0), blur: 42, color: CGColor(red: 1.0, green: 0.65, blue: 0.18, alpha: 1.0))
          ctx.addPath(bolt)
          ctx.setFillColor(CGColor(red: 1.0, green: 0.85, blue: 0.35, alpha: 1.0))
          ctx.fillPath()
          ctx.restoreGState()

          // Lightning Bolt Gradient Core
          ctx.saveGState()
          ctx.addPath(bolt)
          ctx.clip()
          let boltColors = [
              CGColor(red: 1.0, green: 1.0, blue: 1.0, alpha: 1.0),
              CGColor(red: 1.0, green: 0.86, blue: 0.38, alpha: 1.0),
              CGColor(red: 1.0, green: 0.45, blue: 0.12, alpha: 1.0)
          ] as CFArray
          let boltGrad = CGGradient(colorsSpace: colorSpace, colors: boltColors, locations: [0.0, 0.55, 1.0])!
          ctx.drawLinearGradient(boltGrad, start: CGPoint(x: 460, y: 760), end: CGPoint(x: 560, y: 264), options: [])
          ctx.restoreGState()

          ctx.addPath(bolt)
          ctx.setStrokeColor(CGColor(red: 1.0, green: 1.0, blue: 1.0, alpha: 0.95))
          ctx.setLineWidth(6)
          ctx.strokePath()

          if let cgImg = ctx.makeImage() {
              let rep = NSBitmapImageRep(cgImage: cgImg)
              if let pngData = rep.representation(using: .png, properties: [:]) {
                  try? pngData.write(to: URL(fileURLWithPath: "LumiFilmBuild/LumiFilm/Assets.xcassets/AppIcon.appiconset/AppIcon.png"))
              }
          }
          EOF
          swift make_icon.swift

          # 3. Create XcodeGen project.yml with Speech & Microphone Privacy Descriptions & Swift 5 Mode
          cat << 'EOF' > LumiFilmBuild/project.yml
          name: LumiFilm
          options:
            bundleIdPrefix: com.lumifilm
            deploymentTarget:
              iOS: "17.0"
          targets:
            LumiFilm:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: LumiFilm
              dependencies:
                - target: LumiFilmWidget
                  embed: true
              settings:
                base:
                  SWIFT_VERSION: "5.0"
                  SWIFT_STRICT_CONCURRENCY: minimal
                  PRODUCT_BUNDLE_IDENTIFIER: com.lumifilm.flashmeter
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
                  INFOPLIST_KEY_CFBundleDisplayName: LumiFilm
                  INFOPLIST_KEY_NSMicrophoneUsageDescription: "LumiFilm 使用麦克风接收您的语音指令（如：光圈f3、快门200、距离2.5米），直接调节胶片闪光参数。"
                  INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "LumiFilm 使用语音识别将您说出的曝光参数实时转换为转盘与状态栏数值。"
                  MARKETING_VERSION: "7.1.0"
                  CURRENT_PROJECT_VERSION: "71"
                  GENERATE_INFOPLIST_FILE: YES
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
            LumiFilmWidget:
              type: app-extension
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: LumiFilmWidget
              settings:
                base:
                  SWIFT_VERSION: "5.0"
                  SWIFT_STRICT_CONCURRENCY: minimal
                  PRODUCT_BUNDLE_IDENTIFIER: com.lumifilm.flashmeter.widget
                  INFOPLIST_KEY_CFBundleDisplayName: LumiFilmWidget
                  MARKETING_VERSION: "7.1.0"
                  CURRENT_PROJECT_VERSION: "71"
                  GENERATE_INFOPLIST_FILE: YES
              info:
                path: LumiFilmWidget/Info.plist
                properties:
                  CFBundleShortVersionString: "7.1.0"
                  CFBundleVersion: "71"
                  NSExtension:
                    NSExtensionPointIdentifier: com.apple.widgetkit-extension
          EOF

          # 4. Create LumiFilmWidget.swift (Adopting iOS 17 containerBackground API + Interactive AppIntents)
          cat << 'EOF' > LumiFilmBuild/LumiFilmWidget/LumiFilmWidget.swift
          import WidgetKit
          import SwiftUI
          import AppIntents

          struct FlashCalculator {
              static func powerLabel(gnAt100: Double, iso: Double, distance: Double, aperture: Double, lossEV: Double) -> (String, String) {
                  let isoFactor = sqrt(max(iso, 25.0) / 100.0)
                  let effectiveGN = gnAt100 * isoFactor * pow(2.0, -lossEV / 2.0)
                  let fullPowerAperture = effectiveGN / max(distance, 0.3)
                  let ratio = aperture / max(fullPowerAperture, 0.1)
                  let power = ratio * ratio
                  if power > 1.05 { return ("OVER (>1/1)", "Move closer / Open f/") }
                  if power < (1.0 / 256.0) { return ("LOW (<1/128)", "Step back / Stop down") }
                  let stops = round(log2(1.0 / max(power, 0.001)) * 3.0) / 3.0
                  let whole = Int(floor(stops + 0.05))
                  let rem = stops - Double(whole)
                  let denom = Int(pow(2.0, Double(max(0, min(7, whole)))))
                  let fracStr = denom == 1 ? "1/1" : "1/\(denom)"
                  if abs(rem) < 0.15 { return (fracStr, "Exact Manual Step") }
                  return (String(format: "%@ %+.1fEV", fracStr, -rem), "Fine Power Trim")
              }
          }

          @available(iOS 17.0, *)
          struct AdjustApertureIntent: AppIntent {
              static var title: LocalizedStringResource = "Adjust Aperture"
              @Parameter(title: "Delta") var delta: Double
              init() { self.delta = 0 }
              init(delta: Double) { self.delta = delta }
              func perform() async throws -> some IntentResult {
                  let defaults = UserDefaults.standard
                  let cur = defaults.double(forKey: "lf_aperture") == 0 ? 4.0 : defaults.double(forKey: "lf_aperture")
                  let maxOpen = defaults.double(forKey: "lf_max_aperture") == 0 ? 1.4 : defaults.double(forKey: "lf_max_aperture")
                  let steps: [Double] = [1.2, 1.4, 1.8, 2.0, 2.4, 2.8, 3.0, 3.2, 3.5, 4.0, 4.8, 5.6, 6.7, 8.0, 9.5, 11.0, 13.0, 16.0, 22.0].filter { $0 >= maxOpen - 0.01 }
                  if let idx = steps.enumerated().min(by: { abs($0.element - cur) < abs($1.element - cur) })?.offset {
                      let nextIdx = max(0, min(steps.count - 1, idx + (delta > 0 ? 1 : -1)))
                      defaults.set(steps[nextIdx], forKey: "lf_aperture")
                  }
                  return .result()
              }
          }

          @available(iOS 17.0, *)
          struct AdjustDistanceIntent: AppIntent {
              static var title: LocalizedStringResource = "Adjust Distance"
              @Parameter(title: "Delta") var delta: Double
              init() { self.delta = 0 }
              init(delta: Double) { self.delta = delta }
              func perform() async throws -> some IntentResult {
                  let defaults = UserDefaults.standard
                  let cur = defaults.double(forKey: "lf_distance") == 0 ? 2.0 : defaults.double(forKey: "lf_distance")
                  let next = max(0.5, min(15.0, (round((cur + delta) * 2.0) / 2.0)))
                  defaults.set(next, forKey: "lf_distance")
                  return .result()
              }
          }

          struct LumiFilmEntry: TimelineEntry {
              let date: Date
              let iso: Double
              let gn: Double
              let distance: Double
              let aperture: Double
              let powerText: String
              let noteText: String
          }

          struct LumiFilmProvider: TimelineProvider {
              func placeholder(in context: Context) -> LumiFilmEntry {
                  LumiFilmEntry(date: Date(), iso: 400, gn: 36, distance: 2.0, aperture: 5.6, powerText: "1/4", noteText: "Exact Manual Step")
              }
              func getSnapshot(in context: Context, completion: @escaping (LumiFilmEntry) -> Void) {
                  completion(loadEntry())
              }
              func getTimeline(in context: Context, completion: @escaping (Timeline<LumiFilmEntry>) -> Void) {
                  let entry = loadEntry()
                  completion(Timeline(entries: [entry], policy: .after(Date().addingTimeInterval(900))))
              }
              private func loadEntry() -> LumiFilmEntry {
                  let d = UserDefaults.standard
                  let iso = d.double(forKey: "lf_iso") == 0 ? 400 : d.double(forKey: "lf_iso")
                  let gn = d.double(forKey: "lf_gn") == 0 ? 36 : d.double(forKey: "lf_gn")
                  let dist = d.double(forKey: "lf_distance") == 0 ? 2.0 : d.double(forKey: "lf_distance")
                  let ap = d.double(forKey: "lf_aperture") == 0 ? 5.6 : d.double(forKey: "lf_aperture")
                  let res = FlashCalculator.powerLabel(gnAt100: gn, iso: iso, distance: dist, aperture: ap, lossEV: 0.0)
                  return LumiFilmEntry(date: Date(), iso: iso, gn: gn, distance: dist, aperture: ap, powerText: res.0, noteText: res.1)
              }
          }

          struct LumiFilmWidgetEntryView: View {
              var entry: LumiFilmProvider.Entry

              var body: some View {
                  VStack(alignment: .leading, spacing: 6) {
                      HStack {
                          Image(systemName: "bolt.circle.fill")
                              .foregroundStyle(Color.orange)
                          Text("LUMIFILM")
                              .font(.system(size: 10, weight: .black, design: .monospaced))
                              .foregroundStyle(Color.white.opacity(0.85))
                          Spacer()
                          Text("ISO \(Int(entry.iso))")
                              .font(.system(size: 10, weight: .bold, design: .monospaced))
                              .foregroundStyle(Color.orange)
                      }

                      VStack(alignment: .leading, spacing: 1) {
                          Text("FLASH POWER")
                              .font(.system(size: 8, weight: .bold, design: .monospaced))
                              .foregroundStyle(Color.white.opacity(0.5))
                          Text(entry.powerText)
                              .font(.system(size: 20, weight: .black, design: .rounded))
                              .foregroundStyle(Color.white)
                              .minimumScaleFactor(0.6)
                              .lineLimit(1)
                      }
                      .padding(.vertical, 2)

                      HStack(spacing: 6) {
                          if #available(iOSApplicationExtension 17.0, *) {
                              Button(intent: AdjustApertureIntent(delta: -1)) {
                                  Text("f/-")
                                      .font(.system(size: 10, weight: .bold, design: .monospaced))
                                      .frame(maxWidth: .infinity)
                                      .padding(.vertical, 4)
                                      .background(Color.white.opacity(0.14))
                                      .clipShape(RoundedRectangle(cornerRadius: 6))
                              }
                              .buttonStyle(.plain)

                              Text(String(format: "f/%.1f", entry.aperture))
                                  .font(.system(size: 11, weight: .bold, design: .monospaced))
                                  .foregroundStyle(Color.orange)

                              Button(intent: AdjustApertureIntent(delta: 1)) {
                                  Text("f/+")
                                      .font(.system(size: 10, weight: .bold, design: .monospaced))
                                      .frame(maxWidth: .infinity)
                                      .padding(.vertical, 4)
                                      .background(Color.white.opacity(0.14))
                                      .clipShape(RoundedRectangle(cornerRadius: 6))
                              }
                              .buttonStyle(.plain)
                          } else {
                              Text(String(format: "f/%.1f", entry.aperture))
                                  .font(.system(size: 11, weight: .bold, design: .monospaced))
                                  .foregroundStyle(Color.orange)
                          }
                      }

                      HStack(spacing: 6) {
                          if #available(iOSApplicationExtension 17.0, *) {
                              Button(intent: AdjustDistanceIntent(delta: -0.5)) {
                                  Text("-0.5m")
                                      .font(.system(size: 9, weight: .bold, design: .monospaced))
                                      .frame(maxWidth: .infinity)
                                      .padding(.vertical, 4)
                                      .background(Color.white.opacity(0.14))
                                      .clipShape(RoundedRectangle(cornerRadius: 6))
                              }
                              .buttonStyle(.plain)

                              Text(String(format: "%.1fm", entry.distance))
                                  .font(.system(size: 11, weight: .bold, design: .monospaced))
                                  .foregroundStyle(Color.cyan)

                              Button(intent: AdjustDistanceIntent(delta: 0.5)) {
                                  Text("+0.5m")
                                      .font(.system(size: 9, weight: .bold, design: .monospaced))
                                      .frame(maxWidth: .infinity)
                                      .padding(.vertical, 4)
                                      .background(Color.white.opacity(0.14))
                                      .clipShape(RoundedRectangle(cornerRadius: 6))
                              }
                              .buttonStyle(.plain)
                          } else {
                              Text(String(format: "%.1fm", entry.distance))
                                  .font(.system(size: 11, weight: .bold, design: .monospaced))
                                  .foregroundStyle(Color.cyan)
                          }
                      }
                  }
                  .foregroundStyle(Color.white)
                  .containerBackground(for: .widget) {
                      LinearGradient(
                          colors: [
                              Color(red: 0.08, green: 0.08, blue: 0.11),
                              Color(red: 0.16, green: 0.12, blue: 0.10),
                              Color(red: 0.25, green: 0.16, blue: 0.09)
                          ],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                  }
              }
          }

          @main
          struct LumiFilmWidget: Widget {
              let kind: String = "LumiFilmWidget"
              var body: some WidgetConfiguration {
                  StaticConfiguration(kind: kind, provider: LumiFilmProvider()) { entry in
                      LumiFilmWidgetEntryView(entry: entry)
                  }
                  .configurationDisplayName("LumiFilm Flash Meter")
                  .description("Interactive film flash power calculator & quick parameter control.")
                  .supportedFamilies([.systemSmall, .systemMedium])
              }
          }
          EOF

          # 5. Create Main LumiFilmApp.swift (v7.1 Modular Views, Strict Color Types & Thread-Safe Audio Tap)
          cat << 'EOF' > LumiFilmBuild/LumiFilm/LumiFilmApp.swift
          import SwiftUI
          import AVFoundation
          import AudioToolbox
          import UIKit
          import WidgetKit
          import Speech

          @main
          struct LumiFilmApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
