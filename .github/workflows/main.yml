                              .padding(.top, 4)

                              isoSetupCard
                              apertureLimitSetupCard
                              gnAndSyncSetupCard
                              themeSetupCard

                              Button {
                                  if aperture < maxLensAperture {
                                      aperture = maxLensAperture
