          # 5. Generate LumiFilmWidget.swift (Fixes "please adopt containerBackground API" on iOS 17/18/19+ and adds Interactive Distance/Aperture Buttons!)
          cat << 'EOF' > LumiFilmWidget/LumiFilmWidget.swift
          import WidgetKit
          import SwiftUI
          import AppIntents

          struct LumiFilmWidgetEntry: TimelineEntry {
              let date: Date
              let flashTitle: String
              let gn: Int
              let iso: Int
              let distanceM: Double
              let aperture: Double
              let recommendedPower: String
              let shutterDenom: Int
          }

          struct StepWidgetDistanceIntent: AppIntent {
              static var title: LocalizedStringResource = "调节拍摄距离"
              @Parameter(title: "Delta")
              var delta: Double

              init() { self.delta = 0.5 }
              init(delta: Double) { self.delta = delta }

              func perform() async throws -> some IntentResult {
                  let defaults = UserDefaults.standard
                  let cur = defaults.double(forKey: "lf_distance_m")
                  let base = cur > 0.1 ? cur : 2.0
                  let next = min(max(((base + delta) * 10).rounded() / 10, 0.5), 10.0)
                  defaults.set(next, forKey: "lf_distance_m")
                  WidgetCenter.shared.reloadAllTimelines()
                  return .result()
              }
          }

          struct StepWidgetApertureIntent: AppIntent {
              static var title: LocalizedStringResource = "切换光圈档位"

              init() {}

              func perform() async throws -> some IntentResult {
                  let defaults = UserDefaults.standard
                  let steps: [Double] = [2.0, 2.8, 4.0, 5.6, 8.0, 11.0]
                  let cur = defaults.double(forKey: "lf_aperture")
                  let currentF = cur > 0.5 ? cur : 4.0
                  let idx = steps.firstIndex(where: { abs($0 - currentF) < 0.2 }) ?? 2
                  let nextF = steps[(idx + 1) % steps.count]
                  defaults.set(nextF, forKey: "lf_aperture")
                  WidgetCenter.shared.reloadAllTimelines()
                  return .result()
              }
          }

          struct LumiFilmWidgetProvider: TimelineProvider {
              func loadEntry() -> LumiFilmWidgetEntry {
                  let d = UserDefaults.standard
                  let isCustom = d.bool(forKey: "lf_is_custom_gn")
                  let customGN = d.double(forKey: "lf_custom_gn_val")
                  let gnVal = isCustom ? (customGN > 0 ? Int(customGN) : 36) : 36
                  let title = isCustom ? "用户自定义" : "Godox V350"
                  let isoVal = d.integer(forKey: "lf_iso") > 0 ? d.integer(forKey: "lf_iso") : 400
                  let dist = d.double(forKey: "lf_distance_m") > 0.1 ? d.double(forKey: "lf_distance_m") : 2.0
                  let ap = d.double(forKey: "lf_aperture") > 0.5 ? d.double(forKey: "lf_aperture") : 4.0

                  let fullEffGN = Double(gnVal) * 0.78 * sqrt(Double(isoVal) / 100.0)
                  let reqRatio = pow((ap * dist) / max(fullEffGN, 0.1), 2.0)
                  let rawStops = min(max(log2(max(reqRatio, 1e-6)), -7.0), 0.0)
                  let whole = floor((rawStops * 3.0).rounded() / 3.0 + 1e-6)
                  let denom = Int(pow(2.0, -whole).rounded())
                  let pText = "1/\(denom)"

                  return LumiFilmWidgetEntry(
                      date: Date(),
                      flashTitle: title,
                      gn: gnVal,
                      iso: isoVal,
                      distanceM: dist,
                      aperture: ap,
                      recommendedPower: pText,
                      shutterDenom: 125
                  )
              }

              func placeholder(in context: Context) -> LumiFilmWidgetEntry {
                  loadEntry()
              }
              func getSnapshot(in context: Context, completion: @escaping (LumiFilmWidgetEntry) -> Void) {
                  completion(loadEntry())
              }
              func getTimeline(in context: Context, completion: @escaping (Timeline<LumiFilmWidgetEntry>) -> Void) {
                  let entry = loadEntry()
                  let timeline = Timeline(entries: [entry], policy: .after(Date().addingTimeInterval(900)))
                  completion(timeline)
              }
          }

          struct LumiFilmWidgetEntryView: View {
              var entry: LumiFilmWidgetProvider.Entry

              var body: some View {
                  VStack(alignment: .leading, spacing: 6) {
                      HStack {
                          Text("🎞️ \(entry.flashTitle) · GN\(entry.gn)")
                              .font(.system(size: 10, weight: .bold, design: .monospaced))
                              .foregroundStyle(Color(red: 0.90, green: 0.72, blue: 0.42))
                          Spacer()
                          Text("ISO \(entry.iso)")
                              .font(.system(size: 10, weight: .bold, design: .monospaced))
                              .foregroundStyle(.white.opacity(0.75))
                      }

                      HStack(alignment: .firstTextBaseline, spacing: 6) {
                          Text("⚡ \(entry.recommendedPower)")
                              .font(.system(size: 26, weight: .heavy, design: .monospaced))
                              .foregroundStyle(Color(red: 1.0, green: 0.58, blue: 0.28))
                          Spacer()
                          Text("1/\(entry.shutterDenom)s")
                              .font(.system(size: 11, weight: .semibold, design: .monospaced))
                              .foregroundStyle(.white.opacity(0.75))
                      }

                      Spacer(minLength: 0)

                      // Interactive Quick Parameter Adjustment Buttons right on the Home Screen Widget!
                      HStack(spacing: 6) {
                          Button(intent: StepWidgetDistanceIntent(delta: -0.5)) {
                              Text("−0.5m")
                                  .font(.system(size: 10, weight: .bold, design: .monospaced))
                                  .padding(.horizontal, 6)
                                  .padding(.vertical, 4)
                                  .background(Color.white.opacity(0.15), in: Capsule())
                          }
                          .buttonStyle(.plain)

                          Text(String(format: "%.1fm", entry.distanceM))
                              .font(.system(size: 11, weight: .bold, design: .monospaced))
                              .foregroundStyle(.white)

                          Button(intent: StepWidgetDistanceIntent(delta: 0.5)) {
                              Text("+0.5m")
                                  .font(.system(size: 10, weight: .bold, design: .monospaced))
                                  .padding(.horizontal, 6)
                                  .padding(.vertical, 4)
                                  .background(Color.white.opacity(0.15), in: Capsule())
                          }
                          .buttonStyle(.plain)

                          Spacer()

                          Button(intent: StepWidgetApertureIntent()) {
                              Text(String(format: "f/%.1f ↻", entry.aperture).replacingOccurrences(of: ".0", with: ""))
                                  .font(.system(size: 10, weight: .bold, design: .monospaced))
                                  .foregroundStyle(.black)
                                  .padding(.horizontal, 8)
                                  .padding(.vertical, 4)
                                  .background(Color(red: 0.90, green: 0.72, blue: 0.42), in: Capsule())
                          }
                          .buttonStyle(.plain)
                      }
                      .foregroundStyle(.white)
                  }
                  .widgetBackground()
              }
          }

          extension View {
              @ViewBuilder
              func widgetBackground() -> some View {
                  let bg = LinearGradient(
                      colors: [
                          Color(red: 0.14, green: 0.11, blue: 0.09),
                          Color(red: 0.24, green: 0.18, blue: 0.13)
                      ],
                      startPoint: .topLeading,
                      endPoint: .bottomTrailing
                  )
                  if #available(iOSApplicationExtension 17.0, *) {
                      self.containerBackground(for: .widget) {
                          bg
                      }
                  } else {
                      self.padding(12).background(bg)
                  }
              }
          }

          @main
          struct LumiFilmWidget: Widget {
              let kind: String = "LumiFilmWidget"
              var body: some WidgetConfiguration {
                  StaticConfiguration(kind: kind, provider: LumiFilmWidgetProvider()) { entry in
                      LumiFilmWidgetEntryView(entry: entry)
                  }
                  .configurationDisplayName("LumiFilm 胶片闪光速算")
                  .description("桌面直接点按调节拍摄距离与光圈，实时显示推荐闪光灯功率比。")
                  .supportedFamilies([.systemSmall, .systemMedium])
              }
          }
          EOF

      - name: Install XcodeGen & Build Unsigned IPA
        run: |
          cd LumiFilmBuild
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild clean build \
            -project LumiFilm.xcodeproj \
            -scheme LumiFilm \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build_output/Build/Products/Release-iphoneos/LumiFilm.app Payload/
          # Stamp CFBundleVersion and CFBundleShortVersionString into both Main App and Widget Extension Info.plist so Sideloadly installs both cleanly
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 5.0.0" Payload/LumiFilm.app/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 5.0.0" Payload/LumiFilm.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 50" Payload/LumiFilm.app/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 50" Payload/LumiFilm.app/Info.plist
          if [ -f "Payload/LumiFilm.app/PlugIns/LumiFilmWidget.appex/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 5.0.0" Payload/LumiFilm.app/PlugIns/LumiFilmWidget.appex/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 5.0.0" Payload/LumiFilm.app/PlugIns/LumiFilmWidget.appex/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 50" Payload/LumiFilm.app/PlugIns/LumiFilmWidget.appex/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 50" Payload/LumiFilm.app/PlugIns/LumiFilmWidget.appex/Info.plist
          fi
          zip -r9 ../LumiFilm_Native_v5.0_Unsigned.ipa Payload

      - name: Upload Native iOS IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: LumiFilm_Native_iOS_IPA
          path: LumiFilm_Native_v5.0_Unsigned.ipa
