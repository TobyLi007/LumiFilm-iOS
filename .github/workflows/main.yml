              private func stepSelectedParameter(by delta: Int) {
                  lastEditedParameter = selectedParameter
                  switch selectedParameter {
                  case .aperture:
                      guard !lockAperture else {
                          feedback.lockToggleFeedback(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled)
                          return
                      }
                      let steps = apertureSteps
                      if let idx = steps.enumerated().min(by: { abs($0.element - aperture) < abs($1.element - aperture) })?.offset {
                          let next = max(0, min(steps.count - 1, idx + delta))
                          if next != idx {
                              aperture = steps[next]
                              feedback.dialTick(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled)
                              if lockPower { solveForLockedPower(changed: .aperture) }
                          }
                      }
                  case .distance:
                      guard !lockDistance else {
                          feedback.lockToggleFeedback(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled)
                          return
                      }
                      let currentSnapped = round(distance * 2.0) / 2.0
                      let next = max(0.5, min(15.0, currentSnapped + Double(delta) * 0.5))
                      if abs(next - distance) > 0.01 {
                          distance = next
                          feedback.dialTick(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled, magneticSnap: true)
                          if lockPower { solveForLockedPower(changed: .distance) }
                      }
                  case .shutter:
                      guard !lockShutter else {
                          feedback.lockToggleFeedback(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled)
                          return
                      }
                      if let idx = shutterSteps.firstIndex(of: shutterDenom) {
                          let next = max(0, min(shutterSteps.count - 1, idx + delta))
                          if next != idx {
                              shutterDenom = shutterSteps[next]
                              feedback.dialTick(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled, magneticSnap: shutterDenom == maxSyncSpeed)
                              if lockPower { solveForLockedPower(changed: .shutter) }
                          }
                      } else {
                          shutterDenom = 125
                      }
                  case .flashPower:
                      lockPower = true
                      let next = max(0, min(powerDenominators.count - 1, manualPowerIndex + delta))
                      if next != manualPowerIndex {
                          manualPowerIndex = next
                          feedback.dialTick(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled, magneticSnap: true)
                          solveForLockedPower(changed: .flashPower)
                      }
                  case .iso:
                      guard !lockISO else {
                          feedback.lockToggleFeedback(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled)
                          return
                      }
                      if let idx = isoSteps.enumerated().min(by: { abs($0.element - filmISO) < abs($1.element - filmISO) })?.offset {
                          let next = max(0, min(isoSteps.count - 1, idx + delta))
                          if next != idx {
                              filmISO = isoSteps[next]
                              feedback.dialTick(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled)
                              if lockPower { solveForLockedPower(changed: .iso) }
                          }
                      }
                  case .flashGN:
                      if let idx = gnSteps.enumerated().min(by: { abs($0.element - flashGN) < abs($1.element - flashGN) })?.offset {
                          let next = max(0, min(gnSteps.count - 1, idx + delta))
                          if next != idx {
                              flashGN = gnSteps[next]
                              feedback.dialTick(soundEnabled: soundEnabled, hapticEnabled: hapticEnabled)
                              if lockPower { solveForLockedPower(changed: .flashGN) }
                          }
                      }
                  }
              }

