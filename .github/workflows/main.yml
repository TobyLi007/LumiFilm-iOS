          // MARK: - Sound, Haptics & Speech Engine (With Auto-Stop Silence Timer)
          final class FeedbackEngine: NSObject, ObservableObject, AVSpeechSynthesizerDelegate {
              static let shared = FeedbackEngine()
              private let synthesizer = AVSpeechSynthesizer()
              private let impactLight = UIImpactFeedbackGenerator(style: .light)
              private let impactMedium = UIImpactFeedbackGenerator(style: .medium)
              private let impactRigid = UIImpactFeedbackGenerator(style: .rigid)
              private let selectionGen = UISelectionFeedbackGenerator()
              private let notifyGen = UINotificationFeedbackGenerator()

              @Published var isSpeaking: Bool = false
              @Published var isListening: Bool = false
              @Published var recognizedTranscript: String = ""
              @Published var voiceStatusHint: String = ""
              @Published var activeVoiceQualityLabel: String = "Enhanced Voice"

              private var recognitionRequest: SFSpeechAudioBufferRecognitionRequest?
              private var recognitionTask: SFSpeechRecognitionTask?
              private let audioEngine = AVAudioEngine()
              private var onCommandRecognized: ((String) -> Void)?
              private var silenceTimerWorkItem: DispatchWorkItem?
              private var currentLanguage: AppLanguage = .zh

              override init() {
                  super.init()
                  synthesizer.delegate = self
                  impactLight.prepare()
                  impactMedium.prepare()
                  impactRigid.prepare()
                  selectionGen.prepare()
                  refreshVoiceQualityStatus(persona: .magneticMale, lang: .zh)
              }

              func dialTick(soundEnabled: Bool, hapticEnabled: Bool, magneticSnap: Bool = false) {
                  if hapticEnabled {
                      if magneticSnap {
                          impactRigid.impactOccurred(intensity: 1.0)
                      } else {
                          impactLight.impactOccurred(intensity: 0.75)
                      }
                  }
                  if soundEnabled {
                      AudioServicesPlaySystemSound(magneticSnap ? 1156 : 1157)
                  }
              }

              func buttonTap(soundEnabled: Bool, hapticEnabled: Bool) {
                  if hapticEnabled {
                      impactMedium.impactOccurred()
                  }
                  if soundEnabled {
                      AudioServicesPlaySystemSound(1104)
                  }
              }

              func lockToggleFeedback(soundEnabled: Bool, hapticEnabled: Bool) {
                  if hapticEnabled {
                      notifyGen.notificationOccurred(.success)
                  }
                  if soundEnabled {
                      AudioServicesPlaySystemSound(1113)
                  }
              }

              private func voiceMatchesPersona(_ voice: AVSpeechSynthesisVoice, persona: VoicePersona) -> Bool {
                  let targetGender: AVSpeechSynthesisVoiceGender = (persona == .magneticMale) ? .male : .female
                  if voice.gender == targetGender {
                      return true
                  }
                  let lowerName = voice.name.lowercased()
                  let lowerId = voice.identifier.lowercased()
                  let keywords: [String] = (persona == .magneticMale)
                      ? ["yunxi", "kangkang", "li-mu", "limu", "yushu", "male", "daniel", "aaron", "arthur", "gordon"]
                      : ["xiaoxiao", "tingting", "ting-ting", "meijia", "mei-jia", "sin-ji", "sinji", "shasha", "lili", "female", "siri", "samantha", "ava", "allison"]
                  for kw in keywords {
                      if lowerName.contains(kw) || lowerId.contains(kw) {
                          return true
                      }
                  }
                  return false
              }

              private func selectBestHumanVoice(for persona: VoicePersona, lang: AppLanguage) -> (AVSpeechSynthesisVoice?, String) {
                  let allVoices = AVSpeechSynthesisVoice.speechVoices()
                  let prefix = (lang == .en) ? "en" : "zh"
                  let langVoices = allVoices.filter { $0.language.lowercased().hasPrefix(prefix) }

                  let sortedVoices = langVoices.sorted { a, b in
                      if a.quality.rawValue != b.quality.rawValue {
                          return a.quality.rawValue > b.quality.rawValue
                      }
                      let aPref = (lang == .en ? a.language.lowercased().contains("us") : a.language.lowercased().contains("cn")) ? 1 : 0
                      let bPref = (lang == .en ? b.language.lowercased().contains("us") : b.language.lowercased().contains("cn")) ? 1 : 0
                      return aPref > bPref
                  }

                  for v in sortedVoices {
                      if v.quality.rawValue >= AVSpeechSynthesisVoiceQuality.enhanced.rawValue && voiceMatchesPersona(v, persona: persona) {
                          let badge = v.quality == .premium ? "Premium (\(v.name))" : "Enhanced (\(v.name))"
                          return (v, badge)
                      }
                  }

                  for v in sortedVoices {
                      if voiceMatchesPersona(v, persona: persona) {
                          return (v, v.name)
                      }
                  }

                  if let bestAvailable = sortedVoices.first {
                      return (bestAvailable, bestAvailable.name)
                  }
                  return (AVSpeechSynthesisVoice(language: lang.localeIdentifier), lang == .en ? "System English" : "系统语音")
              }

              func refreshVoiceQualityStatus(persona: VoicePersona = .magneticMale, lang: AppLanguage = .zh) {
                  self.currentLanguage = lang
                  let (_, label) = selectBestHumanVoice(for: persona, lang: lang)
                  activeVoiceQualityLabel = label
              }

              func toggleSpeakExposure(_ text: String, soundEnabled: Bool, persona: VoicePersona, lang: AppLanguage) {
                  guard soundEnabled else { return }
                  if synthesizer.isSpeaking || isSpeaking {
                      synthesizer.stopSpeaking(at: .immediate)
                      isSpeaking = false
                      return
                  }
                  if isListening {
                      stopListening()
                  }
                  let session = AVAudioSession.sharedInstance()
                  try? session.setCategory(.playback, mode: .spokenAudio, options: [.duckOthers])
                  try? session.setActive(true)

                  let utterance = AVSpeechUtterance(string: text)
                  let (selectedVoice, badgeLabel) = selectBestHumanVoice(for: persona, lang: lang)
                  activeVoiceQualityLabel = badgeLabel
                  utterance.voice = selectedVoice

                  let isHighQuality = (selectedVoice?.quality.rawValue ?? 1) >= AVSpeechSynthesisVoiceQuality.enhanced.rawValue
                  if isHighQuality {
                      switch persona {
                      case .magneticMale:
                          utterance.pitchMultiplier = 0.95
                          utterance.rate = 0.49
                      case .gentleFemale:
                          utterance.pitchMultiplier = 1.03
                          utterance.rate = 0.50
                      }
                  } else {
                      utterance.pitchMultiplier = persona.pitch
                      utterance.rate = persona.rate
                  }
                  utterance.preUtteranceDelay = 0.03
                  utterance.postUtteranceDelay = 0.06

                  isSpeaking = true
                  synthesizer.speak(utterance)
              }

              func speechSynthesizer(_ synthesizer: AVSpeechSynthesizer, didFinish utterance: AVSpeechUtterance) {
                  DispatchQueue.main.async {
                      FeedbackEngine.shared.isSpeaking = false
                  }
              }

              func speechSynthesizer(_ synthesizer: AVSpeechSynthesizer, didCancel utterance: AVSpeechUtterance) {
                  DispatchQueue.main.async {
                      FeedbackEngine.shared.isSpeaking = false
                  }
              }

              // Schedule Auto-Stop Timer so Mic automatically stops after silence
              private func scheduleSilenceAutoStop(after seconds: Double) {
                  silenceTimerWorkItem?.cancel()
                  let work = DispatchWorkItem {
                      if FeedbackEngine.shared.isListening {
                          FeedbackEngine.shared.stopListening()
                      }
                  }
                  silenceTimerWorkItem = work
                  DispatchQueue.main.asyncAfter(deadline: .now() + seconds, execute: work)
              }

              func toggleVoiceListening(lang: AppLanguage, onRecognized: @escaping (String) -> Void) {
                  self.currentLanguage = lang
                  if isListening {
                      stopListening()
                      return
                  }
                  if synthesizer.isSpeaking {
                      synthesizer.stopSpeaking(at: .immediate)
                      isSpeaking = false
                  }
                  self.onCommandRecognized = onRecognized

                  SFSpeechRecognizer.requestAuthorization { authStatus in
                      DispatchQueue.main.async {
                          switch authStatus {
                          case .authorized:
                              AVAudioSession.sharedInstance().requestRecordPermission { granted in
                                  DispatchQueue.main.async {
                                      if granted {
                                          FeedbackEngine.shared.startRecordingSession(lang: lang)
                                      } else {
                                          FeedbackEngine.shared.voiceStatusHint = lang == .en
                                              ? "Please allow Microphone access in Settings"
                                              : "请在系统设置中允许麦克风权限"
                                      }
                                  }
                              }
                          default:
                              FeedbackEngine.shared.voiceStatusHint = lang == .en
                                  ? "Please allow Speech Recognition in Settings"
                                  : "请在系统设置中允许语音识别权限"
                          }
                      }
                  }
              }

              private func startRecordingSession(lang: AppLanguage) {
                  recognitionTask?.cancel()
                  recognitionTask = nil
                  silenceTimerWorkItem?.cancel()

                  let audioSession = AVAudioSession.sharedInstance()
                  do {
                      try audioSession.setCategory(.playAndRecord, mode: .measurement, options: [.defaultToSpeaker, .allowBluetooth])
                      try audioSession.setActive(true, options: .notifyOthersOnDeactivation)
                  } catch {
                      voiceStatusHint = lang == .en ? "Audio session error" : "音频通道启动失败"
                      return
                  }

                  let req = SFSpeechAudioBufferRecognitionRequest()
                  req.shouldReportPartialResults = true
                  req.contextualStrings = [
                      "f3", "f/3", "f2.8", "f4", "f5.6", "f8", "f11", "f16", "f1.4", "f1.8", "f2",
                      "光圈3", "光圈2.8", "光圈4", "光圈5.6", "光圈8",
                      "快门200", "快门速度200分之一秒", "200分之一秒", "快门125", "快门60", "快门250", "快门500", "快门1000",
                      "距离1.5米", "距离2米", "距离2.5米", "距离3米",
                      "shutter 200", "shutter 125", "aperture 2.8", "aperture 4", "2 meters", "3 meters"
                  ]
                  self.recognitionRequest = req

                  let inputNode = audioEngine.inputNode
                  let recordingFormat = inputNode.outputFormat(forBus: 0)
                  inputNode.removeTap(onBus: 0)
                  inputNode.installTap(onBus: 0, bufferSize: 1024, format: recordingFormat) { buffer, _ in
                      req.append(buffer)
                  }

                  audioEngine.prepare()
                  do {
                      try audioEngine.start()
                      isListening = true
                      recognizedTranscript = ""
                      voiceStatusHint = lang == .en
                          ? "Listening (auto-stops on silence)... Say e.g. 'f3', 'shutter 200'"
                          : "正在聆听(静音自动停止)... 请说“f3”、“快门200”、“距离2米”"
                      // Auto-stop after 4.2s if user doesn't speak at all
                      scheduleSilenceAutoStop(after: 4.2)
                  } catch {
                      voiceStatusHint = lang == .en ? "Microphone failed to start" : "麦克风启动失败"
                      return
                  }

                  let recognizer = SFSpeechRecognizer(locale: Locale(identifier: lang.localeIdentifier)) ?? SFSpeechRecognizer(locale: Locale(identifier: "zh-CN"))
                  recognitionTask = recognizer?.recognitionTask(with: req) { result, error in
                      DispatchQueue.main.async {
                          let engine = FeedbackEngine.shared
                          if let result = result {
                              let text = result.bestTranscription.formattedString
                              engine.recognizedTranscript = text
                              engine.onCommandRecognized?(text)
                              // Auto-stop 1.6s after the user finishes speaking a phrase
                              engine.scheduleSilenceAutoStop(after: 1.6)
                          }
                          if error != nil || (result?.isFinal ?? false) {
                              if engine.isListening {
                                  engine.stopListening()
                              }
                          }
                      }
                  }
              }

              func stopListening() {
                  silenceTimerWorkItem?.cancel()
                  silenceTimerWorkItem = nil
                  if audioEngine.isRunning {
                      audioEngine.stop()
                      audioEngine.inputNode.removeTap(onBus: 0)
                  }
                  recognitionRequest?.endAudio()
                  recognitionTask?.cancel()
                  recognitionRequest = nil
                  recognitionTask = nil
                  isListening = false
                  if !recognizedTranscript.isEmpty {
                      voiceStatusHint = currentLanguage == .en
                          ? "Synced: \"\(recognizedTranscript)\""
                          : "已识别同步：“\(recognizedTranscript)”"
                  } else {
                      voiceStatusHint = ""
                  }
              }
          }

