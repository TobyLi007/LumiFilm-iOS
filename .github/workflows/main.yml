              // Feature 1: Single utterance broadcast with tap-again-to-cancel
              private func toggleSpeakCurrent(powerText: String) {
                  let fStr = String(format: "%.1f", store.aperture).replacingOccurrences(of: ".0", with: "")
                  let dStr = String(format: "%.1f", store.distanceM)
                  let msg: String
                  if store.lang == "en" {
                      msg = "Distance \(dStr) meters, aperture f \(fStr), shutter 1 over \(store.shutterDenom). Set flash power to \(powerText)."
                  } else if store.lang == "ja" {
                      msg = "距離 \(dStr) メートル、絞り f \(fStr)。フラッシュ出力は \(powerText) です。"
                  } else {
                      msg = "距离 \(dStr) 米，光圈 f \(fStr)，快门 \(store.shutterDenom) 分之一秒，闪光灯输出功率 \(powerText)。"
                  }
                  speechManager.toggleSpeak(text: msg, lang: store.lang)
              }
          }

          struct MechanicalRotaryDialView: View {
              @ObservedObject var store: ExposureStore
              let channel: DialChannel
              let accentColor: Color
              let onStep: (Int) -> Void

              @State private var lastDragAngle: Double? = nil
              @State private var accumulatedAngle: Double = 0

              private var currentRotationDegrees: Double {
                  switch channel {
                  case .distance:
                      let ratio = (store.distanceM - 0.5) / 11.5
                      return 135.0 - ratio * 270.0
                  case .power:
                      let minStops = -log2(Double(store.activeFlashSpec.minPowerDenom))
                      let ratio = (store.powerStopOffset - minStops) / max(abs(minStops), 1.0)
                      return 135.0 - ratio * 270.0
                  case .aperture:
                      let list = store.availableApertureSteps
                      let idx = list.enumerated().min(by: { abs($0.element - store.aperture) < abs($1.element - store.aperture) })?.offset ?? 0
                      let ratio = Double(idx) / Double(max(list.count - 1, 1))
                      return 135.0 - ratio * 270.0
                  case .shutter:
                      let list = store.shutterSteps
                      let idx = list.firstIndex(of: store.shutterDenom) ?? 3
                      let ratio = Double(idx) / Double(max(list.count - 1, 1))
                      return 135.0 - ratio * 270.0
                  }
              }

              private var centerReadoutText: String {
                  switch channel {
                  case .distance:
                      return String(format: "%.1fm", store.distanceM)
                  case .power:
                      return store.formatPower(store.powerStopOffset, minDenom: store.activeFlashSpec.minPowerDenom)
                  case .aperture:
                      return String(format: "f/%.1f", store.aperture).replacingOccurrences(of: ".0", with: "")
                  case .shutter:
                      return "1/\(store.shutterDenom)"
                  }
              }

              private var centerSubHint: String {
                  switch channel {
                  case .distance:
                      return store.isDistanceMagnetOn ? "🧲 0.5m SNAP" : "0.1m FINE"
                  case .power:
                      return store.isPowerLocked ? "🔒 LOCKED" : "1/3 EV"
                  case .aperture:
                      return String(format: "MAX f/%.1f", store.lensMaxAperture).replacingOccurrences(of: ".0", with: "")
                  case .shutter:
                      return "X-SYNC \(store.maxSyncDenom)"
                  }
              }

              var body: some View {
                  ZStack {
                      Circle()
                          .fill(
                              AngularGradient(
                                  colors: [
                                      Color(red: 0.76, green: 0.60, blue: 0.36),
                                      Color(red: 0.94, green: 0.84, blue: 0.66),
                                      Color(red: 0.56, green: 0.42, blue: 0.24),
                                      Color(red: 0.88, green: 0.74, blue: 0.50),
                                      Color(red: 0.76, green: 0.60, blue: 0.36)
                                  ],
                                  center: .center
                              )
                          )
                          .frame(width: 190, height: 190)
                          .shadow(color: .black.opacity(0.45), radius: 14, x: 0, y: 8)

                      Circle()
                          .stroke(Color.black.opacity(0.45), style: StrokeStyle(lineWidth: 5, dash: [2.5, 2.5]))
                          .frame(width: 186, height: 186)

                      ZStack {
                          Circle()
                              .fill(
                                  RadialGradient(
                                      colors: [Color(red: 0.22, green: 0.20, blue: 0.18), Color(red: 0.09, green: 0.08, blue: 0.07)],
                                      center: .center,
                                      startRadius: 10,
                                      endRadius: 88
                                  )
                              )
                              .frame(width: 168, height: 168)

                          ForEach(0..<24, id: \.self) { i in
                              let angle = -135.0 + (Double(i) / 23.0) * 270.0
                              let isMagnetNotch = (channel == .distance && store.isDistanceMagnetOn) || (i % 3 == 0)
                              VStack(spacing: 2) {
                                  Rectangle()
                                      .fill(isMagnetNotch ? accentColor : Color.white.opacity(0.35))
                                      .frame(width: isMagnetNotch ? 2.2 : 1.0, height: isMagnetNotch ? 9 : 5)
                                  if channel == .distance && store.isDistanceMagnetOn && i % 2 == 0 {
                                      Circle()
                                          .fill(accentColor.opacity(0.85))
                                          .frame(width: 3.5, height: 3.5)
                                  }
                                  Spacer()
                              }
                              .frame(height: 160)
                              .rotationEffect(.degrees(angle))
                          }
                      }
                      .rotationEffect(.degrees(currentRotationDegrees))
                      .animation(.interactiveSpring(response: 0.18, dampingFraction: 0.75), value: currentRotationDegrees)

                      VStack {
                          Image(systemName: "arrowtriangle.down.fill")
                              .font(.system(size: 12, weight: .black))
                              .foregroundStyle(accentColor)
                              .offset(y: -4)
                          Spacer()
                      }
                      .frame(height: 198)

                      ZStack {
                          Circle()
                              .fill(
                                  LinearGradient(
                                      colors: [Color(red: 0.82, green: 0.66, blue: 0.42), Color(red: 0.52, green: 0.38, blue: 0.20)],
                                      startPoint: .topLeading,
                                      endPoint: .bottomTrailing
                                  )
                              )
                              .frame(width: 90, height: 90)

                          Circle()
                              .fill(Color(red: 0.12, green: 0.11, blue: 0.10))
                              .frame(width: 80, height: 80)

                          VStack(spacing: 2) {
                              Text(channel.rawValue)
                                  .font(.system(size: 9, weight: .bold, design: .monospaced))
                                  .foregroundStyle(accentColor)
                              Text(centerReadoutText)
                                  .font(.system(size: 16, weight: .heavy, design: .monospaced))
                                  .foregroundStyle(.white)
                                  .lineLimit(1)
                                  .minimumScaleFactor(0.7)
                              Text(centerSubHint)
                                  .font(.system(size: 7.5, weight: .bold, design: .monospaced))
                                  .foregroundStyle(.white.opacity(0.65))
                          }
                          .padding(.horizontal, 4)
                      }
                  }
                  .frame(width: 198, height: 198)
                  .contentShape(Circle())
                  .gesture(
                      DragGesture(minimumDistance: 2)
                          .onChanged { value in
                              let center = CGPoint(x: 99, y: 99)
                              let dx = Double(value.location.x - center.x)
                              let dy = Double(value.location.y - center.y)
                              let angle = atan2(dy, dx) * 180.0 / .pi

                              if let last = lastDragAngle {
                                  var delta = angle - last
                                  if delta > 180 { delta -= 360 }
                                  if delta < -180 { delta += 360 }
                                  accumulatedAngle += delta
                                  let threshold = (channel == .distance && store.isDistanceMagnetOn) ? 13.0 : 10.5
                                  if abs(accumulatedAngle) >= threshold {
                                      let steps = Int(accumulatedAngle / threshold)
                                      accumulatedAngle -= Double(steps) * threshold
                                      onStep(steps > 0 ? 1 : -1)
                                  }
                              }
                              lastDragAngle = angle
                          }
                          .onEnded { _ in
                              lastDragAngle = nil
                              accumulatedAngle = 0
                          }
                  )
              }
          }

          // Feature 4 & 5: Glass Metric Tile with Independent Lock Toggle Button (🔒 / 🔓)
          struct LockableGlassMetricTile: View {
              let title: String
              let value: String
              let subtitle: String
